<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b3201f">
<title>Viaje a China</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;
  background:#1c1412;
  color:#2a1a14;
}
button{font-family:system-ui,sans-serif;cursor:pointer}
button:focus-visible{
  outline:3px solid #c8962b;
  outline-offset:3px;
}
[hidden]{display:none!important}

.pista{
  position:fixed;
  top:0;left:0;right:0;
  height:5px;
  background:rgba(255,255,255,.25);
  z-index:19;
  pointer-events:none;
}
.progreso{
  position:fixed;
  top:0;left:0;
  height:5px;
  width:0;
  background:linear-gradient(90deg,#ffd36b,#b3201f);
  z-index:20;
  pointer-events:none;
  transition:width .2s ease;
}

.car{
  height:100vh;
  height:100dvh;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
}
.card{
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  flex-direction:column;
  background:#fbf4e6;
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.art{
  flex:0 0 32vh;
  flex:0 0 32dvh;
  position:relative;
  overflow:hidden;
}
.art svg,.art img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.content{
  position:relative;
  flex:1;
  min-height:0;
}
.txt{
  height:100%;
  overflow-y:auto;
  padding:16px 22px calc(76px + env(safe-area-inset-bottom,0px));
  position:relative;
  z-index:2;
  -webkit-overflow-scrolling:touch;
}
.tag{
  display:inline-block;
  font:600 .75rem system-ui,sans-serif;
  padding:4px 11px;
  border-radius:20px;
  background:#e8d9bd;
  color:#5b4636;
  margin-bottom:8px;
}
.now .tag{background:#b3201f;color:white}
.past .tag{background:#dfe9d8;color:#3c5a35}
.past .art{filter:saturate(.7);opacity:.85}
.day{
  font:600 .9rem system-ui,sans-serif;
  color:#7a6558;
  margin-bottom:5px;
}
.city{
  font-size:1.65rem;
  line-height:1.15;
  margin:0;
  color:#b3201f;
}
.zh{
  font-size:1rem;
  color:#8a6a1f;
  letter-spacing:.1em;
  margin-top:5px;
}
.ttl{
  font-size:1.1rem;
  margin:12px 0 7px;
}
.desc{
  font-size:.97rem;
  line-height:1.5;
  margin:0;
}
.more,.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid rgba(179,32,31,.22);
  border-radius:22px;
  color:#a0221e;
  background:rgba(179,32,31,.06);
  padding:9px 13px;
  font-size:.82rem;
}
.more{margin-top:15px}
.gesture{
  font: .73rem system-ui,sans-serif;
  color:#8b7867;
  margin:8px 0 0;
}

.details{
  position:absolute;
  inset:0;
  z-index:4;
  background:#fbf4e6;
  overflow-y:auto;
  padding:16px 22px calc(76px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch;
  animation:panelIn .25s ease;
}
.details h3{
  color:#b3201f;
  font-size:1.3rem;
  margin:15px 0 8px;
}
.detail-block{margin:17px 0}
.detail-block h4{
  color:#8a6a1f;
  font:600 .86rem system-ui,sans-serif;
  margin:0 0 6px;
}
.detail-block p{
  font-size:.98rem;
  line-height:1.6;
  margin:0;
}
@keyframes panelIn{
  from{opacity:0;transform:translateX(-18px)}
  to{opacity:1;transform:none}
}
.card.entering .txt{
  animation:textIn .45s ease both;
}
@keyframes textIn{
  from{opacity:.35;transform:translateY(9px)}
  to{opacity:1;transform:none}
}

.adorno{
  position:absolute;
  left:0;right:0;bottom:0;
  height:74px;
  opacity:.16;
  pointer-events:none;
  z-index:1;
}
.adorno svg{width:100%;height:100%;display:block}
.bar{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0px));
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  background:rgba(28,20,18,.72);
  color:white;
  font:600 .8rem system-ui,sans-serif;
  padding:6px 14px;
  border-radius:20px;
  white-space:nowrap;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.hero{
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(160deg,#8e1413,#b3201f 55%,#c8962b);
  color:white;
  padding:70px 24px 85px;
}
.hero h1{font-size:2.4rem;margin:0 0 7px}
.hero h2{font-size:2rem;margin:0 0 10px}
.hero .big{font-size:1.5rem;margin:20px 0 8px}
.hero p{font-size:1.05rem;line-height:1.5;margin:5px 0;opacity:.94}
.hero .zh{font-size:1.6rem;color:#ffe3a0}
.hint{
  margin-top:25px;
  font:.9rem system-ui,sans-serif;
  opacity:.8;
}
.hero .adorno{opacity:.25}
.hero .adorno svg{color:#ffe3a0}

#btnInicio,#btnMusica{
  position:fixed;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:12;
  width:38px;height:38px;
  border:0;
  border-radius:50%;
  padding:0;
  background:rgba(28,20,18,.55);
  color:rgba(255,255,255,.85);
  font:600 1rem system-ui,sans-serif;
  display:grid;
  place-items:center;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#btnInicio{left:14px}
#btnMusica{right:14px}
#btnInicio:hover,#btnMusica:hover{
  background:rgba(28,20,18,.75);
  color:white;
}
.sr-only{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
  border:0;
}
@media(max-height:600px){
  .art{flex-basis:26vh;flex-basis:26dvh}
  .txt,.details{padding-top:12px}
  .city{font-size:1.4rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="pista" aria-hidden="true"></div>

<button type="button" id="btnMusica" aria-label="Música de fondo" aria-pressed="false" title="Reproducir música">♪</button>
<div id="audioEstado" class="sr-only" role="status"></div>

    <defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1">

    <rect width="400" height="240" fill="url(#g${i})"/>

}
function sol(x,y,r,c){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".9"/>`;
}
function casa(x,y,w){

  <circle cx="${x+8}" cy="${y-3}" r="4" fill="#d52b20"/>`;
}

const adorno=`<div class="adorno" aria-hidden="true">
<svg viewBox="0 0 400 80" preserveAspectRatio="xMidYMax slice">
<g fill="none" stroke="currentColor" color="#b3201f"
stroke-width="3" stroke-linecap="round">
<path d="M20 62q18 -26 44 -12q10 -22 36 -14q22 -18 42 2q24 -8 34 14"/>
<path d="M150 66q16 -22 40 -12q12 -20 38 -10q20 -16 40 4q22 -6 32 16"/>
<path d="M280 62q16 -24 42 -12q12 -20 36 -10q22 -16 42 6"/>
</g>
<g fill="#c8962b">
<circle cx="200" cy="30" r="4"/>
<circle cx="188" cy="38" r="2.5"/>
<circle cx="212" cy="38" r="2.5"/>
</g></svg></div>`;

const car=document.getElementById("car");
const progreso=document.getElementById("progreso");
const reducido=window.matchMedia("(prefers-reduced-motion: reduce)");

/* Fecha ISO explícita para no depender del formato del navegador. */
function fechaZona(zona){
  const partes=new Intl.DateTimeFormat("en",{
    timeZone:zona,year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  const valor=tipo=>partes.find(p=>p.type===tipo).value;
  return `${valor("year")}-${valor("month")}-${valor("day")}`;
}
const parametro=new URLSearchParams(location.search).get("fecha");
function fechaValida(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  const n=new Date(s+"T00:00:00Z");
  return !isNaN(n) && n.toISOString().slice(0,10)===s;
}
const fechaPrueba=fechaValida(parametro)?parametro:null;
function hoy(){return fechaPrueba||fechaZona("Asia/Shanghai")}
function distancia(a,b){
  return Math.round(
    (Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000
  );
}
function fechaTexto(s){
  return new Intl.DateTimeFormat("es-ES",{
    timeZone:"UTC",day:"numeric",month:"long"
  }).format(new Date(s+"T00:00:00Z"));
}
function diaSemana(s){
  const texto=new Intl.DateTimeFormat("es-ES",{
    timeZone:"UTC",weekday:"short"
  }).format(new Date(s+"T00:00:00Z"));
  return texto.charAt(0).toUpperCase()+texto.slice(1);
}

let fechaMostrada="";
let observador=null;

function actualizarProgreso(){
  const total=car.scrollHeight-car.clientHeight;
  const porcentaje=total>0?car.scrollTop/total*100:0;
  progreso.style.width=Math.max(0,Math.min(100,porcentaje))+"%";
}

function generarWeb(irAHoy){
  const fecha=hoy();
  fechaMostrada=fecha;
  const actual=D.find(d=>d.fecha===fecha);
  const primera=D[0].fecha;
  const ultima=D[D.length-1].fecha;

  let estado="";
  if(fecha<primera){
    const faltan=distancia(fecha,primera);
    estado=`<div class="big">Faltan ${faltan} ${faltan===1?"día":"días"}</div>
    <p>para empezar nuestra aventura</p>`;
  }else if(fecha>ultima){
    estado=`<div class="big">¡Ya hemos vuelto!</div>
    <p>Gracias por acompañarnos</p>`;
  }else{
    estado=`<div class="big">Hoy: ${actual.ciudad}</div>
    <p>${actual.titulo}</p>`;
  }

  let html=`<section class="card hero">
    <h1>Viaje a China</h1>
    <div class="zh">中国</div>
    ${estado}
    <p>${fechaTexto(primera)} – ${fechaTexto(ultima)}</p>
    <div class="hint">Desliza hacia arriba ↑</div>
    ${adorno}
  </section>`;

  D.forEach((d,n)=>{
    if(d.fecha>fecha)return;
    const actual=d.fecha===fecha;
    html+=`<section class="card day-card ${actual?"now":"past"}"
      data-fecha="${d.fecha}" aria-label="${fechaTexto(d.fecha)}: ${d.ciudad}">
      <div class="art">
        ${ilustracion(d,n)}
        <img src="fotos/dia-${d.fecha.slice(5)}.jpg"
          alt="${d.ciudad}" loading="lazy" onerror="this.remove()">
      </div>
      <div class="content">
        ${adorno}
        <div class="txt" id="resumen-${n}">
          <span class="tag">${actual?"📍 Hoy":"✓ Día pasado"} · Día ${n+1} de ${D.length}</span>
          <div class="day">${diaSemana(d.fecha)} ${fechaTexto(d.fecha)}</div>
          <h2 class="city">${d.ciudad}</h2>
          <div class="zh">${d.zh}</div>
          <h3 class="ttl">${d.titulo}</h3>
          <p class="desc">${d.resumen}</p>
          <button type="button" class="more"
            aria-expanded="false" aria-controls="detalle-${n}">
            ＋ Más detalles
          </button>
          <p class="gesture">También puedes deslizar hacia la derecha →</p>
        </div>
        <div class="details" id="detalle-${n}" hidden
          role="region" aria-label="Información ampliada del ${fechaTexto(d.fecha)}">
          <button type="button" class="back">← Resumen</button>
          <div class="day" style="margin-top:14px">${fechaTexto(d.fecha)}</div>
          <h3>${d.titulo}</h3>
          ${d.detalles.map(([t,p])=>`
          <section class="detail-block">
            <h4>${t}</h4><p>${p}</p>
          </section>`).join("")}
          <p class="gesture">Desliza hacia la izquierda para volver ←</p>
        </div>
      </div>
    </section>`;
  });

  const siguiente=D.find(d=>d.fecha>fecha);
  if(siguiente){
    const faltan=distancia(fecha,siguiente.fecha);
    html+=`<section class="card hero">
      <h2>Próxima etapa</h2>
      <div class="zh">${siguiente.zh}</div>
      <div class="big">${siguiente.ciudad}</div>
      <p>${siguiente.titulo}</p>
      <p>Se descubre el ${fechaTexto(siguiente.fecha)}</p>
      <div class="hint">${faltan===1?"Mañana, un nuevo día del viaje":
        `Faltan ${faltan} días`}</div>
      ${adorno}
    </section>`;
  }

  if(observador)observador.disconnect();
  car.innerHTML=html;

  if("IntersectionObserver" in window){
    observador=new IntersectionObserver(entradas=>{
      entradas.forEach(entrada=>{
        entrada.target.classList.toggle("entering",entrada.isIntersecting);
      });
    },{root:car,threshold:.6});
    car.querySelectorAll(".day-card").forEach(c=>observador.observe(c));
  }

  if(irAHoy){
    const tarjeta=car.querySelector(".now");
    car.scrollTop=tarjeta?tarjeta.offsetTop:0;
  }
  actualizarProgreso();
}

/* Panel ampliado: botón y gesto lateral. */
function cambiarDetalle(card,abrir,enfocar){
  const resumen=card.querySelector(".txt");
  const panel=card.querySelector(".details");
  const boton=resumen.querySelector(".more");

  panel.hidden=!abrir;
  resumen.hidden=abrir;
  boton.setAttribute("aria-expanded",String(abrir));

  if(abrir){
    panel.scrollTop=0;
    if(enfocar)panel.querySelector(".back").focus();
  }else if(enfocar){
    boton.focus();
  }
}

car.addEventListener("click",e=>{
  const abrir=e.target.closest(".more");
  const cerrar=e.target.closest(".back");
  if(abrir)cambiarDetalle(abrir.closest(".day-card"),true,true);
  if(cerrar)cambiarDetalle(cerrar.closest(".day-card"),false,true);
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  const panel=car.querySelector(".details:not([hidden])");
  if(panel)cambiarDetalle(panel.closest(".day-card"),false,true);
});

let toque=null;
car.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){toque=null;return}
  const card=e.target.closest(".day-card");
  if(!card || e.target.closest("button,a")){toque=null;return}
  toque={
    card,x:e.touches[0].clientX,y:e.touches[0].clientY
  };
},{passive:true});

car.addEventListener("touchend",e=>{
  if(!toque || !e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-toque.x;
  const dy=e.changedTouches[0].clientY-toque.y;
  const card=toque.card;
  toque=null;

  /* Un movimiento vertical no activa el panel. */
  if(Math.abs(dx)<65 || Math.abs(dx)<Math.abs(dy)*1.6)return;

  const abierto=!card.querySelector(".details").hidden;
  if(dx>0 && !abierto)cambiarDetalle(card,true,false);
  if(dx<0 && abierto)cambiarDetalle(card,false,false);
},{passive:true});

car.addEventListener("touchcancel",()=>{toque=null},{passive:true});
car.addEventListener("scroll",actualizarProgreso,{passive:true});
window.addEventListener("resize",actualizarProgreso);

document.getElementById("btnInicio").addEventListener("click",()=>{
  car.querySelectorAll(".details:not([hidden])").forEach(panel=>{
    cambiarDetalle(panel.closest(".day-card"),false,false);
  });
  car.scrollTo({top:0,behavior:reducido.matches?"auto":"smooth"});
});

/* Reloj y actualización al cambiar el día en China. */
function reloj(){
  const ahora=new Date();
  const hora=zona=>new Intl.DateTimeFormat("es-ES",{
    timeZone:zona,hour:"2-digit",minute:"2-digit"
  }).format(ahora);
  document.getElementById("bar").textContent=
    "🇨🇳 "+hora("Asia/Shanghai")+" · 🇪🇸 "+hora("Europe/Madrid");

  if(hoy()!==fechaMostrada)generarWeb(true);
}
generarWeb(true);
reloj();
setInterval(reloj,30000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)reloj();
});

/* Audio: un mismo reproductor durante toda la navegación. */
const musica=document.getElementById("musica");
const btnMusica=document.getElementById("btnMusica");
const audioEstado=document.getElementById("audioEstado");
musica.volume=.35;

function actualizarAudio(){
  const activo=!musica.paused && !musica.ended;
  btnMusica.textContent=activo?"⏸":"♪";
  btnMusica.setAttribute("aria-pressed",String(activo));
  btnMusica.title=activo?"Pausar música":"Reproducir música";
}
musica.addEventListener("play",actualizarAudio);
musica.addEventListener("pause",actualizarAudio);
musica.addEventListener("ended",actualizarAudio);

btnMusica.addEventListener("click",async()=>{
  if(!musica.paused){
    musica.pause();
    return;
  }
  try{
    await musica.play();
    audioEstado.textContent="Música activada";
  }catch(error){
    audioEstado.textContent=
      "No se ha podido reproducir la música. Comprueba el archivo de audio.";
    btnMusica.title="No se pudo reproducir: vuelve a intentarlo";
    actualizarAudio();
  }
});

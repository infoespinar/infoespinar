<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght=300;400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', sans-serif; background-color: transparent; padding: 8px 4px; overflow-y: auto; overflow-x: hidden; }

  /* Header Unificado */
  .header-seccion { padding: 15px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; text-align: center; }
  .header-titulo { font-size: 22px; font-weight: 900; color: #1e3a8a; margin: 0; text-transform: uppercase; }
  .header-titulo span { color: #15803d; }
  .header-sub { font-size: 12px; color: #64748b; margin-top: 5px; }

  /* Contenedor Grid */
  .grid-comercios { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; padding-bottom: 25px; visibility: hidden; }
  
  /* Tarjeta - Mismo estilo que resto de secciones */
  .tarjeta-comercio { background: #ffffff; border: 1px solid #e2e8f0; border-top: 4px solid #14532d; border-radius: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; }
  .info-comercio { padding: 20px; flex-grow: 1; }
  .nombre-comercio { font-size: 19px; font-weight: 700; color: #14532d; margin-bottom: 15px; line-height: 1.3; }
  
  /* Buscador */
  .contenedor-buscador { margin-bottom: 20px; width: 100%; }
  .input-buscador { width: 100%; padding: 14px 16px; font-size: 15px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; transition: border-color 0.2s; }
  .input-buscador:focus { border-color: #14532d; }

  /* Botones */
  .btn { text-decoration: none; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-llamar { background: #000; flex: 1; }
</style>

<div class="header-seccion">
    <h1 class="header-titulo">Info<span>Espinar</span></h1>
    <p class="header-sub">Directorio de salud y servicios médicos</p>
</div>

<div class="contenedor-buscador">
  <input type="text" id="buscadorSalud" class="input-buscador" placeholder="🔍 Buscar centro médico, farmacia, dentista...">
</div>

<div class="grid-comercios" id="gridComercios">
  <div class="tarjeta-comercio" data-oficial="true" data-search="centro salud el espinar">
    <div class="info-comercio">
      <div class="nombre-comercio">Centro de Salud de El Espinar</div>
      <a href="tel:+34921181234" class="btn btn-llamar">📞 Llamar</a>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const contenedor = document.getElementById("gridComercios");
  const buscador = document.getElementById("buscadorSalud");
  const tarjetas = Array.from(document.querySelectorAll(".tarjeta-comercio"));
  
  const oficiales = tarjetas.filter(t => t.dataset.oficial === "true");
  const privadas = tarjetas.filter(t => t.dataset.oficial !== "true");
  
  for (let i = privadas.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [privadas[i], privadas[j]] = [privadas[j], privadas[i]];
  }
  
  contenedor.innerHTML = '';
  oficiales.forEach(t => contenedor.appendChild(t));
  privadas.forEach(t => contenedor.appendChild(t));
  
  contenedor.style.visibility = "visible";
  
  buscador.addEventListener("input", function() {
    const termino = this.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    document.querySelectorAll(".tarjeta-comercio").forEach(tarjeta => {
      const textoBusqueda = (tarjeta.dataset.search || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      tarjeta.style.display = textoBusqueda.includes(termino) ? "flex" : "none";
    });
    actualizarAltura();
  });

  actualizarAltura();
});

function actualizarAltura() {
  if(window.parent && window.parent.postMessage) {
    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight + 40 }, '*');
  }
}
window.addEventListener('resize', actualizarAltura);
window.addEventListener('load', actualizarAltura);
setTimeout(actualizarAltura, 500);
setTimeout(actualizarAltura, 1500);
</script>

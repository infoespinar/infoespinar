<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particulares | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --menta:#20a088;
    --fondo:#f4f6f9;
}

body{
    font-family:'Lato',sans-serif;
    background:var(--fondo);
    color:#334155;
}

.header{
    background:var(--menta);
    color:white;
    text-align:center;
    padding:30px 20px;
}

.header-logo-link{
    display:inline-flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.08);
    padding:8px 16px;
    border-radius:30px;
}

.header-bandera{
    width:32px;
    height:32px;
    object-fit:cover;
    border-radius:6px;
}

.formulario-publicar{
    max-width:600px;
    margin:20px auto;
    padding:25px;
    background:white;
    border-radius:16px;
    display:none;
    border:1px solid #e2e8f0;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

#titulo{
    text-transform:uppercase;
}

.btn-accion{
    width:100%;
    padding:14px;
    background:var(--menta);
    color:white;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

.grid-anuncios{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:0 auto;
}

.tarjeta{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.tarjeta img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.tarjeta-body{
    padding:18px;
}

.loading{
    text-align:center;
    padding:40px;
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="header-logo-link">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div style="text-align:center;margin:20px;">
    <button onclick="toggleForm()" class="btn-accion" style="max-width:300px;">
        ➕ PUBLICAR NUEVO ANUNCIO
    </button>
</div>

<div id="contenedor-formulario" class="formulario-publicar">

<form id="formPublicar">

<input
type="text"
id="titulo"
placeholder="TÍTULO"
required
oninput="this.value=this.value.toUpperCase()"
>

<select id="estado" required>
<option value="">Estado del artículo...</option>
<option>NUEVO</option>
<option>BUEN ESTADO</option>
<option>MUY USADO</option>
<option>PARA RESTAURAR</option>
</select>

<textarea
id="descripcion"
placeholder="Descripción"
required
rows="4"
></textarea>

<input
type="number"
id="precio"
placeholder="Precio (€)"
required
>

<select id="recogida" required>
<option value="">Lugar de recogida...</option>
<option>EL ESPINAR</option>
<option>SAN RAFAEL</option>
<option>LASR</option>
<option>LA ESTACIÓN</option>
</select>

<input
type="tel"
id="contacto"
placeholder="Teléfono"
required
pattern="[0-9]{9}"
maxlength="9"
>

<input
type="file"
id="foto"
accept="image/*"
style="border:none;"
>

<button
type="submit"
id="btnPublicar"
class="btn-accion"
>
PUBLICAR ANUNCIO
</button>

</form>

<div id="status" style="margin-top:10px;text-align:center;"></div>

</div>

<div id="tablon" class="grid-anuncios">
<div class="loading">Cargando anuncios...</div>
</div>

<script>

const urlScript =
"https://script.google.com/macros/s/AKfycbzPmN9-GeOe9EfKUSvCZR0rpUlJ6ebJ3lo0_q8WHwQLVGjiYIaQSGJuvglXmJrQC6CP/exec";

function toggleForm(){
    const f=document.getElementById("contenedor-formulario");

    f.style.display=
    f.style.display==="block"
    ?"none"
    :"block";
}

document
.getElementById("formPublicar")
.addEventListener("submit",enviar);

async function enviar(e){

    e.preventDefault();

    const btn=document.getElementById("btnPublicar");
    const status=document.getElementById("status");

    btn.disabled=true;
    btn.innerText="PUBLICANDO...";

    status.innerHTML="Subiendo anuncio...";

    try{

        const imagenBase64=
        await getBase64(
            document.getElementById("foto").files[0]
        );

        const datos=new URLSearchParams();

        datos.append(
            "titulo",
            document.getElementById("titulo").value
        );

        datos.append(
            "estado",
            document.getElementById("estado").value
        );

        datos.append(
            "descripcion",
            document.getElementById("descripcion").value
        );

        datos.append(
            "precio",
            document.getElementById("precio").value
        );

        datos.append(
            "recogida",
            document.getElementById("recogida").value
        );

        datos.append(
            "contacto",
            document.getElementById("contacto").value
        );

        datos.append(
            "imagenBase64",
            imagenBase64
        );

        const res=await fetch(urlScript,{
            method:"POST",
            body:datos
        });

        const texto=await res.text();

        console.log(texto);

        if(texto.includes("ok")){

            status.innerHTML=
            "<span style='color:green;font-weight:700;'>Anuncio publicado correctamente</span>";

            cargar();

            document
            .getElementById("formPublicar")
            .reset();

        }else{

            status.innerHTML=
            "<span style='color:red;font-weight:700;'>Error real del servidor</span>";

        }

    }catch(err){

        console.error(err);

        status.innerHTML=
        "<span style='color:red;font-weight:700;'>Error al publicar</span>";

    }

    btn.disabled=false;
    btn.innerText="PUBLICAR ANUNCIO";
}

async function getBase64(file){

    if(!file) return "";

    return new Promise(resolve=>{

        const reader=new FileReader();

        reader.onload=()=>{
            resolve(reader.result);
        };

        reader.readAsDataURL(file);

    });
}

async function cargar(){

    const tablon=document.getElementById("tablon");

    try{

        const res=await fetch(urlScript);

        const data=await res.json();

        tablon.innerHTML="";

        data.forEach(a=>{

            tablon.innerHTML+=`

            <div class="tarjeta">

                ${
                    a.imagen
                    ?`<img src="${a.imagen}">`
                    :""
                }

                <div class="tarjeta-body">

                    <h3 style="color:#20a088;margin-bottom:10px;">
                        ${a.titulo || ""}
                    </h3>

                    <p style="margin-bottom:10px;">
                        ${a.descripcion || ""}
                    </p>

                    <p>
                        <strong>${a.precio || "0"}€</strong>
                    </p>

                </div>

            </div>

            `;

        });

    }catch(err){

        console.error(err);

        tablon.innerHTML=
        "<div class='loading'>Error al cargar anuncios</div>";
    }
}

cargar();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleo Local | infoespinar.com</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Lato', sans-serif; background-color: #f4f6f9; color: #334155; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; text-align: center; padding: 25px 20px; }
        .header-logo-link { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: white; background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 30px; }
        .header-bandera { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; }
        .header h1 { font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .main-container { max-width: 1200px; width: 100%; margin: 0 auto; padding: 15px 12px 40px; flex-grow: 1; }
        .titulo-seccion-principal { font-size: 26px; font-weight: 900; text-align: center; margin: 20px 0 6px; text-transform: uppercase; color: #1e293b; }
        .subtitulo-seccion { text-align: center; font-size: 15px; color: #64748b; margin-bottom: 24px; }
        .aviso-caducidad { background: #fef9c3; border-left: 4px solid #eab308; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: #854d0e; }
        .navegacion { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .btn-pestana { background: #f1f5f9; border: none; padding: 10px 20px; font-weight: 700; border-radius: 8px; cursor: pointer; color: #475569; }
        .btn-pestana.activa { background: #1e293b; color: #fff; }
        .seccion-app { display: none; }
        .seccion-app.activa { display: block; }
        .contenedor-buscador { margin-bottom: 20px; display: none; }
        .contenedor-buscador.activo { display: block; }
        .input-buscador { width: 100%; padding: 14px 16px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; }
        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .tarjeta-anuncio { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 10px -1px rgba(0,0,0,0.06); }
        .tarjeta-anuncio.oculta { display: none !important; }
        .titulo-anuncio { font-size: 18px; font-weight: 900; color: #1e293b; margin-bottom: 12px; }
        .meta-anuncio { display: flex; gap: 8px; margin-bottom: 12px; font-size: 12px; color: #475569; font-weight: 700; }
        .desc-anuncio { font-size: 14px; color: #475569; margin-bottom: 16px; white-space: pre-line; }
        .btn-contacto { display: block; background: #25d366; color: #fff; padding: 10px; border-radius: 10px; text-decoration: none; text-align: center; font-weight: 700; }
        .formulario-publicar { background: #fff; padding: 26px; border-radius: 14px; border: 1px solid #cbd5e1; max-width: 660px; margin: 0 auto; }
        .grupo-campo { margin-bottom: 20px; }
        .grupo-campo label { display: block; font-weight: 700; margin-bottom: 7px; }
        .grupo-campo input, .grupo-campo select, .grupo-campo textarea { width: 100%; padding: 11px; border: 1px solid #94a3b8; border-radius: 8px; }
        .btn-enviar { width: 100%; padding: 14px; background: #1e293b; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .footer { background-color: #1e293b; color: #94a3b8; text-align: center; padding: 25px; margin-top: 30px; font-size: 13px; }
    </style>
</head>

<body>
<header class="header">
    <a href="index.html" class="header-logo-link">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera" alt="Bandera">
        <h1>infoespinar.com</h1>
    </a>
</header>

<main class="main-container">
    <h2 class="titulo-seccion-principal">Empleo Local</h2>
    <div class="aviso-caducidad">⏳ Los anuncios se eliminan automáticamente a los 20 días</div>
    <div class="navegacion">
        <button class="btn-pestana activa" onclick="cambiar('tablon-sec', event)">📌 Ver Tablón</button>
        <button class="btn-pestana" onclick="cambiar('form-sec', event)">➕ Publicar Anuncio</button>
    </div>

    <div id="buscador-cont" class="contenedor-buscador activo">
        <input type="text" id="txtBuscador" class="input-buscador" placeholder="🔍 Buscar..." oninput="filtrarAnuncios()">
    </div>

    <div id="tablon-sec" class="seccion-app activa">
        <div id="loading" class="cargando">Cargando bolsa de empleo...</div>
        <div id="tablon" class="grid-anuncios"></div>
    </div>

    <div id="form-sec" class="seccion-app">
        <div class="formulario-publicar">
            <form id="formAnuncio" onsubmit="enviar(event)">
                <div class="grupo-campo"><label>¿Qué buscas?</label>
                    <select id="buscasUOfreces" required><option value="BUSCO">Busco empleo</option><option value="OFREZCO">Busco personal</option></select>
                </div>
                <div class="grupo-campo"><label>Título</label><input id="titulo" required oninput="this.value=this.value.toUpperCase()"></div>
                <div class="grupo-campo"><label>Jornada</label><select id="jornada" required><option>Jornada Completa</option><option>Jornada Parcial</option><option>Fines de Semana</option></select></div>
                <div class="grupo-campo"><label>Descripción</label><textarea id="descripcion" required rows="5"></textarea></div>
                <div class="grupo-campo"><label>Teléfono</label><input id="telefono" type="tel" required pattern="[0-9]{9}" maxlength="9"></div>
                <div class="grupo-campo"><label>Email</label><input id="email" type="email"></div>
                <button class="btn-enviar" id="btnPublicar">🚀 Publicar</button>
            </form>
            <div id="status"></div>
        </div>
    </div>
</main>

<footer class="footer">© 2026 InfoEspinar</footer>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbxYYe_KcumXkwn_FYgrXOzIjioAK6VroEfklMnSKaR153Fqji6mr2eSwguiT1WI65az/exec";

function cambiar(id, e) {
    document.querySelectorAll('.seccion-app').forEach(s => s.classList.remove('activa'));
    document.getElementById(id).classList.add('activa');
    document.querySelectorAll('.btn-pestana').forEach(b => b.classList.remove('activa'));
    if (e && e.target) e.target.classList.add('activa');
    document.getElementById("buscador-cont").classList.toggle('activo', id === "tablon-sec");
    if (id === "tablon-sec") cargar();
}

function filtrarAnuncios() {
    const termino = document.getElementById("txtBuscador").value.toLowerCase().trim();
    document.querySelectorAll(".tarjeta-anuncio").forEach(t => {
        t.classList.toggle("oculta", !t.getAttribute("data-search").toLowerCase().includes(termino));
    });
}

async function cargar() {
    const loading = document.getElementById("loading");
    const cont = document.getElementById("tablon");
    loading.style.display = "block";
    cont.innerHTML = "";
    try {
        const res = await fetch(urlScript);
        const data = await res.json();
        loading.style.display = "none";
        const anuncios = data.filter(a => a.titulo && a.titulo.trim() !== "");
        
        anuncios.forEach((a) => {
            let tlf = (a.contacto || "").toString().replace(/\s+/g, '');
            if (tlf && !tlf.startsWith('34')) tlf = '34' + tlf;
            
            const metaBusqueda = `${a.titulo} ${a.descripcion} ${a.jornada}`;
            cont.innerHTML += `
                <div class="tarjeta-anuncio" data-search="${metaBusqueda.replace(/"/g, '&quot;')}">
                    <h3 class="titulo-anuncio">${a.titulo}</h3>
                    <div class="meta-anuncio"><span>⏱️ ${a.jornada}</span></div>
                    <p class="desc-anuncio">${a.descripcion}</p>
                    <a class="btn-contacto" href="https://wa.me/${tlf}" target="_blank">💬 Contactar por WhatsApp</a>
                </div>`;
        });
    } catch (err) { loading.innerText = "Error al cargar anuncios."; }
}

async function enviar(e) {
    e.preventDefault();
    const btn = document.getElementById("btnPublicar");
    btn.disabled = true;
    const payload = {
        buscasUOfreces: document.getElementById("buscasUOfreces").value,
        titulo: document.getElementById("titulo").value.toUpperCase(),
        jornada: document.getElementById("jornada").value,
        descripcion: document.getElementById("descripcion").value,
        telefono: document.getElementById("telefono").value,
        email: document.getElementById("email").value
    };
    try {
        const res = await fetch(urlScript, { method: "POST", body: JSON.stringify(payload) });
        if ((await res.json()).resultado === "ok") {
            document.getElementById("status").innerHTML = "¡Publicado correctamente!";
            document.getElementById("formAnuncio").reset();
            setTimeout(() => { document.getElementById("status").innerHTML = ""; cambiar('tablon-sec'); }, 2000);
        }
    } catch (error) { alert("Error de red"); } finally { btn.disabled = false; }
}

cargar();
</script>
</body>
</html>

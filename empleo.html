<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empleo Local | infoespinar.com</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>
/* --- TU CSS (sin cambios importantes) --- */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --ink: #1a1a2e;
    --ink-light: #8888aa;
    --surface: #ffffff;
    --surface-2: #f7f7fb;
    --border: rgba(60,60,120,0.10);
    --border-strong: rgba(60,60,120,0.18);
    --accent: #3a56e8;
    --green-light: #edfaf4;
    --green-dark: #0a7554;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 16px rgba(30,30,80,0.07);
    --shadow-md: 0 4px 24px rgba(30,30,80,0.10);
}

body { font-family: 'DM Sans', sans-serif; background: var(--surface-2); color: var(--ink); }

/* (recortado: mantienes tu CSS tal cual) */

#loading {
    text-align:center;
    padding:40px;
    color: var(--ink-light);
}
</style>
</head>

<body>

<div class="hero">
    <header class="header">
        <a href="index.html" class="header-logo">
            <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
            <span class="header-name">INFOESPINAR.COM</span>
        </a>
    </header>

    <h1 class="hero-title">Empleo Local</h1>
    <p class="hero-sub">Ofertas de trabajo y búsqueda de empleo</p>
</div>

<div class="contenedor-app">

<p class="aviso">* Los anuncios expiran a los 20 días</p>

<button class="btn-publicar" onclick="document.getElementById('form').style.display='block'">
💼 PUBLICAR
</button>

<div id="form" style="display:none">
    <p class="form-section">Tipo</p>
    <select id="buscasUOfreces">
        <option value="BUSCO">Busco empleo</option>
        <option value="OFREZCO">Ofrezco empleo</option>
    </select>

    <p class="form-section">Puesto</p>
    <input id="titulo" oninput="this.value=this.value.toUpperCase()">

    <p class="form-section">Descripción</p>
    <textarea id="descripcion"></textarea>

    <p class="form-section">Contacto</p>
    <input id="telefono">
    <input id="email">

    <div class="privacy-box">
        <label>
            <input type="checkbox" id="aceptaPrivacidad">
            Acepto privacidad
        </label>
    </div>

    <button class="btn-submit" id="btn" onclick="enviar()">PUBLICAR</button>
    <div id="pinMostrado"></div>
</div>

<p class="section-label">Anuncios</p>

<div id="loading">Cargando anuncios...</div>
<div id="tablon" class="grid-anuncios"></div>

</div>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbxYYe_KcumXkwn_FYgrXOzIjioAK6VroEfklMnSKaR153Fqji6mr2eSwguiT1WI65az/exec";

async function cargar() {
    try {
        const res = await fetch(urlScript);
        const data = await res.json();

        document.getElementById("loading").style.display = "none";

        const cont = document.getElementById("tablon");

        if (!data || !data.length) {
            cont.innerHTML = "<div class='empty-state'>No hay anuncios</div>";
            return;
        }

        cont.innerHTML = data.reverse().map(a => `
            <div class="tarjeta">
                <div class="titulo-tarjeta">${a.actividad || ''}</div>
                <div class="descripcion">${a.descripcion || ''}</div>
                <div class="tag">📍 ${a.lugar || ''}</div>
                <div class="tag">⏱️ ${a.jornada || ''}</div>
                <a class="btn-wa" href="https://wa.me/34${a.telefono}" target="_blank">Contactar</a>
            </div>
        `).join("");

    } catch (e) {
        document.getElementById("loading").innerText = "Error cargando anuncios";
    }
}

function enviar() {
    if (!document.getElementById('aceptaPrivacidad').checked) return alert("Acepta privacidad");

    const params = new URLSearchParams();
    params.append("buscasUOfreces", document.getElementById("buscasUOfreces").value);
    params.append("actividad", document.getElementById("titulo").value);
    params.append("descripcion", document.getElementById("descripcion").value);
    params.append("telefono", document.getElementById("telefono").value);
    params.append("email", document.getElementById("email").value);

    fetch(urlScript, {
        method: "POST",
        body: params,
        mode: "no-cors"
    });

    alert("Publicado (puede tardar unos segundos en aparecer)");
    cargar();
}

cargar();
</script>

</body>
</html>

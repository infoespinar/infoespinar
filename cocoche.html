<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Viajes Compartidos | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');
        :root { --menta: #20a088; }
        body { font-family: 'Lato', sans-serif; background: #f4f6f9; color: #334155; padding-bottom: 50px; }
        
        .header { background: var(--menta); color: white; text-align: center; padding: 25px 20px; }
        .header-logo-link { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
        .header-bandera { width: 32px; height: 32px; border-radius: 6px; }
        
        .main-container { max-width: 600px; margin: 20px auto; padding: 20px; }
        .btn-publicar { width: 100%; padding: 15px; background: var(--menta); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
        
        form { background: white; padding: 20px; border-radius: 14px; display: none; border: 1px solid #e2e8f0; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; }
        
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--menta); }
        .oculto { display: none; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="header-logo-link">
            <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera" alt="Bandera"> 
            <h1>infoespinar.com</h1>
        </a>
    </header>

    <main class="main-container">
        <button class="btn-publicar" id="btnToggle" onclick="toggleForm()">➕ PUBLICAR VIAJE</button>

        <form id="formViaje">
            <select id="tipo"><option>🚘 Conductor</option><option>🙋 Pasajero</option></select>
            <select id="desde" onchange="checkOtro('desde')">
                <option value="">Desde...</option>
                <option>El Espinar</option><option>San Rafael</option><option>LASR</option>
                <option>La Estación</option><option>Madrid</option><option>Segovia</option>
                <option>Ávila</option><option value="Otro">Otro</option>
            </select>
            <input id="desdeOtro" class="oculto" placeholder="Origen personalizado">
            
            <select id="hasta" onchange="checkOtro('hasta')">
                <option value="">Hasta...</option>
                <option>El Espinar</option><option>San Rafael</option><option>LASR</option>
                <option>La Estación</option><option>Madrid</option><option>Segovia</option>
                <option>Ávila</option><option value="Otro">Otro</option>
            </select>
            <input id="hastaOtro" class="oculto" placeholder="Destino personalizado">
            
            <input id="fecha" type="date">
            <input id="hora" type="time">
            <input id="nombre" placeholder="Nombre" required>
            <input id="telefono" type="tel" placeholder="Teléfono" maxlength="9" required>
            <button type="button" class="btn-publicar" style="background: #25d366;" onclick="enviarWhatsApp()">
    💬 Compartir por WhatsApp</button>
            <button class="btn-publicar" type="submit">PUBLICAR VIAJE</button>
        </form>

        <div id="grid">Cargando viajes...</div>
    </main>

    <script>
        const URL = "https://script.google.com/macros/s/AKfycbwjuHCwcSSBL4AGzlYiTTzCwdAqwpqKLUZSYmOpUm1uOl_yx9iXCOLsxu3CAWf3lUeB/exec";

        function toggleForm() {
            const f = document.getElementById('formViaje');
            f.style.display = (f.style.display === 'block') ? 'none' : 'block';
        }

        
        function enviarWhatsApp() {
    const tipo = document.getElementById('tipo').value;
    const nombre = document.getElementById('nombre').value;
    const fecha = document.getElementById('fecha').value;
    const hora = document.getElementById('hora').value;
    
    // Obtenemos los valores considerando el campo "Otro"
    const desde = document.getElementById('desde').value === 'Otro' 
                  ? document.getElementById('desdeOtro').value 
                  : document.getElementById('desde').value;
    const hasta = document.getElementById('hasta').value === 'Otro' 
                  ? document.getElementById('hastaOtro').value 
                  : document.getElementById('hasta').value;

    // Validación básica
    if (!nombre || !desde || !hasta || !fecha || !hora) {
        alert("Por favor, rellena los campos antes de enviar el WhatsApp.");
        return;
    }

    let mensaje = "";
    if (tipo.includes("CONDUCTOR")) {
        mensaje = `Hola, soy ${nombre}. Voy a viajar desde ${desde} hasta ${hasta} el ${fecha} a las ${hora}. Si te interesa viajar conmigo, escríbeme.`;
    } else {
        mensaje = `Hola, soy ${nombre}. Busco viaje desde ${desde} hasta ${hasta} el ${fecha} a las ${hora}. Si tienes sitio, escríbeme.`;
    }

    // Abrir WhatsApp
    window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, "_blank");
}
        
        function checkOtro(id) {
            const sel = document.getElementById(id);
            const input = document.getElementById(id + 'Otro');
            input.classList.toggle('oculto', sel.value !== 'Otro');
        }

        document.getElementById('formViaje').onsubmit = async (e) => {
            e.preventDefault();
            const desde = document.getElementById('desde').value === 'Otro' ? document.getElementById('desdeOtro').value : document.getElementById('desde').value;
            const hasta = document.getElementById('hasta').value === 'Otro' ? document.getElementById('hastaOtro').value : document.getElementById('hasta').value;
            const fecha = document.getElementById('fecha').value;

            if(desde === hasta) return alert("Origen y destino no pueden ser iguales");
            if(new Date(fecha) < new Date().setHours(0,0,0,0)) return alert("La fecha es anterior a la fecha actual.");

            const payload = {
                tipo: document.getElementById('tipo').value,
                desde, hasta, fecha,
                hora: document.getElementById('hora').value,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value
            };

            await fetch(URL, { method: "POST", body: JSON.stringify(payload) });
            alert("¡Publicado!");
            location.reload();
        };

        async function cargar() {
            const res = await fetch(URL);
            const data = await res.json();
            const grid = document.getElementById('grid');
            
            // Ordenar por fecha y hora
            data.sort((a, b) => new Date(a.fecha + 'T' + a.hora) - new Date(b.fecha + 'T' + b.hora));
            
            grid.innerHTML = data.map(v => `
                <div class="card">
                    <strong>${v.tipo}</strong> | 📅 ${v.fecha} ${v.hora}<br>
                    📍 ${v.desde} ➔ ${v.hasta}<br>
                    👤 ${v.nombre} | 📞 ${v.telefono}
                </div>
            `).join("");
        }
        cargar();
    </script>
</body>
</html>

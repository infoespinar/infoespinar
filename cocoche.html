<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes Compartidos | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --menta:#20a088;
    --fondo:#f4f6f9;
}

body{
    font-family:'Lato',sans-serif;
    background:var(--fondo);
    color:#334155;
    padding-bottom:50px;
}

.header{
    background:var(--menta);
    padding:15px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.header-logo{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
}

.header-bandera{
    width:28px;
    height:28px;
    object-fit:cover;
    border-radius:4px;
}

.header h1{
    font-size:18px;
    font-weight:900;
    letter-spacing:0.5px;
    text-transform:uppercase;
}

.contenedor-app{
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

h2.titulo-seccion{
    text-align:center;
    margin:20px 0 5px;
    font-size:24px;
    text-transform:uppercase;
    color:#1e293b;
}

.subtitulo{
    text-align:center;
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

.aviso{
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin-bottom:20px;
}

.btn-publicar{
    display:block;
    width:250px;
    margin:0 auto 30px;
    padding:14px;
    background:var(--menta);
    color:white;
    border:none;
    border-radius:30px;
    font-weight:700;
    cursor:pointer;
}

#form{
    background:white;
    padding:25px;
    border-radius:16px;
    border:1px solid #e2e8f0;
    margin-bottom:40px;
    display:none;
}

input,
select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-family:inherit;
}

.grid-anuncios{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.tarjeta{
    background:white;
    border-radius:12px;
    border:1px solid #e2e8f0;
    overflow:hidden;
    padding:15px;
}

.titulo-tarjeta{
    font-weight:900;
    font-size:18px;
    margin-bottom:10px;
    color:#1e293b;
}

.descripcion{
    font-size:14px;
    color:#475569;
    margin-bottom:15px;
    line-height:1.5;
    white-space:pre-line;
}

.burbujas{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tag{
    background:#f1f5f9;
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    color:#475569;
    border:1px solid #e2e8f0;
}

.btn-wa{
    display:block;
    width:100%;
    text-align:center;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
    font-weight:700;
    font-size:13px;
    color:white;
    background:#25d366;
}

.oculto{
    display:none;
}

.fila{
    display:flex;
    gap:10px;
}

.fila > div{
    flex:1;
}

@media(max-width:700px){
    .fila{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="header-logo">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div class="contenedor-app">

    <h2 class="titulo-seccion">Viajes Compartidos</h2>
    <div class="subtitulo">Se muestran viajes de los últimos 7 días</div>

    <p class="aviso">
        * Comparte coche entre El Espinar, Segovia y Madrid.  
        Los anuncios se eliminan automáticamente tras 20 días.
    </p>

    <button class="btn-publicar" onclick="toggleFormulario()">
        ➕ PUBLICAR VIAJE
    </button>

    <div id="form">

        <form id="publicarForm" onsubmit="enviar(event)">

            <select id="tipo" required>
                <option value="">¿Qué buscas?</option>
                <option value="CONDUCTOR">Soy conductor 🚗​​</option>
                <option value="PASAJERO">Soy pasajero 🙋​</option>
            </select>

            <div class="fila">

                <div>
                    <select id="desde" required onchange="controlarOtro('desde')">
                        <option value="">Desde</option>
                        <option>El Espinar</option>
                        <option>San Rafael</option>
                        <option>LASR</option>
                        <option>La Estación</option>
                        <option>Segovia</option>
                        <option>Madrid</option>
                        <option value="Otro">Otro</option>
                    </select>

                    <input type="text" id="desdeOtro" class="oculto" placeholder="Escribe origen">
                </div>

                <div>
                    <select id="hasta" required onchange="controlarOtro('hasta')">
                        <option value="">Hasta</option>
                        <option>El Espinar</option>
                        <option>San Rafael</option>
                        <option>LASR</option>
                        <option>La Estación</option>
                        <option>Segovia</option>
                        <option>Madrid</option>
                        <option value="Otro">Otro</option>
                    </select>

                    <input type="text" id="hastaOtro" class="oculto" placeholder="Escribe destino">
                </div>

            </div>

            <div class="fila">

                <div>
                    <input type="date" id="fecha" required>
                </div>

                <div>
                    <select id="hora" required></select>
                </div>

            </div>

            <input type="text" id="nombre" placeholder="Nombre" required>

            <input 
                type="tel"
                id="telefono"
                placeholder="Teléfono"
                required
                maxlength="9"
                pattern="[0-9]{9}"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            >

            <button type="button" class="btn-publicar" style="width:100%;" onclick="previsualizarWhatsapp()">
                📲 ENVIAR POR WHATSAPP
            </button>

            <button type="submit" id="btn" class="btn-publicar" style="width:100%; margin-top:10px;">
                PUBLICAR VIAJE
            </button>

        </form>

    </div>

    <div id="loading" style="text-align:center; padding:40px; font-weight:700; color:#888;">
        Cargando viajes...
    </div>

    <div id="tablon" class="grid-anuncios"></div>

</div>

<script>

const urlScript = "https://script.google.com/macros/s/AKfycbynbarvkvs_ETBnocznNlrT_01uoSeQwRuPdddewPLfRcM3ZG9iuz0IQan291_Vj2ai/exec";

function toggleFormulario(){
    const form = document.getElementById('form');
    form.style.display = (form.style.display === 'block') ? 'none' : 'block';
    form.scrollIntoView({behavior:'smooth'});
}

function controlarOtro(tipo){
    const select = document.getElementById(tipo);
    const otro = document.getElementById(tipo + "Otro");

    if(select.value === "Otro"){
        otro.classList.remove("oculto");
        otro.required = true;
    }else{
        otro.classList.add("oculto");
        otro.required = false;
    }
}

function generarHoras(){
    const hora = document.getElementById("hora");

    for(let h = 0; h < 24; h++){
        for(let m = 0; m < 60; m += 15){
            const hh = String(h).padStart(2,'0');
            const mm = String(m).padStart(2,'0');
            hora.innerHTML += `<option value="${hh}:${mm}">${hh}:${mm}</option>`;
        }
    }
}

function obtenerValor(campo){
    const valor = document.getElementById(campo).value;
    if(valor === "Otro"){
        return document.getElementById(campo + "Otro").value;
    }
    return valor;
}

function validarRuta(){
    const desde = obtenerValor("desde").trim().toLowerCase();
    const hasta = obtenerValor("hasta").trim().toLowerCase();
    if(desde === hasta){
        alert("El origen y el destino no pueden coincidir.");
        return false;
    }
    return true;
}

// 🔥 FILTRO 7 DÍAS
function esReciente(fechaStr){

    if(!fechaStr) return false;

    const fecha = new Date(fechaStr);
    const hoy = new Date();

    const limite = new Date();
    limite.setDate(hoy.getDate() - 7);

    return fecha >= limite;
}

function construirMensaje(){
    return `🚗 VIAJE COMPARTIDO

👤 Tipo: ${document.getElementById("tipo").value}
📍 Desde: ${obtenerValor("desde")}
🏁 Hasta: ${obtenerValor("hasta")}
📅 Fecha: ${document.getElementById("fecha").value}
⏰ Hora: ${document.getElementById("hora").value}
🙋 Nombre: ${document.getElementById("nombre").value}
📞 Teléfono: ${document.getElementById("telefono").value}`;
}

function previsualizarWhatsapp(){
    if(!validarRuta()) return;
    window.open(`https://wa.me/?text=${encodeURIComponent(construirMensaje())}`, '_blank');
}

async function cargar(){

    try{

        const res = await fetch(urlScript);
        const data = await res.json();

        document.getElementById('loading').style.display = 'none';

        if(!Array.isArray(data)){
            document.getElementById('loading').innerText = "Error cargando viajes";
            return;
        }

        const filtrados = data.filter(esReciente).reverse();

        document.getElementById('tablon').innerHTML = filtrados.map(a => `

            <div class="tarjeta">

                <div class="titulo-tarjeta">
                    ${a.tipo === 'CONDUCTOR' ? '🚘 CONDUCTOR' : '🧍 PASAJERO'}
                </div>

                <div class="descripcion">
📍 ${a.desde} → ${a.hasta}

📅 ${a.fecha}
⏰ ${a.hora}

🙋 ${a.nombre}
                </div>

                <div class="burbujas">
                    <span class="tag">${a.desde}</span>
                    <span class="tag">${a.hasta}</span>
                </div>

                <a class="btn-wa"
                   href="https://wa.me/34${a.telefono}?text=${encodeURIComponent('Hola, he visto tu viaje publicado en infoespinar.com')}"
                   target="_blank">
                   WHATSAPP
                </a>

            </div>

        `).join('');

    }catch(err){
        console.error(err);
        document.getElementById('loading').innerText = "Error cargando viajes";
    }
}

async function enviar(e){

    e.preventDefault();

    if(!validarRuta()) return;

    const btn = document.getElementById('btn');

    btn.disabled = true;
    btn.innerText = "Publicando...";

    const payload = {
        tipo: document.getElementById("tipo").value,
        desde: obtenerValor("desde"),
        hasta: obtenerValor("hasta"),
        fecha: document.getElementById("fecha").value,
        hora: document.getElementById("hora").value,
        nombre: document.getElementById("nombre").value,
        telefono: document.getElementById("telefono").value
    };

    const res = await fetch(urlScript,{
        method:"POST",
        body:JSON.stringify(payload)
    });

    const json = await res.json();

    if(json.resultado === "ok"){

        alert("¡Viaje publicado!");

        document.getElementById("form").style.display = "none";
        document.getElementById("publicarForm").reset();

        btn.disabled = false;
        btn.innerText = "PUBLICAR VIAJE";

        cargar();

    }else{

        alert("Error al publicar.");

        btn.disabled = false;
        btn.innerText = "PUBLICAR VIAJE";
    }
}

generarHoras();
cargar();

</script>

</body>
</html>

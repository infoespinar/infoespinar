<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particulares | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --menta: #20a088; --fondo: #f4f6f9; }
        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: #334155; }

        .header { background: var(--menta); color: white; text-align: center; padding: 30px 20px; }
        .header-logo-link { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: white; background: rgba(255, 255, 255, 0.08); padding: 8px 16px; border-radius: 30px; }
        .header-bandera { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; }
        
        .formulario-publicar { max-width: 600px; margin: 20px auto; padding: 25px; background: white; border-radius: 16px; display: none; border: 1px solid #e2e8f0; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        #titulo { text-transform: uppercase; }
        .btn-accion { width: 100%; padding: 14px; background: var(--menta); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="header-logo-link">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div style="text-align: center; margin: 20px;">
    <button onclick="toggleForm()" class="btn-accion" style="max-width: 300px;">➕ PUBLICAR NUEVO ANUNCIO</button>
</div>

<div id="contenedor-formulario" class="formulario-publicar">
    <form id="formPublicar" onsubmit="enviar(event)">
        <input type="text" id="titulo" placeholder="TÍTULO (SOLO MAYÚSCULAS)" required oninput="this.value = this.value.toUpperCase()">
        
        <select id="estado" required>
            <option value="" disabled selected>Estado del artículo...</option>
            <option>NUEVO</option>
            <option>BUEN ESTADO</option>
            <option>MUY USADO</option>
            <option>PARA RESTAURAR</option>
        </select>

        <textarea id="descripcion" placeholder="Descripción" required rows="3"></textarea>
        <input type="number" id="precio" placeholder="Precio (€)" required>
        
        <select id="recogida" required>
            <option value="" disabled selected>Lugar de recogida...</option>
            <option>EL ESPINAR</option>
            <option>SAN RAFAEL</option>
            <option>LASR</option>
            <option>LA ESTACIÓN</option>
        </select>

        <input type="tel" id="contacto" placeholder="Teléfono (9 dígitos)" required pattern="[0-9]{9}" maxlength="9">
        <input type="file" id="foto" accept="image/*" style="border:none;">
        <button type="submit" id="btnPublicar" class="btn-accion">PUBLICAR ANUNCIO</button>
    </form>
    <div id="status" style="margin-top:10px; text-align:center;"></div>
</div>

<div id="tablon" class="grid-anuncios" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; padding:20px; max-width:1200px; margin:0 auto;">
    <div id="loading" style="text-align:center; padding:50px;">Cargando anuncios...</div>
</div>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbzPmN9-GeOe9EfKUSvCZR0rpUlJ6ebJ3lo0_q8WHwQLVGjiYIaQSGJuvglXmJrQC6CP/exec";

function toggleForm() {
    const f = document.getElementById('contenedor-formulario');
    f.style.display = (f.style.display === 'block') ? 'none' : 'block';
}

async function enviar(e) {
    e.preventDefault();
    const btn = document.getElementById("btnPublicar");
    const tel = document.getElementById("contacto").value;
    
    // Antiflood simple local (El servidor debe validar esto también)
    const ultimoEnvio = localStorage.getItem('last_post_' + tel);
    if (ultimoEnvio && (Date.now() - ultimoEnvio < 300000)) {
        alert("¡Espera 5 minutos antes de volver a publicar con este número!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Publicando...";

    const datos = new URLSearchParams({
        titulo: document.getElementById("titulo").value,
        estado: document.getElementById("estado").value,
        descripcion: document.getElementById("descripcion").value,
        precio: document.getElementById("precio").value,
        recogida: document.getElementById("recogida").value,
        contacto: tel,
        imagenBase64: await getBase64(document.getElementById("foto").files[0])
    });

    try {
        await fetch(urlScript, { method: "POST", body: datos });
        localStorage.setItem('last_post_' + tel, Date.now());
        alert("Anuncio publicado.");
        location.reload();
    } catch(err) { alert("Error."); btn.disabled = false; }
}

async function getBase64(file) {
    if (!file) return "";
    return new Promise(r => { let rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file); });
}

// Cargar anuncios... (puedes copiar la lógica que ya tienes aquí)
</script>
</body>
</html>

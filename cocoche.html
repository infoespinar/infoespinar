<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes Compartidos | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Lato',sans-serif;
    background:#f4f6f9;
    color:#334155;
}

/* HEADER estilo consistente */
.header{
    background:#20a088;
    padding:18px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.header a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
}

.header img{
    width:30px;
    height:30px;
    border-radius:6px;
}

.header h1{
    font-size:18px;
    font-weight:900;
}

/* CONTENEDOR */
.contenedor-app{
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

h2{
    text-align:center;
    margin-top:15px;
}

.subtitulo{
    text-align:center;
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

/* BOTÓN */
.btn-publicar{
    display:block;
    margin:20px auto;
    background:#20a088;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:30px;
    font-weight:700;
    cursor:pointer;
}

/* FORM */
#form{
    display:none;
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

/* TARJETAS */
.grid{
    display:grid;
    gap:12px;
}

.tarjeta{
    background:white;
    padding:14px;
    border-radius:14px;
    border:1px solid #e2e8f0;
    box-shadow:0 3px 10px rgba(0,0,0,0.04);
}

.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.badge{
    font-size:11px;
    padding:3px 8px;
    border-radius:20px;
    font-weight:700;
}

.conductor{ background:#dcfce7; color:#166534; }
.pasajero{ background:#dbeafe; color:#1e40af; }

.ruta{
    font-size:16px;
    font-weight:800;
    margin-bottom:6px;
}

.info{
    font-size:13px;
    color:#64748b;
    margin-bottom:10px;
}

.btn-wa{
    display:block;
    text-align:center;
    padding:10px;
    border-radius:8px;
    background:#25d366;
    color:white;
    text-decoration:none;
    font-weight:700;
}

/* OTRO INPUT */
.oculto{ display:none; }

</style>
</head>

<body>

<header class="header">
    <a href="/index">
        <img src="https://i.imgur.com/di5CaLV.png">
        <h1>infoespinar.com</h1>
    </a>
</header>

<div class="contenedor-app">

<h2>Viajes Compartidos</h2>
<div class="subtitulo">Los viajes tienen una caducidad de 7 días</div>

<button class="btn-publicar" onclick="toggleFormulario()">➕ PUBLICAR VIAJE</button>

<div id="form">
<form onsubmit="enviar(event)">

<select id="tipo">
<option value="">Tipo</option>
<option value="CONDUCTOR">Conductor</option>
<option value="PASAJERO">Pasajero</option>
</select>

<div class="fila">
<select id="desde" onchange="otro('desde')">
<option>Desde</option>
<option>El Espinar</option>
<option>San Rafael</option>
<option>Madrid</option>
<option value="Otro">Otro</option>
</select>
<input id="desdeOtro" class="oculto" placeholder="Otro origen">
</div>

<div class="fila">
<select id="hasta" onchange="otro('hasta')">
<option>Hasta</option>
<option>El Espinar</option>
<option>San Rafael</option>
<option>Madrid</option>
<option value="Otro">Otro</option>
</select>
<input id="hastaOtro" class="oculto" placeholder="Otro destino">
</div>

<input type="date" id="fecha">
<select id="hora"></select>
<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">

<button type="submit" class="btn-publicar">PUBLICAR</button>

</form>
</div>

<div id="loading" style="text-align:center;padding:30px;">Cargando viajes...</div>

<div id="tablon" class="grid"></div>

</div>

<script>

const urlScript = "https://script.google.com/macros/s/AKfycbynbarvkvs_ETBnocznNlrT_01uoSeQwRuPdddewPLfRcM3ZG9iuz0IQan291_Vj2ai/exec";

function toggleFormulario(){
    const f = document.getElementById('form');
    f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function otro(id){
    const sel = document.getElementById(id);
    const inp = document.getElementById(id+'Otro');
    if(sel.value === 'Otro'){
        inp.classList.remove('oculto');
    } else {
        inp.classList.add('oculto');
    }
}

function generarHoras(){
    const h = document.getElementById('hora');
    for(let i=0;i<24;i++){
        for(let j=0;j<60;j+=30){
            const hh = String(i).padStart(2,'0');
            const mm = String(j).padStart(2,'0');
            h.innerHTML += `<option>${hh}:${mm}</option>`;
        }
    }
}

function obtener(id){
    const v = document.getElementById(id).value;
    if(v === 'Otro'){
        return document.getElementById(id+'Otro').value;
    }
    return v;
}

function ordenar(data){
    return data.sort((a,b)=>{
        const da = new Date(a.fecha+' '+a.hora);
        const db = new Date(b.fecha+' '+b.hora);
        return db-da;
    });
}

async function cargar(){

    document.getElementById('loading').style.display='block';

    const res = await fetch(urlScript);
    const data = await res.json();

    const ordenado = ordenar(data);

    document.getElementById('loading').style.display='none';

    document.getElementById('tablon').innerHTML = ordenado.map(a=>`

    <div class="tarjeta">

        <div class="top">
            <span class="badge ${a.tipo==='CONDUCTOR'?'conductor':'pasajero'}">
                ${a.tipo}
            </span>
            <span style="font-size:11px;color:#64748b">${a.fecha}</span>
        </div>

        <div class="ruta">
            ${a.desde} → ${a.hasta}
        </div>

        <div class="info">
            ⏰ ${a.hora} · 🙋 ${a.nombre}
        </div>

        <a class="btn-wa" href="https://wa.me/34${a.telefono}">
            WhatsApp
        </a>

    </div>

    `).join('');
}

async function enviar(e){
    e.preventDefault();

    const payload = {
        tipo: document.getElementById('tipo').value,
        desde: obtener('desde'),
        hasta: obtener('hasta'),
        fecha: document.getElementById('fecha').value,
        hora: document.getElementById('hora').value,
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value
    };

    await fetch(urlScript,{
        method:'POST',
        body:JSON.stringify(payload)
    });

    cargar();
}

generarHoras();
cargar();

setInterval(()=>cargar(),60000);

</script>

</body>
</html>

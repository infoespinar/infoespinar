<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes Compartidos | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

:root{
    --menta:#20a088;
    --fondo:#f4f6f9;
}

body{
    font-family:'Lato',sans-serif;
    background:var(--fondo);
    color:#334155;
    padding-bottom:50px;
}

/* HEADER */
.header{
    background:var(--menta);
    padding:15px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.header a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
}

.header img{
    width:28px;
    height:28px;
    border-radius:4px;
}

.header h1{
    font-size:18px;
    font-weight:900;
}

/* CONTENIDO */
.contenedor-app{
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

h2{
    text-align:center;
    margin:20px 0 5px;
    font-size:24px;
}

.subtitulo{
    text-align:center;
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

/* BOTÓN */
.btn-publicar{
    display:block;
    width:250px;
    margin:0 auto 20px;
    padding:14px;
    background:var(--menta);
    color:white;
    border:none;
    border-radius:30px;
    font-weight:700;
    cursor:pointer;
    font-size:15px;
}

.btn-publicar:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

/* FORM */
#form{
    background:white;
    padding:20px;
    border-radius:14px;
    display:none;
    margin-bottom:30px;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    font-family:'Lato',sans-serif;
    color:#334155;
    background:#fff;
}

/* FIX: mostrar placeholder en input[type=date] cuando está vacío */
input[type="date"]:not(:valid):not(:focus){
    color:#94a3b8;
}

/* Algunos navegadores necesitan este truco adicional */
input[type="date"].vacio{
    color:#94a3b8;
}

.fila{
    display:flex;
    gap:10px;
}

.fila > div{flex:1;}

.oculto{display:none;}

/* TARJETAS */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    border:1px solid #e2e8f0;
}

.titulo{
    font-weight:900;
    margin-bottom:10px;
}

.wa{
    display:block;
    margin-top:10px;
    background:#25d366;
    color:white;
    text-align:center;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
    font-weight:700;
}
</style>
</head>

<body>

<header class="header">
    <a href="/index.html">
        <img src="https://i.imgur.com/di5CaLV.png">
        <h1>infoespinar.com</h1>
    </a>
</header>

<div class="contenedor-app">

<h2>Viajes Compartidos</h2>
<div class="subtitulo">Los viajes tienen una caducidad de 7 días</div>

<button class="btn-publicar" onclick="toggle()">➕ PUBLICAR VIAJE</button>

<div id="form">
<form id="formulario" onsubmit="enviar(event)">

<select id="tipo">
<option value="">Tipo</option>
<option value="🚘 CONDUCTOR">🚘 Conductor</option>
<option value="🙋 PASAJERO">🙋 Pasajero</option>
</select>

<div class="fila">
<div>
    <!-- FIX: añadido onchange para mostrar/ocultar campo "Otro" -->
    <select id="desde" onchange="mostrarOtro('desde')">
        <option value="">Desde</option>
        <option>El Espinar</option>
        <option>San Rafael</option>
        <option>LASR</option>
        <option>La Estación</option>
        <option>Madrid</option>
        <option>Segovia</option>
        <option>Ávila</option>
        <option value="Otro">Otro</option>
    </select>
    <input id="desdeOtro" class="oculto" placeholder="Escribe origen">
</div>

<div>
    <!-- FIX: añadido onchange para mostrar/ocultar campo "Otro" -->
    <select id="hasta" onchange="mostrarOtro('hasta')">
        <option value="">Hasta</option>
        <option>El Espinar</option>
        <option>San Rafael</option>
        <option>LASR</option>
        <option>La Estación</option>
        <option>Madrid</option>
        <option>Segovia</option>
        <option>Ávila</option>
        <option value="Otro">Otro</option>
    </select>
    <input id="hastaOtro" class="oculto" placeholder="Escribe destino">
</div>
</div>

<div class="fila">
    <!-- FIX: añadido placeholder visible y clase para color gris cuando vacío -->
    <input type="date" id="fecha" placeholder="Fecha"
        onchange="this.classList.remove('vacio')"
        class="vacio">
    <select id="hora"></select>
</div>

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono" maxlength="9" inputmode="numeric" pattern="[0-9]{9}"
    oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,9)"
>
<button type="button" class="btn-publicar" onclick="wa()">WhatsApp</button>
<button class="btn-publicar" id="btnPub">PUBLICAR</button>

</form>
</div>

<div id="grid" class="grid"></div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbynbarvkvs_ETBnocznNlrT_01uoSeQwRuPdddewPLfRcM3ZG9iuz0IQan291_Vj2ai/exec";

function toggle(){
    const f = document.getElementById("form");
    f.style.display = f.style.display === "block" ? "none" : "block";
}

/* ===== MOSTRAR/OCULTAR CAMPO OTRO ===== */
/* FIX: función que faltaba para que funcione el campo libre "Otro" */
function mostrarOtro(id){
    const sel = document.getElementById(id);
    const input = document.getElementById(id + "Otro");
    if(sel.value === "Otro"){
        input.classList.remove("oculto");
        input.focus();
    } else {
        input.classList.add("oculto");
        input.value = "";
    }
}

/* ===== OBTENER VALOR ===== */
function obtenerValor(id){
    let v = document.getElementById(id).value;
    if(v === "Otro") v = document.getElementById(id + "Otro").value;
    return v;
}

/* ===== HORAS (FIX: empieza a las 08:00) ===== */
function horas(){
    let h = document.getElementById("hora");
    h.innerHTML = "";
    for(let i = 8; i < 24; i++){          // <-- cambiado de 0 a 8
        for(let j = 0; j < 60; j += 15){
            let v = `${String(i).padStart(2,'0')}:${String(j).padStart(2,'0')}`;
            h.innerHTML += `<option value="${v}">${v}</option>`;
        }
    }
}

/* ===== WHATSAPP ===== */
function wa(){
    const tipo   = document.getElementById("tipo").value;
    const nombre = document.getElementById("nombre").value;
    const desde  = obtenerValor("desde");
    const hasta  = obtenerValor("hasta");
    const fecha  = document.getElementById("fecha").value;
    const hora   = document.getElementById("hora").value;

    let mensaje = "";
    if(tipo.includes("CONDUCTOR")){
        mensaje = `Hola, soy ${nombre}. Voy a viajar desde ${desde} hasta ${hasta} el ${fecha} a las ${hora}. Si te interesa viajar conmigo, escríbeme.`;
    } else {
        mensaje = `Hola, soy ${nombre}. Busco viaje desde ${desde} hasta ${hasta} el ${fecha} a las ${hora}. Si tienes sitio, escríbeme.`;
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, "_blank");
}

/* ===== TARJETA INSTANTÁNEA ===== */
function crearTarjeta(v){
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
        <div class="titulo">${v.tipo}</div>
        📍 ${v.desde} → ${v.hasta}<br>
        📅 ${v.fecha}<br>
        ⏰ ${v.hora}<br>
        👤 ${v.nombre}<br>
        <a class="wa" href="https://wa.me/34${v.telefono}" target="_blank">WhatsApp</a>
    `;
    document.getElementById("grid").prepend(div);
}

/* ===== CARGAR via proxy CORS ===== */
async function cargar(){
    const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
    let d;
    try {
        const r = await fetch(proxyUrl);
        d = await r.json();
    } catch(err){
        document.getElementById("grid").innerHTML =
            `<p style="color:#ef4444;text-align:center;grid-column:1/-1">Error al cargar los viajes. Recarga la página.</p>`;
        return;
    }

    // Ordenar por fecha/hora más próxima a ahora
    const ahora = new Date();
    d.sort((a, b) => {
        const fechaA = new Date(`${a.fecha}T${a.hora}`);
        const fechaB = new Date(`${b.fecha}T${b.hora}`);
        const diffA = fechaA - ahora;
        const diffB = fechaB - ahora;
        if(diffA >= 0 && diffB >= 0) return diffA - diffB;
        if(diffA < 0  && diffB < 0)  return diffB - diffA;
        return diffA >= 0 ? -1 : 1;
    });

    document.getElementById("grid").innerHTML = d.length === 0
        ? `<p style="text-align:center;color:#64748b;grid-column:1/-1">No hay viajes publicados.</p>`
        : d.map(v => `
            <div class="card">
                <div class="titulo">${v.tipo}</div>
                📍 ${v.desde} → ${v.hasta}<br>
                📅 ${v.fecha}<br>
                ⏰ ${v.hora}<br>
                👤 ${v.nombre}<br>
                <a class="wa" href="https://wa.me/34${v.telefono}" target="_blank">WhatsApp</a>
            </div>
        `).join("");
}

/* ===== ENVIAR ===== */
async function enviar(e){
    e.preventDefault();

    const desde = obtenerValor("desde");
    const hasta = obtenerValor("hasta");
    const fecha = document.getElementById("fecha").value;

    // 1. Origen = destino
    if(desde.trim().toLowerCase() === hasta.trim().toLowerCase()){
        alert("El origen y el destino no pueden ser iguales.");
        return;
    }

    // FIX: parseo manual para evitar desfase UTC en la comparación de fechas
    // new Date("2025-05-20") se interpreta como UTC medianoche → puede ser "ayer" en España
    const [anyo, mes, dia] = fecha.split("-").map(Number);
    const fechaViaje = new Date(anyo, mes - 1, dia);   // hora local, sin UTC
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    if(fechaViaje < hoy){
        alert("No puedes publicar viajes con fecha anterior a hoy.");
        return;
    }

    const btn  = document.getElementById("btnPub");
    const form = document.getElementById("form");

    const payload = {
        tipo:     document.getElementById("tipo").value,
        desde:    obtenerValor("desde"),
        hasta:    obtenerValor("hasta"),
        hora:     String(document.getElementById("hora").value),
        fecha:    String(document.getElementById("fecha").value),
        nombre:   document.getElementById("nombre").value,
        telefono: document.getElementById("telefono").value
    };

    /* Mostrar tarjeta inmediatamente */
    crearTarjeta(payload);

    /* UX */
    btn.disabled  = true;
    btn.innerText = "Publicando...";
    form.style.display = "none";

    // Google Apps Script no devuelve cabeceras CORS en POST → mode no-cors
    await fetch(url, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });

    document.getElementById("formulario").reset();
    // Restaurar clase "vacio" en el campo fecha tras el reset
    document.getElementById("fecha").classList.add("vacio");

    btn.disabled  = false;
    btn.innerText = "PUBLICAR";

    cargar();
}

horas();
cargar();
setInterval(() => cargar(), 60000);

</script>

</body>
</html>

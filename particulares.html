<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particulares | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --menta: #20a088; --fondo: #f4f6f9; }
        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: #334155; }

        /* HEADER COMPACTO Y LIMPIO */
        .header { background: var(--menta); padding: 15px 20px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .header-bandera { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
        .header h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }

        /* FORMULARIO Y TABLÓN */
        .contenedor-app { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .formulario-publicar { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display: none; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; }
        .btn-accion { width: 100%; padding: 12px; background: var(--menta); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        
        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .tarjeta-anuncio { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .foto-articulo { width: 100%; height: 160px; object-fit: cover; }
        .cuerpo-anuncio { padding: 15px; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="header-logo">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div class="contenedor-app">
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="toggleForm()" class="btn-accion" style="max-width: 250px;">➕ PUBLICAR ANUNCIO</button>
    </div>

    <div id="contenedor-formulario" class="formulario-publicar">
        <form id="formPublicar" onsubmit="enviar(event)">
            <input type="text" id="titulo" placeholder="TÍTULO (SOLO MAYÚSCULAS)" required oninput="this.value = this.value.toUpperCase()">
            <select id="estado" required>
                <option value="" disabled selected>Estado del artículo...</option>
                <option>NUEVO</option><option>BUEN ESTADO</option><option>MUY USADO</option><option>PARA RESTAURAR</option>
            </select>
            <textarea id="descripcion" placeholder="Descripción" required rows="2"></textarea>
            <input type="number" id="precio" placeholder="Precio (€)" required>
            <select id="recogida" required>
                <option value="" disabled selected>Lugar de recogida...</option>
                <option>EL ESPINAR</option><option>SAN RAFAEL</option><option>LASR</option><option>LA ESTACIÓN</option>
            </select>
            <input type="tel" id="contacto" placeholder="Teléfono (9 dígitos)" required pattern="[0-9]{9}" maxlength="9">
            <input type="file" id="foto" accept="image/*" style="border:none;">
            <button type="submit" id="btnPublicar" class="btn-accion">PUBLICAR</button>
        </form>
    </div>

    <div id="tablon" class="grid-anuncios">
        <div id="loading" style="text-align:center; padding:40px; grid-column: 1/-1;">Cargando anuncios...</div>
    </div>
</div>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbzPmN9-GeOe9EfKUSvCZR0rpUlJ6ebJ3lo0_q8WHwQLVGjiYIaQSGJuvglXmJrQC6CP/exec";

function toggleForm() {
    const f = document.getElementById('contenedor-formulario');
    f.style.display = (f.style.display === 'block') ? 'none' : 'block';
}

async function cargar() {
    const cont = document.getElementById("tablon");
    try {
        const res = await fetch(urlScript);
        const data = await res.json();
        document.getElementById("loading").style.display = "none";
        cont.innerHTML = data.map(a => `
            <div class="tarjeta-anuncio">
                ${a.imagen ? `<img src="${a.imagen}" class="foto-articulo">` : ''}
                <div class="cuerpo-anuncio">
                    <h3 style="color:var(--menta); font-size:16px; margin-bottom:8px;">${(a.titulo||"").toUpperCase()}</h3>
                    <p style="font-size:13px; color:#64748b; margin-bottom:10px;">${a.descripcion}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:900;">${a.precio}€</span>
                        <a href="tel:${a.contacto}" style="background:var(--menta); color:white; padding:6px 10px; text-decoration:none; border-radius:4px; font-size:11px;">LLAMAR</a>
                    </div>
                </div>
            </div>`).join('');
    } catch(err) { cont.innerHTML = "Error al cargar anuncios."; }
}

async function enviar(e) {
    e.preventDefault();
    const btn = document.getElementById("btnPublicar");
    btn.disabled = true; btn.innerText = "Publicando...";
    const tel = document.getElementById("contacto").value;
    
    // Antiflood
    if (localStorage.getItem('last_post_' + tel)) {
        alert("¡Espera 5 minutos entre publicaciones!");
        btn.disabled = false; btn.innerText = "PUBLICAR"; return;
    }

    const file = document.getElementById("foto").files[0];
    const datos = new URLSearchParams({
        titulo: document.getElementById("titulo").value,
        estado: document.getElementById("estado").value,
        descripcion: document.getElementById("descripcion").value,
        precio: document.getElementById("precio").value,
        recogida: document.getElementById("recogida").value,
        contacto: tel,
        imagenBase64: file ? await new Promise(r => { let rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file); }) : ""
    });

    try {
        await fetch(urlScript, { method: "POST", body: datos });
        localStorage.setItem('last_post_' + tel, Date.now());
        alert("Publicado con éxito."); location.reload();
    } catch(err) { alert("Error."); btn.disabled = false; }
}

cargar();
</script>
</body>
</html>

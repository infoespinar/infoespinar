<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Recogida</title>
    <style>
        /* Estilos base modernos y limpios */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --form-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --focus-color: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: var(--form-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 450px;
        }

        .form-title {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--focus-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-group .help-text {
            display: block;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #64748b;
        }

        /* Estilo para los grupos del desplegable (Mañana / Tarde) */
        optgroup {
            font-weight: 700;
            padding: 5px;
            background-color: #f1f5f9;
        }

        optgroup option {
            font-weight: normal;
            background-color: #fff;
            padding: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Solicitud de Recogida</h2>
        
        <form id="recogidaForm" action="#" method="POST">
            
            <div class="form-group">
                <label for="telefono">Teléfono de Contacto</label>
                <input 
                    type="tel" 
                    id="telefono" 
                    name="telefono" 
                    pattern="[0-9]{9}" 
                    maxlength="9" 
                    minlength="9" 
                    required 
                    placeholder="Ej: 612345678"
                    autocomplete="tel"
                >
                <span class="help-text">Introduce un número de 9 cifras sin espacios ni letras.</span>
            </div>

            <div class="form-group">
                <label for="horario">Horario de Recogida</label>
                <select id="horario" name="horario" required>
                    <option value="" disabled selected>Selecciona una franja horaria...</option>
                    
                    <optgroup label="☀️ Turnos de Mañana">
                        <option value="manana_primera">09:00 - 11:00</option>
                        <option value="manana_media">11:00 - 13:00</option>
                        <option value="manana_ultima">13:00 - 15:00</option>
                    </optgroup>
                    
                    <optgroup label="🌙 Turnos de Tarde">
                        <option value="tarde_primera">16:00 - 18:00</option>
                        <option value="tarde_media">18:00 - 20:00</option>
                        <option value="tarde_ultima">20:00 - 22:00</option>
                    </optgroup>
                </select>
            </div>

            <button type="submit" class="btn-submit">Confirmar Recogida</button>
        </form>
    </div>

    <script>
        const telefonoInput = document.getElementById('telefono');

        // JavaScript para filtrar la entrada en tiempo real:
        // Evita que se escriban letras, espacios o símbolos, dejando solo números.
        telefonoInput.addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Validación extra antes de enviar el formulario
        document.getElementById('recogidaForm').addEventListener('submit', function (e) {
            if (telefonoInput.value.length !== 9) {
                e.preventDefault(); // Detiene el envío
                alert('Por favor, introduce un número de teléfono válido de exactamente 9 dígitos.');
                telefonoInput.focus();
            }
        });
    </script>

</body>
</html>

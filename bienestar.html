<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienestar | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght=300;400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #f4f6f9;
            color: #334155;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px 12px;
        }

        /* 🏛️ TITULAR PERSONALIZADO PARA BIENESTAR */
        .titulo-seccion-principal {
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
            text-transform: uppercase;
        }
        .txt-violeta { color: #7c3aed; } /* Color para Bienestar */
        .txt-marino { color: #1e3a8a; }

        .titulo-bloque {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #475569;
            margin: 25px 0 12px 4px;
            font-weight: 700;
        }

        /* 🗺️ MAPA CON RECORTE */
        .contenedor-mapa-fijo { width: 100%; height: 350px; margin-bottom: 25px; }
        .map-wrapper {
            width: 100%; height: 100%; overflow: hidden;
            border-radius: 14px; border: 1px solid #cbd5e1;
            position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        .map-wrapper iframe {
            position: absolute; top: -60px; left: 0;
            width: 100%; height: calc(100% + 60px); border: 0;
        }
    </style>
</head>
<body>

    <header style="padding: 15px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; text-align: center;">
    <h1 style="font-size: 22px; font-weight: 900; color: #1e3a8a; margin: 0; text-transform: uppercase;">
        Info<span style="color: #15803d;">Espinar</span>
    </h1>
    <p style="font-size: 12px; color: #64748b; margin-top: 5px;">Directorio de servicios locales</p>
</header>
    <main class="main-container">
        <h2 class="titulo-seccion-principal">
            <span class="txt-violeta">Bienestar</span> y <span class="txt-marino">Salud</span>
        </h2>

        <div class="titulo-bloque">Ubicación de servicios</div>
        <div class="contenedor-mapa-fijo">
            <div class="map-wrapper">
                <iframe src="https://www.google.com/maps/d/embed?mid=1_0mLK5kqoOnOq3NG6W2t0_gbvsotnm0&ehbc=2E312F&noprof=1"></iframe>
            </div>
        </div>

        <div class="disclaimer-box" style="background-color: #f5f3ff; border-left: 4px solid #7c3aed; padding: 14px; border-radius: 8px; font-size: 13px; color: #5b21b6;">
            <strong>Nota:</strong> Esta sección engloba centros de terapias, estética, bienestar físico y mental en el municipio.
        </div>
    </main>

    <script>
    function actualizarAltura() {
        if(window.parent && window.parent.postMessage) {
            window.parent.postMessage({type: 'resize', height: document.body.scrollHeight + 30}, '*');
        }
    }
    window.addEventListener('resize', actualizarAltura);
    setTimeout(actualizarAltura, 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Viaje a China</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;background:#1c1412;color:#2a1a14}

.pista{
  position:fixed;
  top:0;left:0;right:0;
  height:5px;
  background:rgba(255,255,255,.25);
  z-index:19;
  pointer-events:none;
}

.progreso{
  position:fixed;
  top:0;left:0;
  height:5px;
  width:0;
  background:linear-gradient(90deg,#ffd36b,#b3201f);
  box-shadow:0 0 6px rgba(0,0,0,.35);
  z-index:20;
  transition:width .25s ease;
}

.car{
  height:100vh;
  height:100dvh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

.card{
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  flex-direction:column;
  background:#fbf4e6;
  position:relative;
  overflow:hidden;
}

.art{
  flex:0 0 32vh;
  flex:0 0 32dvh;
  position:relative;
  overflow:hidden;
}

.art svg,.art img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.txt{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px 22px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:6px;
  z-index:2;
  animation:aparecer .5s ease both;
}

@keyframes aparecer{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

@media (prefers-reduced-motion:reduce){
  .txt{animation:none}
  .car{scroll-behavior:auto}
}

.tag{
  align-self:flex-start;
  font:600 .78rem system-ui,sans-serif;
  letter-spacing:.04em;
  padding:4px 12px;
  border-radius:20px;
  background:#e8d9bd;
  color:#5b4636;
}

.now .tag{background:#b3201f;color:#fff}
.past .tag{background:#dfe9d8;color:#3c5a35}

.day{font:600 .95rem system-ui,sans-serif;color:#7a6558;margin-top:4px}
.city{font-size:1.65rem;line-height:1.1;margin:0;color:#b3201f}
.zh{font-size:1rem;color:#8a6a1f;letter-spacing:.1em}
.ttl{font-size:1.1rem;font-weight:bold;margin:7px 0 0}
.desc{font-size:.95rem;line-height:1.45;margin:0;color:#3d2d26}

.past{filter:saturate(.7)}
.past .art{opacity:.85}

.adorno{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:74px;
  pointer-events:none;
  opacity:.16;
  z-index:1;
}

.adorno svg{
  width:100%;
  height:100%;
  display:block;
}

.bar{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0px));
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  background:rgba(28,20,18,.72);
  color:#fff;
  font:600 .8rem system-ui,sans-serif;
  padding:6px 14px;
  border-radius:20px;
  white-space:nowrap;
  backdrop-filter:blur(6px);
}

.hero{
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(160deg,#8e1413,#b3201f 55%,#c8962b);
  color:#fff;
  padding:24px;
}

.hero h1{font-size:2.4rem;margin:0 0 6px}
.hero .big{font-size:1.5rem;margin:18px 0 6px}
.hero p{margin:0;opacity:.92;font-size:1.05rem}
.hint{margin-top:28px;font:.9rem system-ui,sans-serif;opacity:.8}
.hero .zh{color:#ffe3a0;font-size:1.6rem}

#btnMusica,#btnInicio{
  position:fixed;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:9;
  border:0;
  border-radius:30px;
  background:rgba(28,20,18,.55);
  color:rgba(255,255,255,.85);
  font:600 .85rem system-ui,sans-serif;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:background .2s ease,color .2s ease;
}

#btnMusica{
  right:14px;
  padding:10px 16px;
}

#btnInicio{
  left:14px;
  width:38px;
  height:38px;
  padding:0;
  font-size:1rem;
  line-height:1;
}

#btnInicio:hover{
  background:rgba(28,20,18,.75);
  color:#fff;
}
</style>
</head>

function fondo(i,a,b){
  return '<defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/>'
  +'</linearGradient></defs><rect width="400" height="240" fill="url(#g'+i+')"/>';
}

function sol(x,y,r,c){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" opacity=".92"/>';
}

function nube(x,y){
  return '<g fill="#fff" opacity=".9">'
  +'<ellipse cx="'+x+'" cy="'+y+'" rx="44" ry="14"/>'
  +'<ellipse cx="'+(x+26)+'" cy="'+(y-9)+'" rx="26" ry="14"/>'
  +'<ellipse cx="'+(x-24)+'" cy="'+(y-6)+'" rx="22" ry="11"/></g>';
}

function casa(x,y,w,c){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(w*.55)+'" fill="'+c+'"/>'
  +'<path d="M'+(x-4)+' '+y+'L'+(x+w/2)+' '+(y-w*.38)+'L'+(x+w+4)+' '+y+'Z" fill="#4a3a30"/>'
  +'<rect x="'+(x+w*.4)+'" y="'+(y+w*.14)+'" width="'+(w*.2)+'" height="'+(w*.22)+'" fill="#ffd36b"/>';
}

function farol(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="#ffb347" opacity=".35"/>'
  +'<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#d62d20"/>';
}

const D=[

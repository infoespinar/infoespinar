<div style="text-align: center; margin: 20px;">
    <button onclick="toggleForm()" style="background: var(--menta); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        ➕ PUBLICAR NUEVO ANUNCIO
    </button>
</div>

<div id="contenedor-formulario" class="formulario-publicar" style="display: none; margin-bottom: 30px;">
    <h3 style="margin-bottom: 15px; color: var(--menta);">Completa tu anuncio</h3>
    <form id="formPublicar" onsubmit="enviar(event)">
        <input type="text" id="titulo" placeholder="Título" required>
        <input type="text" id="estado" placeholder="Estado (ej: Nuevo, Usado)" required>
        <textarea id="descripcion" placeholder="Descripción" required rows="3"></textarea>
        <input type="number" id="precio" placeholder="Precio (€)" required>
        <input type="text" id="recogida" placeholder="Lugar de recogida" required>
        <input type="tel" id="contacto" placeholder="Teléfono" required pattern="[0-9]{9}">
        <input type="file" id="foto" accept="image/*" style="border:none;">
        <button type="submit" id="btnPublicar" class="btn-accion">PUBLICAR ANUNCIO</button>
    </form>
    <div id="status" style="margin-top:10px; text-align:center;"></div>
</div>

<script>
    // Función para mostrar/ocultar
    function toggleForm() {
        const form = document.getElementById('contenedor-formulario');
        form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'block' : 'none';
    }

    // La función enviar, cargar y resto del script que ya tienes...
    // (Asegúrate de mantener el resto de funciones que te pasé en el mensaje anterior)
</script>

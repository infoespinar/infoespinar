<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particulares | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --menta: #20a088; --fondo: #f4f6f9; }
        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: #334155; padding-bottom: 50px; }

.header {
    background: var(--menta); /* Usamos tu variable nativa de color menta */
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}
        .header-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: white;
}
        
        .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.header-bandera {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    object-fit: cover;
}        .header h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
        .header-name {
    font-size: 20px;
    letter-spacing: 0.02em;
    font-weight: 700;
    color: white;
}

        .hero {
    background: var(--menta); /* Fondo menta unificado */
    padding: 40px 24px 65px; 
    text-align: center;
    position: relative;
    overflow: hidden;
}
/* El arco recortado que acopla con el fondo gris claro de particulares */
.hero::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 40px;
    background: #f8fafc; /* El color gris/azul claro del fondo de particulares (Tailwind slate-50) */
    clip-path: ellipse(55% 100% at 50% 100%);
}
.hero-title {
    font-size: clamp(24px, 5vw, 36px);
    color: white;
    font-weight: 700;
    margin-bottom: 8px;
}
.hero-sub {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    font-weight: 400;
}

        .contenedor-app { max-width: 900px; margin: 0 auto; padding: 20px; }
        h2.titulo-seccion { text-align: center; margin: 20px 0; font-size: 26px; letter-spacing: 0.5px; font-weight: 900; text-transform: uppercase; color: #1e293b; }
        .aviso { text-align: center; color: #64748b; font-size: 12px; margin-bottom: 20px; }

        .btn-publicar { display: block; width: 250px; margin: 0 auto 30px; padding: 14px; background: var(--menta); color: white; border: none; border-radius: 30px; font-weight: 700; cursor: pointer; font-size: 15px; }
        #form { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 40px; display: none; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }

        .email-hint { font-size: 12px; color: #64748b; margin: -8px 0 12px 2px; }

        /* Imagen preview */
        .img-preview-wrap { margin-bottom: 12px; display: none; }
        .img-preview-wrap img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
        .img-status { font-size: 12px; margin: -8px 0 10px 2px; min-height: 16px; }
        .img-status.loading { color: #20a088; }
        .img-status.ok  { color: #059669; }
        .img-status.err { color: #dc2626; }

        /* PIN BOX */
        .pin-box { background: #f0fdf4; border: 2px solid #10b981; border-radius: 12px; padding: 16px; margin-top: 16px; text-align: center; }
        .pin-num { font-size: 36px; font-weight: 900; letter-spacing: 10px; color: #065f46; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .pin-aviso { font-size: 12px; color: #047857; margin-top: 8px; line-height: 1.6; }
        .btn-copiar-pin { display: inline-flex; align-items: center; gap: 6px; background: #065f46; color: white; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-copiar-pin:hover { background: #047857; }
        .btn-copiar-pin.copiado { background: #1e40af; }

        /* GRID */
        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

        /* TARJETA */
        .tarjeta { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; position: relative; }

        .foto-wrap { position: relative; }
        .foto-articulo { width: 100%; height: 200px; object-fit: cover; cursor: pointer; display: block; }
        .btn-borrar-foto {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    
    /* CAMBIOS AQUÍ: Fondo transparente y borde ligero */
    background: transparent; 
    border: 1px solid rgba(255, 255, 255, 0.5); /* Borde blanco sutil */
    
    cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: white; opacity: 0.75;
    transition: opacity 0.2s, background 0.2s, border-color 0.2s, transform 0.15s;
    backdrop-filter: blur(2px); /* Un ligero desenfoque detrás para que no se pierda el icono */
}
        .btn-borrar-foto:hover {     opacity: 1;     background: rgba(248, 113, 113, 0.9); /* Un rojo pastel/clarito mucho más suave */    transform: scale(1.08); 
}

        .titulo-tarjeta { font-weight: 900; font-size: 16px; padding: 15px 15px 5px; color: #1e293b; }
        .precio { font-weight: 900; font-size: 20px; padding: 0 15px 10px; }
        .burbujas { padding: 0 15px 15px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { background: #f1f5f9; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #475569; border: 1px solid #e2e8f0; }
        .descripcion { font-size: 14px; color: #475569; padding: 0 15px 10px; line-height: 1.5; word-break: break-word; }
        .botones-contacto { display: flex; gap: 10px; padding: 0 15px 15px; }
        .btn-contacto { flex: 1; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; color: white; }
        .btn-llamar { background: #000; }
        .btn-wa { background: #25d366; }

        #modal { display:none; position:fixed; z-index:999; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 8px; }
    </style>
</head>
<body>

<header class="header">
    <a href="/" class="header-link">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera" alt="Logo InfoEspinar">
        <span class="header-name">infoespinar.com</span>
    </a>
</header>

<div class="hero">
    <h1 class="hero-title">Anuncios de Particulares</h1>
    <p class="hero-sub">Publica, edita o borra tus anuncios de forma directa y sencilla.</p>
</div>
    <button class="btn-publicar" onclick="document.getElementById('form').style.display='block'">➕ PUBLICAR ANUNCIO</button>

    <div id="form">
        <form id="publicarForm" onsubmit="enviar(event)">
            <input type="text" id="titulo" placeholder="TÍTULO EN MAYÚSCULAS" required oninput="this.value=this.value.toUpperCase()">
            <select id="estado" required>
                <option value="">Estado...</option>
                <option>A ESTRENAR</option><option>COMO NUEVO</option><option>BUEN ESTADO</option><option>USADO</option><option>PARA RESTAURAR</option>
            </select>
            <textarea id="descripcion" placeholder="Descripción" required rows="3"></textarea>
            <input type="number" id="precio" placeholder="Precio (€)" required>
            <select id="recogida" required>
                <option value="">Zona de recogida...</option>
                <option>EL ESPINAR</option><option>SAN RAFAEL</option><option>LASR</option><option>LA ESTACIÓN</option>
            </select>
            <input type="tel" id="contacto" placeholder="Teléfono (9 cifras)" required pattern="[0-9]{9}" maxlength="9">

            <input type="email" id="email" placeholder="Email (opcional)">
            <p class="email-hint">📧 Si introduces tu email, te enviaremos el PIN de borrado por si lo necesitas más adelante.</p>

            <!-- Imagen: preview + estado -->
            <input type="file" id="imagen" accept="image/*" required onchange="previsualizarImagen(this)">
            <div class="img-preview-wrap" id="imgPreviewWrap">
                <img id="imgPreview" src="" alt="Vista previa">
            </div>
            <div class="img-status" id="imgStatus"></div>

            <div style="margin: 15px 0 20px 2px; display: flex; align-items: flex-start; gap: 8px;">
    <input type="checkbox" id="privacidad" required style="width: auto; margin: 4px 0 0 0; cursor: pointer;">
    <label for="privacidad" style="font-size: 13px; color: #475569; line-height: 1.4; cursor: pointer;">
        Acepto la <a href="/privacidad" target="_blank" style="color: var(--menta); font-weight: 700; text-decoration: none;">política de privacidad</a> y confirmo que soy un particular.
    </label>
</div>

            <button type="submit" id="btn" class="btn-publicar" style="width:100%; margin-bottom:0;">ENVIAR ANUNCIO</button>
        </form>
        <div id="pinMostrado"></div>
    </div>

    <div id="loading" style="text-align:center; padding:40px; font-weight:700; color:#888;">Cargando anuncios...</div>
    <div id="tablon" class="grid-anuncios"></div>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="imgGrande" src=""></div>

<script>
const SCRIPT_URL   = "https://script.google.com/macros/s/AKfycbztGr52OqpIC2cgmA_I_qfPXjOlkkskkieCxUbRwkbKgdAhPrGz_mhqRfbwv_3o20A7/exec";
const IMGBB_KEY    = "889d9ccbbcd91efdb92e1cdaee18b11d";

// ── PREVIEW IMAGEN ────────────────────────────────────────────────
function previsualizarImagen(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const wrap = document.getElementById('imgPreviewWrap');
        document.getElementById('imgPreview').src = e.target.result;
        wrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
}

// ── SUBIR A imgBB ─────────────────────────────────────────────────
async function subirImagen(file) {
    const status = document.getElementById('imgStatus');
    status.textContent = 'Subiendo imagen…';
    status.className = 'img-status loading';

    const formData = new FormData();
    formData.append('image', file);
    const res  = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
        status.textContent = '✓ Imagen subida';
        status.className = 'img-status ok';
        return data.data.url;
    } else {
        status.textContent = '✗ Error al subir la imagen';
        status.className = 'img-status err';
        return null;
    }
}

// ── CARGAR ANUNCIOS ───────────────────────────────────────────────
async function cargar() {
    const res  = await fetch(SCRIPT_URL);
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    data.sort(() => Math.random() - 0.5);

    document.getElementById('tablon').innerHTML = data.map(a => `
        <div class="tarjeta" id="tarjeta-${a.id}">
            <div class="foto-wrap">
                <img src="${a.imagen}" class="foto-articulo" onclick="ampliar('${a.imagen}')">
                <button class="btn-borrar-foto" onclick="borrarAnuncio('${a.id}')" title="Borrar anuncio">🗑️</button>
            </div>
            <div class="titulo-tarjeta">${a.titulo}</div>
            <div class="descripcion">${a.descripcion}</div>
            <div class="precio">${a.precio}€</div>
            <div class="burbujas">
                <span class="tag">📍 ${a.recogida}</span>
                <span class="tag">📦 ${a.estado}</span>
            </div>
            <div class="botones-contacto">
                <a href="tel:${a.contacto}" class="btn-contacto btn-llamar">LLAMAR</a>
                <a href="https://wa.me/34${a.contacto}" class="btn-contacto btn-wa" target="_blank">WHATSAPP</a>
            </div>
        </div>`).join('');
}

function ampliar(src) {
    document.getElementById('imgGrande').src = src;
    document.getElementById('modal').style.display = 'flex';
}

// ── BORRAR ────────────────────────────────────────────────────────
async function borrarAnuncio(id) {
    const pin = prompt('🗑️ Introduce tu PIN de 6 dígitos para borrar este anuncio:');
    if (!pin) return;

    const res  = await fetch(`${SCRIPT_URL}?action=delete&id=${encodeURIComponent(id)}&pin=${encodeURIComponent(pin.trim())}`);
    const data = await res.json();

    if (data.status === 'ok') {
        document.getElementById('tarjeta-' + id)?.remove();
        alert('✅ Anuncio eliminado correctamente.');
    } else {
        alert('❌ PIN incorrecto. El anuncio no se ha borrado.');
    }
}

// ── ENVIAR ────────────────────────────────────────────────────────
async function enviar(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerText = "Publicando...";

    // 1. Subir imagen a imgBB primero
    const file = document.getElementById('imagen').files[0];
    const imagenUrl = await subirImagen(file);
    if (!imagenUrl) {
        alert('Error al subir la imagen. Inténtalo de nuevo.');
        btn.disabled = false;
        btn.innerText = "ENVIAR ANUNCIO";
        return;
    }

    // 2. Enviar datos al AppScript (sin base64, solo la URL)
    const params = new URLSearchParams({
        titulo:      document.getElementById('titulo').value,
        estado:      document.getElementById('estado').value,
        descripcion: document.getElementById('descripcion').value,
        precio:      document.getElementById('precio').value,
        contacto:    document.getElementById('contacto').value,
        recogida:    document.getElementById('recogida').value,
        email:       document.getElementById('email').value.trim(),
        imagenUrl:   imagenUrl
    });

    const res  = await fetch(SCRIPT_URL, { method: 'POST', body: params, redirect: 'follow' });
    const text = await res.text();
    const data = JSON.parse(text);

    if (data.status === 'ok') {
        const emailIntroducido = document.getElementById('email').value.trim();
        document.getElementById('pinMostrado').innerHTML = `
            <div class="pin-box">
                <p>🔑 <b>Tu PIN personal es:</b></p>
                <div class="pin-num">${data.pin}</div>
                <button class="btn-copiar-pin" onclick="copiarPin('${data.pin}', this)">📋 Copiar PIN</button>
                <p class="pin-aviso">
                    ${emailIntroducido
                        ? `✅ Te hemos enviado el PIN a <b>${emailIntroducido}</b>`
                        : '⚠️ Guarda este PIN, no podrás recuperarlo si lo pierdes.'
                    }<br>Necesitarás el PIN para borrar tu anuncio.
                </p>
            </div>`;
        btn.innerText = "✅ Publicado";
        await cargar();
    } else {
        alert(data.status === 'ANTIFLOOD'
            ? 'Antiflood: espera 5 minutos antes de publicar otro anuncio.'
            : 'Error al publicar. Inténtalo de nuevo.');
        btn.disabled = false;
        btn.innerText = "ENVIAR ANUNCIO";
    }
}

function copiarPin(pin, btn) {
    navigator.clipboard.writeText(pin).then(() => {
        btn.textContent = "✅ ¡Copiado!";
        btn.classList.add('copiado');
        setTimeout(() => { btn.textContent = "📋 Copiar PIN"; btn.classList.remove('copiado'); }, 2500);
    });
}

cargar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleo Local | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --menta: #20a088; --fondo: #f4f6f9; }
        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: #334155; padding-bottom: 50px; }

        /* Header igual al de particulares */
        .header { background: var(--menta); padding: 15px 20px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .header-bandera { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
        .header h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }

        .contenedor-app { max-width: 900px; margin: 0 auto; padding: 20px; }
        h2.titulo-seccion { text-align: center; margin: 20px 0 5px; font-size: 24px; text-transform: uppercase; color: #1e293b; }
        .aviso { text-align: center; color: #64748b; font-size: 12px; margin-bottom: 20px; }

        .btn-publicar { display: block; width: 250px; margin: 0 auto 30px; padding: 14px; background: var(--menta); color: white; border: none; border-radius: 30px; font-weight: 700; cursor: pointer; }
        #form { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 40px; display: none; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        
        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .tarjeta { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; padding: 15px; }
        .titulo-tarjeta { font-weight: 900; font-size: 16px; margin-bottom: 8px; color: #1e293b; }
        .descripcion { font-size: 14px; color: #475569; margin-bottom: 15px; line-height: 1.5; white-space: pre-line; }
        .burbujas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .tag { background: #f1f5f9; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #475569; border: 1px solid #e2e8f0; }
        .btn-wa { display: block; width: 100%; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; color: white; background: #25d366; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="header-logo">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div class="contenedor-app">
    <h2 class="titulo-seccion">Empleo Local</h2>
    <p class="aviso">* Los anuncios se eliminan automáticamente tras 20 días.</p>
    <button class="btn-publicar" onclick="document.getElementById('form').style.display='block'">➕ PUBLICAR ANUNCIO</button>
  
    <div id="form">
        <form id="publicarForm" onsubmit="enviar(event)">
            <select id="buscasUOfreces" required>
                <option value="BUSCO">Busco empleo</option>
                <option value="OFREZCO">Busco personal</option>
            </select>
            <input type="text" id="titulo" placeholder="TÍTULO (EJ: CAMARERO/A)" required oninput="this.value=this.value.toUpperCase()">
            <select id="jornada" required>
                <option value="Jornada Completa">Jornada Completa</option>
                <option value="Jornada Parcial">Jornada Parcial</option>
                <option value="Fines de Semana">Fines de Semana</option>
            </select>
            <textarea id="descripcion" placeholder="Descripción del puesto o perfil" required rows="3"></textarea>
            <input type="tel" id="telefono" placeholder="Teléfono (9 cifras)" required pattern="[0-9]{9}" maxlength="9">
            <input type="email" id="email" placeholder="Email (opcional)">
            <button type="submit" id="btn" class="btn-publicar" style="width:100%; margin-bottom:0;">ENVIAR ANUNCIO</button>
        </form>
    </div>

    <div id="loading" style="text-align:center; padding:40px; font-weight:700; color:#888;">Cargando anuncios...</div>
    <div id="tablon" class="grid-anuncios"></div>
</div>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbxYYe_KcumXkwn_FYgrXOzIjioAK6VroEfklMnSKaR153Fqji6mr2eSwguiT1WI65az/exec";

async function cargar() {
    const res = await fetch(urlScript);
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    
    document.getElementById('tablon').innerHTML = data.reverse().map(a => `
    <div class="tarjeta">
        <div class="titulo-tarjeta">${a.titulo}</div>
        <div class="descripcion">${a.descripcion}</div>
        <div class="burbujas">
            <span class="tag">⏱️ ${a.jornada}</span>
            <span class="tag">${a.buscasUOfreces === 'BUSCO' ? '👤 Busco Empleo' : '💼 Busco Personal'}</span>
        </div>
        <a href="https://wa.me/34${a.telefono}" class="btn-wa" target="_blank">CONTACTAR POR WHATSAPP</a>
    </div>`).join('');
}

async function enviar(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.innerText = "Publicando...";
    const payload = {
        buscasUOfreces: document.getElementById("buscasUOfreces").value,
        titulo: document.getElementById("titulo").value,
        jornada: document.getElementById("jornada").value,
        descripcion: document.getElementById("descripcion").value,
        telefono: document.getElementById("telefono").value,
        email: document.getElementById("email").value
    };
    const res = await fetch(urlScript, { method: "POST", body: JSON.stringify(payload) });
    if((await res.json()).resultado === "ok") { alert("¡Publicado!"); location.reload(); }
    else { alert("Error al publicar."); btn.disabled = false; btn.innerText = "ENVIAR ANUNCIO"; }
}
cargar();
</script>
</body>
</html>

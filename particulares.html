<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particulares | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
        
        :root {
            --azul-inicio: #1e3a8a;
            --azul-fin: #3b82f6;
            --fondo: #f4f6f9;
        }

        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: #334155; margin: 0; }

        /* HEADER */
        .header { background: linear-gradient(135deg, var(--azul-inicio) 0%, var(--azul-fin) 100%); color: white; text-align: center; padding: 30px 20px; }
        .header-logo-link { text-decoration: none; color: white; display: inline-flex; align-items: center; gap: 12px; }
        .header-bandera { width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,0.2); }
        
        /* BANNER Y TITULARES */
        .banner-publicidad { background: #e2e8f0; text-align: center; padding: 10px; font-size: 12px; color: #64748b; border-bottom: 1px solid #cbd5e1; }
        .titulo-seccion { text-align: center; padding: 40px 20px 10px; font-size: 28px; font-weight: 900; color: var(--azul-inicio); text-transform: uppercase; }
        .subtitulo-seccion { text-align: center; padding: 0 20px 30px; font-size: 14px; color: #64748b; }

        /* NAVEGACIÓN Y APP */
        .contenedor-app { padding: 0 15px 50px; max-width: 1200px; margin: 0 auto; }
        .navegacion { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .btn-pestana { background: white; border: 1px solid #cbd5e1; padding: 10px 20px; font-weight: 700; border-radius: 8px; cursor: pointer; color: #475569; }
        .btn-pestana.activa { background: var(--azul-inicio); color: white; border-color: var(--azul-inicio); }
        .seccion-app { display: none; }
        .seccion-app.activa { display: block; }

        /* GRID */
        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .tarjeta-anuncio { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .cabecera-anuncio { padding: 14px 20px; }
        .titulo-anuncio { font-size: 15px; font-weight: 700; color: white; margin: 0; }
        .cargando { text-align: center; padding: 50px; font-weight: 700; color: var(--azul-inicio); }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="header-logo-link">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera" alt="Logo">
        <h1>infoespinar.com</h1>
    </a>
</header>

<div class="banner-publicidad">Espacio para banner publicitario - infoespinar.com</div>

<h2 class="titulo-seccion">Tablón de Particulares</h2>
<p class="subtitulo-seccion">USA ESTE ESPACIO COMO TABLÓN DE COMPRA-VENTA Y ANUNCIOS PARTICULARES. LOS ANUNCIOS SERÁN VISIBLES 20 DÍAS.</p>

<div class="contenedor-app">
    <div class="navegacion">
        <button class="btn-pestana activa" onclick="cambiarTab('tablon-sec', event)">📌 Ver Tablón</button>
        <button class="btn-pestana" onclick="cambiarTab('form-sec', event)">➕ Publicar Anuncio</button>
    </div>

    <div id="tablon-sec" class="seccion-app activa">
        <div id="loading" class="cargando">Cargando anuncios...</div>
        <div id="tablon" class="grid-anuncios"></div>
    </div>

    <div id="form-sec" class="seccion-app">
        <!-- Aquí iría tu formulario de publicación -->
        <div style="text-align:center; padding:50px;">Formulario de publicación en construcción...</div>
    </div>
</div>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbzPmN9-GeOe9EfKUSvCZR0rpUlJ6ebJ3lo0_q8WHwQLVGjiYIaQSGJuvglXmJrQC6CP/exec";

function cambiarTab(id, e) {
    document.querySelectorAll(".seccion-app").forEach(s => s.classList.remove("activa"));
    document.querySelectorAll(".btn-pestana").forEach(b => b.classList.remove("activa"));
    document.getElementById(id).classList.add("activa");
    e.target.classList.add("activa");
}

async function cargar() {
    const cont = document.getElementById("tablon");
    const loader = document.getElementById("loading");
    
    try {
        const res = await fetch(urlScript);
        const data = await res.json();
        loader.style.display = "none";
        cont.innerHTML = "";
        const colores = ["#1e3a8a", "#059669", "#7c3aed", "#ea580c"];

        data.forEach((a, i) => {
            cont.innerHTML += `
            <div class="tarjeta-anuncio">
                <div class="cabecera-anuncio" style="background:${colores[i % 4]}">
                    <h3 class="titulo-anuncio">${(a.titulo || "").toUpperCase()}</h3>
                </div>
                <div style="padding:20px;">
                    <p style="font-size:13px; color:#475569; margin-bottom:15px;">${a.descripcion || ""}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:900; font-size:17px;">${a.precio ? a.precio + "€" : "Gratis"}</span>
                        <a href="tel:${a.contacto}" style="background:var(--azul-fin); color:white; padding:8px 12px; border-radius:6px; text-decoration:none; font-size:12px; font-weight:700;">LLAMAR</a>
                    </div>
                </div>
            </div>`;
        });
    } catch(err) {
        loader.innerHTML = "Error al cargar los anuncios.";
    }
}

document.addEventListener('DOMContentLoaded', cargar);
</script>

</body>
</html>

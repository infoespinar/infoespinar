<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particulares | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --menta: #20a088; --fondo: #f4f6f9; }
        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: #334155; }

        /* HEADER COMPACTO Y LIMPIO */
        .header { background: var(--menta); padding: 15px 20px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .header-bandera { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
        .header h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }

        /* FORMULARIO Y TABLÓN */
        .contenedor-app { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .formulario-publicar { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display: none; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; }
        .btn-accion { width: 100%; padding: 12px; background: var(--menta); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        
        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .tarjeta-anuncio { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .foto-articulo { width: 100%; height: 160px; object-fit: cover; }
        .cuerpo-anuncio { padding: 15px; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="header-logo">
        <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div id="app" style="font-family: sans-serif; max-width: 900px; margin: auto;">
  <button onclick="document.getElementById('form').style.display='block'" style="background:#20a088; color:white; padding:10px; border:none; border-radius:5px;">➕ PUBLICAR ANUNCIO</button>
  
  <div id="form" style="display:none; background:#f4f4f4; padding:20px; margin:20px 0; border-radius:10px;">
    <form id="publicarForm" onsubmit="enviar(event)">
      <input type="text" id="titulo" placeholder="TÍTULO (MAYÚSCULAS)" required oninput="this.value=this.value.toUpperCase()">
      <select id="estado" required>
        <option value="">Selecciona estado...</option>
        <option>A ESTRENAR</option><option>COMO NUEVO</option><option>BUEN ESTADO</option><option>USADO</option><option>PARA RESTAURAR</option>
      </select>
      <textarea id="descripcion" placeholder="Descripción" required></textarea>
      <input type="number" id="precio" placeholder="Precio (€)" required>
      <select id="recogida" required>
        <option value="">Selecciona zona...</option>
        <option>EL ESPINAR</option><option>SAN RAFAEL</option><option>LASR</option><option>LA ESTACIÓN</option>
      </select>
      <input type="tel" id="contacto" placeholder="Teléfono (9 cifras)" required pattern="[0-9]{9}" maxlength="9">
      <input type="file" id="imagen" accept="image/*" required>
      <button type="submit" id="btn">ENVIAR</button>
    </form>
  </div>

  <div id="tablon" style="display:grid; gap:20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));"></div>
</div>

<script>
const url = "https://script.google.com/macros/s/AKfycbztGr52OqpIC2cgmA_I_qfPXjOlkkskkieCxUbRwkbKgdAhPrGz_mhqRfbwv_3o20A7/exec"; // Pega aquí tu URL del paso 1

async function cargar() {
  const res = await fetch(url);
  const data = await res.json();
  // Algoritmo de aleatorización (Fisher-Yates)
  for (let i = data.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [data[i], data[j]] = [data[j], data[i]];
  }
  document.getElementById('tablon').innerHTML = data.map(a => `
    <div style="border:1px solid #ddd; padding:10px; border-radius:10px;">
      <img src="${a.imagen}" style="width:100%; height:150px; object-fit:cover;">
      <h3>${a.titulo}</h3>
      <p>${a.descripcion}</p>
      <small>${a.recogida} | ${a.estado}</small>
      <p><b>${a.precio}€</b> | <a href="tel:${a.contacto}">Llamar</a></p>
    </div>`).join('');
}

async function enviar(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  
  const file = document.getElementById('imagen').files[0];
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = async () => {
    const params = new URLSearchParams({
      titulo: document.getElementById('titulo').value,
      estado: document.getElementById('estado').value,
      descripcion: document.getElementById('descripcion').value,
      precio: document.getElementById('precio').value,
      contacto: document.getElementById('contacto').value,
      recogida: document.getElementById('recogida').value,
      imagenBase64: reader.result
    });
    
    const res = await fetch(url, {method: 'POST', body: params});
    const txt = await res.text();
    if(txt === "OK") { alert("Publicado!"); location.reload(); }
    else { alert("Error: Inténtalo en 5 minutos."); btn.disabled = false; }
  };
}
cargar();
</script>
</body>
</html>

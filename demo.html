<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pedido - Frutería</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --form-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --focus-color: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: var(--form-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 450px;
        }

        .form-title {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--focus-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .price-badge {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .form-group .help-text {
            display: block;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #64748b;
        }

        optgroup {
            font-weight: 700;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        optgroup option {
            font-weight: normal;
            background-color: #fff;
            color: var(--text-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Pedido de Frutería</h2>
        
        <div class="price-badge" id="precioContainer">
            Selecciona un producto para ver el precio
        </div>

        <form id="recogidaForm" action="#" method="POST">
            
            <input type="hidden" id="precioFinal" name="precio_valor" value="0">
            <input type="hidden" id="formatoFinal" name="precio_formato" value="">

            <div class="form-group">
                <label for="producto">Producto</label>
                <select id="producto" name="producto" required disabled>
                    <option value="" disabled selected>Cargando catálogo...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de Contacto</label>
                <input 
                    type="tel" 
                    id="telefono" 
                    name="telefono" 
                    pattern="[0-9]{9}" 
                    maxlength="9" 
                    minlength="9" 
                    required 
                    placeholder="Ej: 612345678"
                    autocomplete="tel"
                >
                <span class="help-text">Introduce un número de 9 cifras.</span>
            </div>

            <div class="form-group">
                <label for="horario">Horario de Recogida</label>
                <select id="horario" name="horario" required>
                    <option value="" disabled selected>Selecciona una franja horaria...</option>
                    <optgroup label="☀️ Turnos de Mañana">
                        <option value="manana_primera">09:00 - 11:00</option>
                        <option value="manana_media">11:00 - 13:00</option>
                        <option value="manana_ultima">13:00 - 15:00</option>
                    </optgroup>
                    <optgroup label="🌙 Turnos de Tarde">
                        <option value="tarde_primera">16:00 - 18:00</option>
                        <option value="tarde_media">18:00 - 20:00</option>
                        <option value="tarde_ultima">20:00 - 22:00</option>
                    </optgroup>
                </select>
            </div>

            <button type="submit" class="btn-submit">Confirmar Pedido</button>
        </form>
    </div>

    <script>
        // ⚠️ PEGA AQUÍ TU ENLACE EN FORMATO .CSV PUBLICADO DE GOOGLE SHEETS:
        const SHEETS_CSV_URL = 'TU_ENLACE_DE_GOOGLE_SHEETS_AQUI';

        let listaProductos = []; 

        async function cargarDatosDesdeSheets() {
            const selectProducto = document.getElementById('producto');
            
            try {
                const respuesta = await fetch(`${SHEETS_CSV_URL}&cacheBust=${Date.now()}`);
                const texto = await respuesta.text();
                
                const lineas = texto.split(/\r?\n/);
                
                const categoriasAgrupadas = {
                    "Frutas": [],
                    "Verduras": [],
                    "Productos locales": [],
                    "Otros": []
                };

                listaProductos = []; 

                for (let i = 1; i < lineas.length; i++) {
                    if (!lineas[i].trim()) continue; 
                    
                    const columnas = lineas[i].split(',');
                    
                    if (columnas.length >= 3) {
                        const nombreProducto = columnas[0].replace(/"/g, '').trim();
                        const precioProducto = parseFloat(columnas[1].replace(/"/g, '').trim());
                        const formatoProducto = columnas[2].replace(/"/g, '').toLowerCase().trim(); // 'kg' o 'ud'
                        let catProducto = columnas[3] ? columnas[3].replace(/"/g, '').trim() : "Otros";

                        if (nombreProducto && !isNaN(precioProducto)) {
                            const nuevoProducto = { 
                                nombre: nombreProducto, 
                                precio: precioProducto, 
                                formato: formatoProducto === 'ud' ? 'ud' : 'kg' // Por defecto si hay error será kg
                            };
                            listaProductos.push(nuevoProducto);

                            if (categoriasAgrupadas[catProducto]) {
                                categoriasAgrupadas[catProducto].push(nuevoProducto);
                            } else {
                                categoriasAgrupadas["Otros"].push(nuevoProducto);
                            }
                        }
                    }
                }

                selectProducto.innerHTML = '<option value="" disabled selected>Selecciona un producto...</option>';

                for (const [nombreCat, productos] of Object.entries(categoriasAgrupadas)) {
                    if (productos.length > 0) {
                        const grupoHTML = document.createElement('optgroup');
                        grupoHTML.label = `📦 ${nombreCat.toUpperCase()}`;

                        productos.forEach(p => {
                            const option = document.createElement('option');
                            option.value = p.nombre;
                            option.textContent = p.nombre;
                            grupoHTML.appendChild(option);
                        });

                        selectProducto.appendChild(grupoHTML);
                    }
                }
                
                selectProducto.disabled = false;

            } catch (error) {
                console.error("Error cargando el catálogo:", error);
                selectProducto.innerHTML = '<option value="" disabled selected>Error al cargar productos</option>';
            }
        }

        // Detectar cambio de producto para mostrar el precio dinámico por Kilo o Unidad
        document.getElementById('producto').addEventListener('change', function() {
            const productoSeleccionado = this.value;
            const contenedorPrecio = document.getElementById('precioContainer');
            const inputPrecioOculto = document.getElementById('precioFinal');
            const inputFormatoOculto = document.getElementById('formatoFinal');
            
            const datosProducto = listaProductos.find(p => p.nombre === productoSeleccionado);
            
            if (datosProducto) {
                const precioFormateado = datosProducto.precio.toFixed(2);
                const textoFormato = datosProducto.formato === 'ud' ? 'ud' : 'kg';
                
                // Mostramos el precio adaptado dinámicamente al formato correcto
                contenedorPrecio.style.display = 'block';
                contenedorPrecio.innerHTML = `💰 Precio actual: <strong>${precioFormateado} € / ${textoFormato}</strong>`;
                
                // Guardamos los datos en los campos ocultos
                inputPrecioOculto.value = precioFormateado;
                inputFormatoOculto.value = textoFormato;
            }
        });

        if(SHEETS_CSV_URL !== 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTm0lL1WLFBTYYOazW9aOmYBew467h2WyPFnbVsPFpOc197DJdTWZTbZgmSFSzhVNfMiSDBmTDFf1QO/pub?gid=0&single=true&output=csv') {
            cargarDatosDesdeSheets();
        }

        // Validación estricta del teléfono
        const telefonoInput = document.getElementById('telefono');
        telefonoInput.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('recogidaForm').addEventListener('submit', function (e) {
            if (telefonoInput.value.length !== 9) {
                e.preventDefault();
                alert('Por favor, introduce un número de teléfono válido de exactamente 9 dígitos.');
                telefonoInput.focus();
            }
        });
    </script>

</body>
</html>

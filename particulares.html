<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');
  
  html, body{ margin:0; padding:0; background:transparent; font-family:'Lato',sans-serif; width:100%; overflow-x:hidden; }
  
  /* HEADER CORPORATIVO INFOESPINAR */
  .header-web { display: flex; align-items: center; gap: 15px; padding: 15px; background: #fff; border-bottom: 2px solid #00bd9d; }
  .header-web img { width: 40px; height: 40px; border-radius: 8px; }
  .header-web h2 { font-size: 20px; font-weight: 900; color: #1e293b; margin: 0; }
  
  /* TÍTULO SECCIÓN COMPRA-VENTA */
  .titulo-seccion { background: #00bd9d; color: white; padding: 15px; text-align: center; font-weight: 800; font-size: 18px; text-transform: uppercase; }

  .contenedor-app{ padding: 20px 15px; max-width: 1200px; margin:0 auto; }
  
  /* Resto de estilos (optimizados para móvil) */
  .navegacion{ display:flex; gap:5px; margin-bottom:20px; border-bottom:2px solid #e2e8f0; padding-bottom:10px; flex-wrap: wrap; }
  .btn-pestana{ background:#f1f5f9; border:none; padding:10px 15px; font-weight:700; border-radius:8px; cursor:pointer; color:#475569; font-size: 14px; flex: 1; }
  .btn-pestana.activa{ background:#1e293b; color:#fff; }
  .seccion-app{ display:none; }
  .seccion-app.activa{ display:block; }
  .input-buscador{ width:100%; padding:12px; border:2px solid #cbd5e1; border-radius:10px; box-sizing:border-box; }
  .grid-anuncios{ display:grid; grid-template-columns:1fr; gap:20px; }
  @media (min-width: 600px) { .grid-anuncios { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  
  .tarjeta-anuncio{ background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .cabecera-anuncio{ padding:12px 15px; color: white; font-weight:700; text-transform:uppercase; font-size: 14px; }
  .contenedor-foto{ width:100%; height:180px; background:#f8fafc; }
  .foto-articulo{ width:100%; height:100%; object-fit:cover; }
  .cuerpo-anuncio{ padding:15px; }
  .footer-tarjeta{ display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9; padding-top:12px; margin-top: 10px; }
  .btn-contacto{ padding:8px 12px; border-radius:6px; text-decoration:none; color:#fff; font-size:12px; font-weight:700; }
  .btn-whatsapp{ background:#25d366; }
  .btn-llamar{ background:#3b82f6; }
  .formulario-publicar{ background:#fff; padding:20px; border-radius:12px; border:1px solid #e2e8f0; }
  .btn-enviar{ width:100%; padding:14px; background:#059669; color:#fff; border:none; border-radius:8px; font-weight:700; font-size: 16px; cursor:pointer; }
</style>
</head>
<body>

<div class="header-web">
    <img src="https://i.imgur.com/di5CaLV.png" alt="Logo">
    <h2>infoespinar.com</h2>
</div>
<div class="titulo-seccion">Compra - Venta</div>

<div class="contenedor-app" id="wrapper">
  <div class="navegacion">
    <button class="btn-pestana activa" onclick="cambiar('tablon-sec',event)">📌 Ver Tablón</button>
    <button class="btn-pestana" onclick="cambiar('form-sec',event)">➕ Publicar</button>
  </div>

  <div id="buscador-cont" class="contenedor-buscador activo">
    <input type="text" id="txtBuscador" class="input-buscador" placeholder="🔍 Buscar anuncios..." oninput="filtrarAnuncios()">
  </div>

  <div id="tablon-sec" class="seccion-app activa">
    <div id="loading" class="cargando">Cargando anuncios...</div>
    <div id="tablon" class="grid-anuncios"></div>
  </div>

  <div id="form-sec" class="seccion-app">
    <div class="formulario-publicar">
      <form id="formAnuncio" onsubmit="enviar(event)">
        <button id="btnPublicar" class="btn-enviar" disabled>🚀 Publicar Anuncio</button>
      </form>
      <div id="status"></div>
    </div>
  </div>
</div>

<script>
// ... Mantén tu misma lógica de funciones cargar(), enviar(), etc ...
// Solo asegúrate de que al final del script, la altura de actualizarAltura sea suficiente:
function actualizarAltura(){ 
    const wrapper = document.getElementById("wrapper"); 
    if(window.parent){ 
        window.parent.postMessage({type:"resize", height:wrapper.offsetHeight + 200}, "*"); 
    } 
}
</script>
</body>
</html>

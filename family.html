<!DOCTYPE html>
<html lang="es">
<head>

<title>Viaje a China</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;background:#1c1412;color:#2a1a14}
.car{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;background:#fbf4e6;position:relative}
.art{flex:0 0 54%;position:relative;overflow:hidden}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.txt{flex:1;padding:18px 24px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:6px}
.tag{align-self:flex-start;font:600 .78rem system-ui,sans-serif;letter-spacing:.04em;padding:4px 12px;border-radius:20px;background:#e8d9bd;color:#5b4636}
.now .tag{background:#b3201f;color:#fff}
.past .tag{background:#dfe9d8;color:#3c5a35}
.day{font:600 .95rem system-ui,sans-serif;color:#7a6558;margin-top:4px}
.city{font-size:2rem;line-height:1.1;margin:0;color:#b3201f}
.zh{font-size:1.1rem;color:#8a6a1f;letter-spacing:.1em}
.ttl{font-size:1.25rem;font-weight:bold;margin:8px 0 0}
.desc{font-size:1.05rem;line-height:1.55;margin:0;color:#3d2d26}
.past{filter:saturate(.7)}
.past .art{opacity:.85}
.next .desc{color:#6d5c52}
.bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;background:rgba(28,20,18,.72);color:#fff;font:600 .8rem system-ui,sans-serif;padding:6px 14px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(6px)}
.hero{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#8e1413,#b3201f 55%,#c8962b);color:#fff;padding:24px}
.hero h1{font-size:2.4rem;margin:0 0 6px}
.hero .big{font-size:1.5rem;margin:18px 0 6px}
.hero p{margin:0;opacity:.92;font-size:1.05rem}
.hint{margin-top:28px;font:.9rem system-ui,sans-serif;opacity:.8}
.hero .zh{color:#ffe3a0;font-size:1.6rem}
#btnMusica{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:30px;padding:10px 16px;background:rgba(28,20,18,.78);color:#fff;font:600 .85rem system-ui,sans-serif;backdrop-filter:blur(6px)}
</style>
</head>

function fondo(i,a,b){
  return '<defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/>'
  +'</linearGradient></defs><rect width="400" height="240" fill="url(#g'+i+')"/>';
}

function sol(x,y,r,c){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" opacity=".92"/>';
}

function nube(x,y){
  return '<g fill="#fff" opacity=".9">'
  +'<ellipse cx="'+x+'" cy="'+y+'" rx="44" ry="14"/>'
  +'<ellipse cx="'+(x+26)+'" cy="'+(y-9)+'" rx="26" ry="14"/>'
  +'<ellipse cx="'+(x-24)+'" cy="'+(y-6)+'" rx="22" ry="11"/></g>';
}

function casa(x,y,w,c){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(w*.55)+'" fill="'+c+'"/>'
  +'<path d="M'+(x-4)+' '+y+'L'+(x+w/2)+' '+(y-w*.38)+'L'+(x+w+4)+' '+y+'Z" fill="#4a3a30"/>'
  +'<rect x="'+(x+w*.4)+'" y="'+(y+w*.14)+'" width="'+(w*.2)+'" height="'+(w*.22)+'" fill="#ffd36b"/>';
}

function farol(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="#ffb347" opacity=".35"/>'
  +'<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#d62d20"/>';
}

const D=[

const q=new URLSearchParams(location.search).get("fecha");
const fmt=function(z,d){return new Intl.DateTimeFormat("en-CA",{timeZone:z}).format(d);};
const today=q||fmt("Asia/Shanghai",new Date());
const todayES=q||fmt("Europe/Madrid",new Date());
const dif=function(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5);};
const first=D[0][0];
const last=D[D.length-1][0];
const cur=D.find(function(d){return d[0]===today;});
let st="during";
if(today<first){st="before";}
if(today>last){st="after";}

const meses={"10":"octubre","11":"noviembre"};
function dd(d){
  const partes=d.split("-");
  return parseInt(partes[2],10)+" de "+meses[partes[1]];
}

let hero="";
if(st==="before"){
  hero='<div class="big">Faltan '+dif(todayES,first)+' días</div><p>para salir hacia China</p>';
}else if(st==="after"){
  hero='<div class="big">¡Ya hemos vuelto!</div><p>Gracias por acompañarnos</p>';
}else{
  hero='<div class="big">Ahora en '+cur[2]+'</div><p>'+cur[4]+'</p>';
}

let h='<section class="card hero"><h1>Viaje a China</h1><div class="zh">中国</div>'+hero
+'<p>'+dd(first)+' – '+dd(last)+'</p><div class="hint">Desliza hacia arriba ↑</div></section>';

for(let n=0;n<D.length;n++){
  const d=D[n];
  let clase="next";
  let etiqueta="Próximamente";
  if(d[0]===today){clase="now";etiqueta="📍 Ahora";}
  else if(d[0]<today){clase="past";etiqueta="✓ Hecho";}

  const imagen=S[d[6]](n,d[7]);
  const foto='<img src="fotos/dia-'+d[0].slice(5)+'.jpg" alt="" onerror="this.remove()">';

  h+='<section class="card '+clase+'" data-d="'+d[0]+'">'
  +'<div class="art">'+imagen+foto+'</div>'
  +'<div class="txt">'
  +'<span class="tag">'+etiqueta+'</span>'
  +'<div class="day">'+d[1][0].toUpperCase()+d[1].slice(1)+' '+dd(d[0])+'</div>'
  +'<h2 class="city">'+d[2]+'</h2>'
  +'<div class="zh">'+d[3]+'</div>'
  +'<div class="ttl">'+d[4]+'</div>'
  +'<p class="desc">'+d[5]+'</p>'
  +'</div></section>';
}

const musica=document.getElementById("musica");

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;background:#1c1412;color:#2a1a14}
.car{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;background:#fbf4e6;position:relative}
.art{flex:0 0 54%;position:relative;overflow:hidden}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.txt{flex:1;padding:18px 24px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:6px}
.tag{align-self:flex-start;font:600 .78rem system-ui,sans-serif;letter-spacing:.04em;padding:4px 12px;border-radius:20px;background:#e8d9bd;color:#5b4636}
.now .tag{background:#b3201f;color:#fff}
.past .tag{background:#dfe9d8;color:#3c5a35}
.day{font:600 .95rem system-ui,sans-serif;color:#7a6558;margin-top:4px}
.city{font-size:2rem;line-height:1.1;margin:0;color:#b3201f}
.zh{font-size:1.1rem;color:#8a6a1f;letter-spacing:.1em}
.ttl{font-size:1.25rem;font-weight:bold;margin:8px 0 0}
.desc{font-size:1.02rem;line-height:1.5;margin:0;color:#3d2d26}
.past{filter:saturate(.7)}
.past .art{opacity:.85}
.next .desc{color:#6d5c52}
.bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;background:rgba(28,20,18,.72);color:#fff;font:600 .8rem system-ui,sans-serif;padding:6px 14px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(6px)}
.hero{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#8e1413,#b3201f 55%,#c8962b);color:#fff;padding:24px}
.hero h1{font-size:2.4rem;margin:0 0 6px}
.hero .big{font-size:1.5rem;margin:18px 0 6px}
.hero p{margin:0;opacity:.92;font-size:1.05rem}
.hint{margin-top:28px;font:.9rem system-ui,sans-serif;opacity:.8}
.hero .zh{color:#ffe3a0;font-size:1.6rem}
#btnMusica{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:30px;padding:10px 16px;background:rgba(28,20,18,.78);color:#fff;font:600 .85rem system-ui,sans-serif;backdrop-filter:blur(6px)}
</style>
</head>

function fondo(i,a,b){
  return '<defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/>'
  +'</linearGradient></defs><rect width="400" height="240" fill="url(#g'+i+')"/>';
}

function sol(x,y,r,c){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" opacity=".92"/>';
}

function nube(x,y){
  return '<g fill="#fff" opacity=".9">'
  +'<ellipse cx="'+x+'" cy="'+y+'" rx="44" ry="14"/>'
  +'<ellipse cx="'+(x+26)+'" cy="'+(y-9)+'" rx="26" ry="14"/>'
  +'<ellipse cx="'+(x-24)+'" cy="'+(y-6)+'" rx="22" ry="11"/></g>';
}

function casa(x,y,w,c){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(w*.55)+'" fill="'+c+'"/>'
  +'<path d="M'+(x-4)+' '+y+'L'+(x+w/2)+' '+(y-w*.38)+'L'+(x+w+4)+' '+y+'Z" fill="#4a3a30"/>'
  +'<rect x="'+(x+w*.4)+'" y="'+(y+w*.14)+'" width="'+(w*.2)+'" height="'+(w*.22)+'" fill="#ffd36b"/>';
}

function farol(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="#ffb347" opacity=".35"/>'
  +'<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#d62d20"/>';
}

const D=[
["2026-10-16","vie","Madrid → Pekín","北京","Llegada y primera toma de contacto","Vuelo de madrugada desde Madrid. Al llegar por la tarde, traslado a Pekín, primera cena con el famoso pato laqueado y paseo nocturno por la animada calle peatonal de Wangfujing.","avion"],

["2026-10-17","sáb","Pekín","北京","El eje imperial y los hutongs","Madrugada en la plaza de Tiananmen y recorrido de sur a norte por la Ciudad Prohibida, entre patios imperiales, salas ceremoniales y tejados dorados. Después subiremos al parque Jingshan para ver las mejores vistas del palacio y pasearemos por los hutongs tradicionales, las torres del Tambor y la Campana y los lagos de Houhai.","palacio"],

["2026-10-18","dom","Pekín","北京","La Gran Muralla y el arte contemporáneo","Excursión al tramo de Mutianyu: subida en teleférico, caminata panorámica entre torres y bajada en tobogán. De vuelta a la ciudad, visitaremos el distrito de arte 798, con galerías, esculturas y antiguas naves industriales reconvertidas. Por la noche, masaje recuperador y cena en el moderno barrio de Sanlitun.","muralla"],

["2026-10-19","lun","Pekín → Zhangjiajie","北京 · 张家界","Palacios imperiales y vuelo al sur","Por la mañana visitaremos el Palacio de Verano: el Gran Corredor, el Barco de Mármol y las vistas al lago Kunming desde la Torre del Incienso Budista. Después pasaremos por el Templo del Cielo y su gran parque, antes de volar hacia Zhangjiajie y instalarnos en Wulingyuan.","templo"],

["2026-10-20","mar","Zhangjiajie","张家界","El valle y la cueva del dragón","Primer día en el parque nacional recorriendo el Arroyo del Látigo Dorado, una ruta llana junto al río entre columnas de piedra y con posibilidad de ver monos salvajes. Por la tarde, visita a la Cueva del Dragón Amarillo, con enormes salas, formaciones iluminadas y un tramo en barca por su río subterráneo.","pilares"],

["2026-10-21","mié","Zhangjiajie","张家界","Las cumbres de Avatar y Tianzi","Subiremos en el ascensor de cristal Bailong, pegado al acantilado, hasta la zona de Yuanjiajie. Recorreremos los miradores de las montañas que inspiraron Avatar, cruzaremos el Primer Puente Bajo el Cielo y continuaremos hacia Tianzi, donde los picos se vuelven más finos y afilados. Bajaremos en teleférico entre la niebla y las agujas de roca.","pilares"],

["2026-10-22","jue","Zhangjiajie","张家界","Vértigo en el Gran Cañón","Excursión al Gran Cañón de Zhangjiajie: cruzaremos el puente de cristal suspendido a unos 300 metros de altura, bajaremos al fondo del valle por pasarelas y cascadas y podremos elegir alguna actividad de aventura, como una vía ferrata o un tobogán. Terminaremos con un paseo en barca por el lago Shenquan.","puente"],

["2026-10-23","vie","Zhangjiajie","张家界","La Puerta del Cielo","Dedicaremos la mañana a la montaña Tianmen: subida en teleférico, pasarelas colgadas y tramos de cristal, escaleras mecánicas dentro de la roca y visita al enorme arco natural de la Puerta del Cielo. Por la tarde, regreso tranquilo a Wulingyuan para pasear, cenar y recuperar fuerzas.","tianmen"],

["2026-10-24","sáb","Zhangjiajie → Furong","张家界 · 芙蓉镇","Día flexible y pueblo de la cascada","Mañana libre para completar lo que nos haya quedado pendiente: el lago Baofeng con su paseo en barca, el poblado antiguo de Dayong o el parque cultural Tujia. Por la tarde viajaremos a Furong, donde pasearemos por sus calles empedradas y veremos la gran cascada iluminada y el palacio Tuwang.","cascada"],

["2026-10-25","dom","Furong → Fenghuang","芙蓉镇 · 凤凰","De la cascada al río","Por la mañana veremos Furong con luz de día y cruzaremos la cascada por el paso tallado en la roca. Después tomaremos un tren corto hasta Fenghuang, la ciudad antigua de casas de madera colgadas sobre el río Tuojiang. Al caer la noche, paseo por sus puentes y calles iluminadas.","casas",0],

["2026-10-26","lun","Fenghuang","凤凰","Fenghuang sin prisas","Día completo en la ciudad antigua. Por la mañana, excursión al desfiladero de Feishui, una ruta corta entre cascadas, paredes de roca y puentes colgantes. Por la tarde recorreremos los callejones, la pagoda Wanming y las orillas del río; por la noche, masaje tradicional de pies y paseo en barca de madera bajo los farolillos.","casas",1],

["2026-10-27","mar","Fenghuang → Yangshuo","凤凰 · 阳朔","Ruta hacia el sur","Última mañana en Fenghuang para ver la muralla y la puerta Este del casco antiguo, con buenas vistas del río y los tejados. Después comenzaremos el traslado más largo del viaje hacia Yangshuo, en Guangxi. Al llegar, paseo por la animada West Street y cena de pescado a la cerveza.","tren"],

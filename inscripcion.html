<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  html, body { 
    margin: 0; 
    padding: 0; 
    background: transparent; 
    font-family: 'Inter', sans-serif; 
    width: 100%; 
    box-sizing: border-box; 
  }
  
  .formulario-publicar { 
    background: #ffffff; 
    padding: 32px; 
    border-radius: 12px; 
    border: 1px solid #e2e8f0; 
    max-width: 660px; 
    margin: 10px auto; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
  }

  .titulo-principal-form {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: #0F172A; 
    text-align: center;
    margin: 0 0 8px 0;
  }
  
  .subtitulo-form { 
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 14px; 
    color: #64748B; 
    margin: 0 0 32px 0; 
    text-align: center; 
    line-height: 1.6;
  }
  
  .grupo-campo { margin-bottom: 24px; }
  .grupo-campo label.titulo-campo { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; }
  
  .grupo-campo input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 15px; color: #1e293b; transition: border 0.2s; }
  .grupo-campo input:focus { border-color: #0ea5e9; outline: none; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
  
  #txtNombre { text-transform: uppercase; }
  
  .cuadrícula-sectores, .linea-nucleos { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 12px; 
    background: #f8fafc; 
    padding: 20px; 
    border-radius: 10px; 
    border: 1px solid #e2e8f0; 
  }

  .opcion-seleccion { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #475569; cursor: pointer; }
  .opcion-seleccion input { width: 18px; height: 18px; cursor: pointer; accent-color: #0ea5e9; }
  
  .grupo-privacidad { display: flex; align-items: flex-start; gap: 12px; margin: 24px 0; font-size: 13px; color: #64748B; line-height: 1.5; }
  .grupo-privacidad a { color: #0ea5e9; font-weight: 600; text-decoration: none; }
  
  .bloque-oferta-web { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 20px; margin-top: 12px; display: none; }
  .bloque-oferta-web p { margin: 0 0 16px 0; font-size: 14px; color: #166534; }
  
  .btn-solicitar-web { padding: 10px 20px; background: #22c55e; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
  .btn-solicitar-web:hover { background: #16a34a; }
  
  .btn-enviar { width: 100%; padding: 14px; background: #0F172A; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.2s; }
  .btn-enviar:hover { background: #1e293b; }
  
  .campo-oculto { margin-top: 12px; display: none; }
  .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  @media(max-width: 500px) {
    .cuadrícula-sectores, .linea-nucleos, .fila-doble { grid-template-columns: 1fr; }
  }
</style>

<div class="formulario-publicar" id="wrapper">
  <h1 class="titulo-principal-form">Inscripción de Empresa</h1>
  <p class="subtitulo-form">Completa el formulario para incluir tu negocio en la plataforma tras nuestra revisión.</p>
  
  <form id="formAnuncio" onsubmit="enviar(event)">
    <div class="grupo-campo">
      <label class="titulo-campo">Nombre de la Empresa o Comercio *</label>
      <input id="txtNombre" required placeholder="Ej: FONTANERÍA EL ESPINAR" oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="grupo-campo">
      <label class="titulo-campo">Sector / Categoría *</label>
      <div class="cuadrícula-sectores">
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="jardinería"> Jardinería 🏡</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="limpieza"> Limpieza 🧹</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="reformas"> Reformas 🏗️</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="restaurantes"> Restaurantes 🍽️</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="talleres"> Talleres 🚗</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="ferretería"> Ferretería 🔨</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="panadería-pastelería"> Panadería 🥖</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="salud"> Salud ❤️</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="bienestar"> Bienestar 💆</label>
        <label class="opcion-seleccion"><input type="checkbox" name="sector_opc" value="otros" id="chkOtroSector" onchange="alternarSectorOtro(this)"> Otros</label>
      </div>
      <input type="text" id="txtOtroSector" class="campo-oculto" placeholder="Especifica tu actividad...">
    </div>

    <div class="fila-doble">
      <div class="grupo-campo">
        <label class="titulo-campo">Teléfono de contacto *</label>
        <input id="txtTelefono" type="tel" required pattern="[0-9]{9}" maxlength="9" placeholder="9 números">
      </div>
      <div class="grupo-campo">
        <label class="titulo-campo">Email</label>
        <input id="txtEmail" type="email" placeholder="nombre@empresa.com">
      </div>
    </div>

    <div class="grupo-campo">
      <label class="titulo-campo">¿Dispone de página web? *</label>
      <div class="linea-nucleos" style="grid-template-columns: 1fr 1fr;">
        <label class="opcion-seleccion"><input type="radio" name="tiene_web" value="si" onclick="evaluarWeb(this)" checked> Sí, tengo</label>
        <label class="opcion-seleccion"><input type="radio" name="tiene_web" value="no" onclick="evaluarWeb(this)"> No tengo</label>
      </div>
      <input type="url" id="txtWeb" style="display: block; margin-top: 10px;" required placeholder="https://tuweb.com">
      
      <div id="ofertaWeb" class="bloque-oferta-web">
        <p>💡 <strong>¿Te gustaría tener presencia online?</strong> En <strong>infoespinar.com</strong> creamos tu web sencilla y económica.</p>
        <button type="button" id="btnInteresWeb" class="btn-solicitar-web" onclick="solicitarInformacionWeb()">Quiero información</button>
      </div>
    </div>

    <div class="grupo-privacidad">
      <input type="checkbox" id="checkPrivacidad" required>
      <label for="checkPrivacidad">Acepto la <a href="https://www.infoespinar.com/privacidad" target="_blank">Política de Privacidad</a> y consiento la publicación de mis datos.</label>
    </div>

    <button class="btn-enviar" id="btnPublicar">Enviar Inscripción</button>
  </form>
  <div id="status" style="margin-top:20px;"></div>
</div>

<script>
  // ... (Tu lógica de script original se mantiene exactamente igual para asegurar el funcionamiento)
  const urlScript = "https://script.google.com/macros/s/AKfycbzu9F8N6T1-EJGWrCnMmqL-AaAiHEjugavye5P5MmNEob1KNAePVG_nyFJYwlebhpIp/exec"; 
  let solicitoDiseñoWeb = false;

  function alternarSectorOtro(checkbox) {
    const txtOtroSec = document.getElementById("txtOtroSector");
    txtOtroSec.style.display = checkbox.checked ? "block" : "none";
    txtOtroSec.required = checkbox.checked;
  }

  function evaluarWeb(radio) {
    const inputWeb = document.getElementById("txtWeb");
    const bloqueOferta = document.getElementById("ofertaWeb");
    if (radio.value === "si") {
      inputWeb.style.display = "block";
      inputWeb.required = true;
      bloqueOferta.style.display = "none";
    } else {
      inputWeb.style.display = "none";
      inputWeb.required = false;
      bloqueOferta.style.display = "block";
    }
  }

  function solicitarInformacionWeb() {
    solicitoDiseñoWeb = true;
    document.getElementById("btnInteresWeb").innerHTML = "✓ ¡Solicitado!";
  }

  // (El resto de tu lógica de envío 'enviar(e)' permanece igual)
</script>

<style>
  /* Importamos la fuente */
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght=300;400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Lato', sans-serif; 
    background-color: transparent; 
    padding: 8px 4px;
    overflow-y: auto; 
    overflow-x: hidden;
  }

  /* Header Unificado */
  .header-seccion { padding: 15px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; text-align: center; }
  .header-titulo { font-size: 22px; font-weight: 900; color: #1e3a8a; margin: 0; text-transform: uppercase; }
  .header-titulo span { color: #15803d; }
  .header-sub { font-size: 12px; color: #64748b; margin-top: 5px; }

  /* Mapa y Tarjetas */
  .map-wrapper { width: 100%; height: 350px; overflow: hidden; border-radius: 12px; border: 1px solid #e0e0e0; position: relative; margin-bottom: 25px; }
  .map-wrapper iframe { position: absolute; top: -60px; left: 0; width: 100%; height: calc(100% + 60px); border: 0; }
  
  .grid-comercios { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; width: 100%; padding-bottom: 25px; visibility: hidden; }
  .tarjeta-comercio { background: #ffffff; border: 1px solid #e2e8f0; border-top: 4px solid #14532d; border-radius: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; transition: all 0.15s ease-in-out; }
  .info-comercio { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
  .nombre-comercio { font-size: 19px; font-weight: 700; color: #14532d; margin-bottom: 4px; line-height: 1.3; }
  .enlace-web { display: inline-block; font-size: 14px; color: #334155; text-decoration: none; margin-bottom: 8px; }
  .direccion-comercio { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.4; }
  
  .bloque-botones { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .fila-contacto { display: flex; gap: 10px; }
  .btn { text-decoration: none; font-size: 14px; font-weight: 700; padding: 12px 14px; border-radius: 10px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: #ffffff; transition: background-color 0.2s ease; }
  .btn-llamar { background-color: #000000; flex: 1; }
  .btn-whatsapp { background-color: #10b981; flex: 1; }
  .btn-maps { background-color: #1a73e8; width: 100%; }
  .btn-email { background-color: #facc15; color: #000000; width: 100%; }
</style>

<div class="header-seccion">
    <h1 class="header-titulo">Info<span>Espinar</span></h1>
    <p class="header-sub">Directorio de servicios locales</p>
</div>

<div class="map-wrapper">
  <iframe src="https://www.google.com/maps/d/embed?mid=13tCRPicquTdHMFa4EcKgaj1taHkU6qc&ehbc=2E312F&noprof=1"></iframe>
</div>

<div class="grid-comercios" id="gridVeterinarias">
  <div class="tarjeta-comercio" data-search="anumanu nutricion bienestar animal">
    <div class="info-comercio">
      <div class="nombre-comercio">Anumanu Nutrición y Bienestar Animal</div>
      <a href="https://www.anumanu.es" target="_blank" rel="noopener" class="enlace-web">🌐 anumanu.es</a>
      <div class="direccion-comercio">📍 El Espinar</div>
      <div class="bloque-botones">
        <div class="fila-contacto">
          <a href="tel:+34654050468" class="btn btn-llamar">📞 Llamar</a>
          <a href="https://wa.me/34654050468" class="btn btn-whatsapp">💬 WhatsApp</a>
        </div>
        <a href="mailto:animal@anumanu.es" class="btn btn-email">📧 Enviar Email</a>
      </div>
    </div>
  </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const contenedor = document.getElementById("gridVeterinarias");
  const tarjetas = Array.from(contenedor.getElementsByClassName("tarjeta-comercio"));
  for (let i = tarjetas.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tarjetas[i], tarjetas[j]] = [tarjetas[j], tarjetas[i]];
  }
  tarjetas.forEach(tarjeta => contenedor.appendChild(tarjeta));
  contenedor.style.visibility = "visible";
  actualizarAltura();
});

function actualizarAltura() {
  if(window.parent && window.parent.postMessage) {
    window.parent.postMessage({type: 'resize', height: document.body.scrollHeight + 30}, '*');
  }
}
window.addEventListener('resize', actualizarAltura);
</script>

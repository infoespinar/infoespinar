<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra-Venta | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');
        * { box-sizing: border-box; }
        
        /* --- ESTILOS DEL HEADER --- */
        .header { background: linear-gradient(135deg, #06b6d4 0%, #1e3a8a 100%); color: white; text-align: center; padding: 25px 20px; }
        .header-logo-link { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: white; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 30px; }
        .header-bandera { width: 32px; height: 32px; border-radius: 6px; }
        .header h1 { font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; }

        /* --- ESTILOS DE LA APP --- */
        body { margin: 0; padding: 0; font-family: 'Lato', sans-serif; background-color: #f8fafc; }
        .contenedor-app { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .navegacion { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .btn-pestana { background: #f1f5f9; border: none; padding: 10px 20px; font-weight: 700; border-radius: 8px; cursor: pointer; color: #475569; transition: 0.2s; }
        .btn-pestana.activa { background: #1e293b; color: #fff; }
        .seccion-app { display: none; }
        .seccion-app.activa { display: block; }
        
        .contenedor-buscador { margin-bottom: 20px; display: none; }
        .contenedor-buscador.activo { display: block; }
        .input-buscador { width: 100%; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 14px; outline: none; }
        .input-buscador:focus { border-color: #1e293b; }

        .grid-anuncios { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .tarjeta-anuncio { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .tarjeta-anuncio.oculta { display: none !important; }
        
        .cabecera-anuncio { padding: 14px 20px; text-transform: uppercase; }
        .titulo-anuncio { font-size: 15px; font-weight: 700; color: #fff; margin: 0; }
        
        .contenedor-foto { width: 100%; height: 200px; background: #f8fafc; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #f1f5f9; }
        .foto-articulo { width: 100%; height: 100%; object-fit: cover; }
        .cuerpo-anuncio { padding: 16px 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .meta-anuncio { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .recogida-anuncio { font-size: 11.5px; color: #0284c7; font-weight: 700; }
        .estado-anuncio { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; color: #475569; }
        .desc-anuncio { font-size: 13.5px; color: #475569; margin-bottom: 16px; flex-grow: 1; }
        
        .footer-tarjeta { display: flex; gap: 8px; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 12px; justify-content: space-between; }
        .precio-anuncio { font-size: 17px; font-weight: 700; color: #0f172a; white-space: nowrap; }
        .bloque-botones { display: flex; gap: 6px; }
        .btn-contacto { padding: 8px 10px; border-radius: 6px; text-decoration: none; color: #fff; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; }
        .btn-whatsapp { background: #25d366; }
        .btn-llamar { background: #3b82f6; }
        
        .formulario-publicar { background: #fff; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; max-width: 600px; margin: 0 auto; }
        .grupo-campo { margin-bottom: 16px; }
        .grupo-campo label { display: block; font-size: 13.5px; font-weight: 700; color: #334155; margin-bottom: 6px; }
        .grupo-campo input, .grupo-campo select, .grupo-campo textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        #titulo { text-transform: uppercase; }
        
        .grupo-privacidad { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; }
        .btn-enviar { width: 100%; padding: 12px; background: #059669; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-enviar:disabled { background: #94a3b8; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="header-logo-link">
            <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera" alt="Bandera"> 
            <h1>infoespinar.com</h1>
        </a>
    </header>

    <div class="contenedor-app" id="wrapper">
        <!-- AQUÍ VA TU CÓDIGO DE NAVEGACIÓN Y FORMULARIO -->
        <div class="navegacion">
            <button class="btn-pestana activa" onclick="cambiar('tablon-sec', event)">📌 Ver Tablón</button>
            <button class="btn-pestana" onclick="cambiar('form-sec', event)">➕ Publicar Anuncio</button>
        </div>
        <!-- ... (Resto de tu HTML anterior) ... -->
    </div>

    <script>

    </script>
</body>
</html>

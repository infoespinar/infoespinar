<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes Compartidos | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --menta:#20a088;
  --fondo:#f4f6f9;
}

body{
  font-family:'Lato',sans-serif;
  background:var(--fondo);
  color:#334155;
  padding-bottom:50px;
}

.header{
  background:var(--menta);
  padding:15px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.header-logo{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:white;
}

.header-bandera{
  width:28px;
  height:28px;
  border-radius:4px;
}

.contenedor-app{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

h2{
  text-align:center;
  margin:20px 0 10px;
}

.subtitulo{
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin-bottom:20px;
}

.btn-publicar{
  display:block;
  width:250px;
  margin:0 auto 20px;
  padding:14px;
  background:var(--menta);
  color:white;
  border:none;
  border-radius:30px;
  font-weight:700;
  cursor:pointer;
}

#form{
  display:none;
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:30px;
}

input,select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.tarjeta{
  background:white;
  padding:15px;
  border-radius:12px;
  border:1px solid #e2e8f0;
}

.titulo{
  font-weight:900;
  margin-bottom:8px;
}

.ruta{
  margin-bottom:8px;
}

.info{
  font-size:13px;
  margin-bottom:10px;
  color:#475569;
}

.tag{
  display:inline-block;
  font-size:11px;
  background:#f1f5f9;
  padding:4px 8px;
  border-radius:12px;
  margin-right:5px;
}

.btn-wa{
  display:block;
  margin-top:10px;
  text-align:center;
  background:#25d366;
  color:white;
  padding:10px;
  border-radius:8px;
  text-decoration:none;
}

.filtros{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:15px;
}

.filtros button{
  padding:8px 12px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:#e2e8f0;
  font-weight:700;
}

.filtros button.activo{
  background:var(--menta);
  color:white;
}
</style>
</head>

<body>

<header class="header">
  <a class="header-logo">
    <img src="https://i.imgur.com/di5CaLV.png" class="header-bandera">
    <h1>INFOESPINAR.COM</h1>
  </a>
</header>

<div class="contenedor-app">

<h2>Viajes Compartidos</h2>
<div class="subtitulo">Filtra por tipo de viaje</div>

<div class="filtros">
  <button onclick="setFiltro('TODOS')" class="activo">Todos</button>
  <button onclick="setFiltro('CONDUCTOR')">Conductores</button>
  <button onclick="setFiltro('PASAJERO')">Pasajeros</button>
</div>

<button class="btn-publicar" onclick="toggleForm()">➕ PUBLICAR VIAJE</button>

<div id="form">
  <form onsubmit="enviar(event)">

    <select id="tipo" required>
      <option value="">Tipo</option>
      <option value="CONDUCTOR">Conductor</option>
      <option value="PASAJERO">Pasajero</option>
    </select>

    <input id="desde" placeholder="Desde" required>
    <input id="hasta" placeholder="Hasta" required>

    <input type="date" id="fecha" required>

    <select id="hora"></select>

    <input id="nombre" placeholder="Nombre" required>

    <input id="telefono" maxlength="9" placeholder="Teléfono" required>

    <button class="btn-publicar" type="submit" style="width:100%;">PUBLICAR</button>

  </form>
</div>

<div id="loading" style="text-align:center;">Cargando viajes...</div>

<div id="tablon" class="grid"></div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbynbarvkvs_ETBnocznNlrT_01uoSeQwRuPdddewPLfRcM3ZG9iuz0IQan291_Vj2ai/exec";

let filtro = "TODOS";

function setFiltro(t){
  filtro = t;
  cargar();
}

function toggleForm(){
  const f = document.getElementById("form");
  f.style.display = f.style.display === "block" ? "none" : "block";
}

function horas(){
  const h = document.getElementById("hora");
  for(let i=0;i<24;i++){
    for(let m=0;m<60;m+=15){
      h.innerHTML += `<option>${String(i).padStart(2,'0')}:${String(m).padStart(2,'0')}</option>`;
    }
  }
}

async function cargar(){

  const res = await fetch(url);
  let data = await res.json();

  document.getElementById("loading").style.display="none";

  if(filtro !== "TODOS"){
    data = data.filter(v => v.tipo === filtro);
  }

  document.getElementById("tablon").innerHTML = data.reverse().map(v => `

  <div class="tarjeta">
    <div class="titulo">${v.tipo}</div>
    <div class="ruta">📍 ${v.desde} → ${v.hasta}</div>
    <div class="info">📅 ${v.fecha} | ⏰ ${v.hora}</div>
    <div class="info">🙋 ${v.nombre}</div>

    <a class="btn-wa"
      href="https://wa.me/34${v.telefono}"
      target="_blank">
      WhatsApp
    </a>
  </div>

  `).join("");
}

async function enviar(e){
  e.preventDefault();

  const payload = {
    tipo: tipo.value,
    desde: desde.value,
    hasta: hasta.value,
    fecha: fecha.value,
    hora: hora.value,
    nombre: nombre.value,
    telefono: telefono.value
  };

  await fetch(url,{
    method:"POST",
    body:JSON.stringify(payload)
  });

  document.getElementById("form").style.display="none";
  cargar();
}

horas();
cargar();

</script>

</body>
</html>

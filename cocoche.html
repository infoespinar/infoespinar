<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes Compartidos | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

:root{--menta:#20a088;--fondo:#f4f6f9;}

body{
    font-family:'Lato',sans-serif;
    background:var(--fondo);
    color:#334155;
    padding-bottom:50px;
}

.header{
    background:var(--menta);
    padding:15px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.header-logo{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
}

.header-bandera{
    width:28px;
    height:28px;
    object-fit:cover;
    border-radius:4px;
}

.header h1{
    font-size:18px;
    font-weight:900;
}

.contenedor-app{
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

h2.titulo-seccion{
    text-align:center;
    margin:20px 0 5px;
}

.subtitulo{
    text-align:center;
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

.btn-publicar{
    display:block;
    width:250px;
    margin:0 auto 30px;
    padding:14px;
    background:var(--menta);
    color:white;
    border:none;
    border-radius:30px;
    font-weight:700;
}

#form{
    background:white;
    padding:25px;
    border-radius:16px;
    border:1px solid #e2e8f0;
    display:none;
    margin-bottom:40px;
}

input,select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

.grid-anuncios{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.tarjeta{
    background:white;
    padding:15px;
    border-radius:12px;
    border:1px solid #e2e8f0;
}

.titulo-tarjeta{
    font-weight:900;
    font-size:18px;
    margin-bottom:10px;
}

.descripcion{
    font-size:14px;
    white-space:pre-line;
    margin-bottom:10px;
}

.tag{
    background:#f1f5f9;
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
}

.btn-wa{
    display:block;
    text-align:center;
    padding:10px;
    background:#25d366;
    color:white;
    border-radius:8px;
    text-decoration:none;
}
</style>
</head>

<body>

<header class="header">
    <a class="header-logo" href="#">
        <img class="header-bandera" src="https://i.imgur.com/di5CaLV.png">
        <h1>INFOESPINAR.COM</h1>
    </a>
</header>

<div class="contenedor-app">

<h2 class="titulo-seccion">Viajes Compartidos</h2>
<div class="subtitulo">Los viajes tienen una caducidad de 7 días</div>

<button class="btn-publicar" onclick="toggleFormulario()">➕ PUBLICAR VIAJE</button>

<div id="form">

<form id="publicarForm" onsubmit="enviar(event)">

<select id="tipo" required>
<option value="">¿Qué buscas?</option>
<option value="CONDUCTOR">🚗 Soy conductor</option>
<option value="PASAJERO">🙋 Soy pasajero</option>
</select>

<div style="display:flex;gap:10px;">
<div style="flex:1;">
<select id="desde" required onchange="controlarOtro('desde')">
<option value="">Desde</option>
<option>El Espinar</option>
<option>San Rafael</option>
<option>LASR</option>
<option>La Estación</option>
<option>Segovia</option>
<option>Madrid</option>
<option value="Otro">Otro</option>
</select>
<input id="desdeOtro" class="oculto" placeholder="Escribe origen">
</div>

<div style="flex:1;">
<select id="hasta" required onchange="controlarOtro('hasta')">
<option value="">Hasta</option>
<option>El Espinar</option>
<option>San Rafael</option>
<option>LASR</option>
<option>La Estación</option>
<option>Segovia</option>
<option>Madrid</option>
<option value="Otro">Otro</option>
</select>
<input id="hastaOtro" class="oculto" placeholder="Escribe destino">
</div>
</div>

<input type="date" id="fecha" required>
<select id="hora" required></select>

<input id="nombre" placeholder="Nombre" required>

<input type="tel" id="telefono" maxlength="9" pattern="[0-9]{9}" placeholder="Teléfono" required>

<button type="button" class="btn-publicar" onclick="previsualizarWhatsapp()">📲 WhatsApp</button>
<button type="submit" class="btn-publicar" id="btn">PUBLICAR VIAJE</button>

</form>

</div>

<div id="loading">Cargando viajes...</div>
<div id="tablon" class="grid-anuncios"></div>

</div>

<script>

const urlScript = "https://script.google.com/macros/s/AKfycbynbarvkvs_ETBnocznNlrT_01uoSeQwRuPdddewPLfRcM3ZG9iuz0IQan291_Vj2ai/exec";

function toggleFormulario(){
    const f=document.getElementById("form");
    f.style.display=f.style.display==="block"?"none":"block";
    if(f.style.display==="block") f.scrollIntoView({behavior:"smooth"});
}

function generarHoras(){
    const h=document.getElementById("hora");
    for(let i=0;i<24;i++){
        for(let m=0;m<60;m+=15){
            h.innerHTML+=`<option>${String(i).padStart(2,"0")}:${String(m).padStart(2,"0")}</option>`;
        }
    }
}

function controlarOtro(id){
    const sel=document.getElementById(id);
    const otro=document.getElementById(id+"Otro");
    if(sel.value==="Otro"){otro.style.display="block";}
    else{otro.style.display="none";}
}

function obtener(id){
    const v=document.getElementById(id).value;
    if(v==="Otro") return document.getElementById(id+"Otro").value;
    return v;
}

function esReciente(f){
    const d=new Date(f);
    if(isNaN(d)) return false;
    const lim=new Date();
    lim.setDate(lim.getDate()-7);
    return d>=lim;
}

function horaMin(h){
    const [a,b]=h.split(":").map(Number);
    return a*60+b;
}

function construirMensaje(){
    return `🚗 NUEVO VIAJE

👤 ${document.getElementById("tipo").value}
📍 ${obtener("desde")} → ${obtener("hasta")}
📅 ${document.getElementById("fecha").value}
⏰ ${document.getElementById("hora").value}
🙋 ${document.getElementById("nombre").value}`;
}

function previsualizarWhatsapp(){
    window.open(`https://wa.me/?text=${encodeURIComponent(construirMensaje())}`);
}

function cargar(){

fetch(urlScript)
.then(r=>r.json())
.then(data=>{

document.getElementById("loading").style.display="none";

const filtrados=data
.filter(a=>esReciente(a.fecha))
.sort((a,b)=>{

const da=new Date(a.fecha), db=new Date(b.fecha);
if(da-db!==0) return da-db;

return horaMin(a.hora)-horaMin(b.hora);

});

document.getElementById("tablon").innerHTML=
filtrados.map(a=>`

<div class="tarjeta">

<div class="titulo-tarjeta">
${a.tipo}
</div>

<div class="descripcion">
📍 ${a.desde} → ${a.hasta}
📅 ${a.fecha}
⏰ ${a.hora}
🙋 ${a.nombre}
</div>

<a class="btn-wa"
href="https://wa.me/34${a.telefono}"
target="_blank">WhatsApp</a>

</div>

`).join("");

});

}

function enviar(e){
e.preventDefault();

const btn=document.getElementById("btn");
btn.disabled=true;

fetch(urlScript,{
method:"POST",
body:JSON.stringify({
tipo:obtener("tipo"),
desde:obtener("desde"),
hasta:obtener("hasta"),
fecha:document.getElementById("fecha").value,
hora:document.getElementById("hora").value,
nombre:document.getElementById("nombre").value,
telefono:document.getElementById("telefono").value
})
}).then(()=>{
btn.disabled=false;
document.getElementById("form").style.display="none";
document.getElementById("publicarForm").reset();
cargar();
});

}

generarHoras();
cargar();

</script>

</body>
</html>

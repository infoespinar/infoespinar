<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes Compartidos | infoespinar.com</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

:root{
    --menta:#20a088;
    --fondo:#f4f6f9;
}

body{
    font-family:'Lato',sans-serif;
    background:var(--fondo);
    color:#334155;
    padding-bottom:50px;
}

/* HEADER IGUAL SIMPLE */
.header{
    background:var(--menta);
    padding:15px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.header a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
}

.header img{
    width:28px;
    height:28px;
    border-radius:4px;
}

.header h1{
    font-size:18px;
    font-weight:900;
}

/* CONTENIDO */
.contenedor-app{
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

h2{
    text-align:center;
    margin:20px 0 5px;
    font-size:24px;
}

.subtitulo{
    text-align:center;
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

/* BOTÓN */
.btn-publicar{
    display:block;
    width:250px;
    margin:0 auto 20px;
    padding:14px;
    background:var(--menta);
    color:white;
    border:none;
    border-radius:30px;
    font-weight:700;
    cursor:pointer;
}

/* FORM */
#form{
    background:white;
    padding:20px;
    border-radius:14px;
    display:none;
    margin-bottom:30px;
}

input,select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

.fila{
    display:flex;
    gap:10px;
}

.fila > div{flex:1;}

.oculto{display:none;}

/* TARJETAS */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    border:1px solid #e2e8f0;
}

.titulo{
    font-weight:900;
    margin-bottom:10px;
}

.tag{
    display:inline-block;
    padding:4px 8px;
    font-size:11px;
    background:#f1f5f9;
    border-radius:20px;
    margin-top:8px;
}

/* WHATSAPP */
.wa{
    display:block;
    margin-top:10px;
    background:#25d366;
    color:white;
    text-align:center;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
    font-weight:700;
}
</style>
</head>

<body>

<header class="header">
    <a href="/index.html">
        <img src="https://i.imgur.com/di5CaLV.png">
        <h1>infoespinar.com</h1>
    </a>
</header>

<div class="contenedor-app">

<h2>Viajes Compartidos</h2>
<div class="subtitulo">Los viajes tienen una caducidad de 7 días</div>

<button class="btn-publicar" onclick="toggle()">➕ PUBLICAR VIAJE</button>

<div id="form">

<form onsubmit="enviar(event)">

<select id="tipo">
<option value="">Tipo</option>
<option value="​🚘 CONDUCTOR">🚘​ Conductor</option>
<option value="🙋​ PASAJERO">🙋​ Pasajero</option>
</select>

<div class="fila">
<div>
<select id="desde" onchange="otro('desde')">
<option value="">Desde</option>
<option>El Espinar</option>
<option>San Rafael</option>
<option>LASR</option>
<option>La Estación</option>
<option>Madrid</option>
<option>Segoviar</option>
<option>Ávila</option>
<option value="Otro">Otro</option>
</select>
<input id="desdeOtro" class="oculto" placeholder="Escribe origen">
</div>

<div>
<select id="hasta" onchange="otro('hasta')">
<option value="">Hasta</option>
<option>El Espinar</option>
<option>San Rafael</option>
<option>LASR</option>
<option>La Estación</option>
<option>Madrid</option>
<option>Segoviar</option>
<option>Ávila</option>
<option value="Otro">Otro</option>
</select>
<input id="hastaOtro" class="oculto" placeholder="Escribe destino">
</div>
</div>

<div class="fila">
<input type="date" id="fecha">
<select id="hora"></select>
</div>

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">

<button type="button" class="btn-publicar" onclick="wa()">WhatsApp</button>
<button class="btn-publicar">PUBLICAR</button>

</form>

</div>

<div id="grid" class="grid"></div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbynbarvkvs_ETBnocznNlrT_01uoSeQwRuPdddewPLfRcM3ZG9iuz0IQan291_Vj2ai/exec";

function toggle(){
 document.getElementById("form").style.display =
 document.getElementById("form").style.display==="block"?"none":"block";
}

function otro(id){
 let sel=document.getElementById(id);
 document.getElementById(id+"Otro").style.display =
 sel.value==="Otro"?"block":"none";
}

function horas(){
 let h=document.getElementById("hora");
 for(let i=0;i<24;i++){
  for(let j=0;j<60;j+=15){
   let v=`${String(i).padStart(2,'0')}:${String(j).padStart(2,'0')}`;
   h.innerHTML+=`<option>${v}</option>`;
  }
 }
}

function construirMensajeWhatsApp(){

    const tipo = document.getElementById("tipo").value;
    const desde = obtenerValor("desde");
    const hasta = obtenerValor("hasta");
    const fecha = document.getElementById("fecha").value;
    const hora = document.getElementById("hora").value;
    const nombre = document.getElementById("nombre").value;
    const telefono = document.getElementById("telefono").value;

    return `🚗 NUEVO VIAJE

📌 Tipo: ${tipo}
📍 De: ${desde}
🏁 A: ${hasta}
📅 Fecha: ${fecha}
⏰ Hora: ${hora}
👤 Nombre: ${nombre}`;
}

async function cargar(){
 let r=await fetch(url);
 let d=await r.json();
 document.getElementById("grid").innerHTML=
 d.map(=>`
 <div class="card">
 <div class="titulo">${v.tipo}</div>
 📍 ${v.desde} → ${v.hasta}<br>
 📅 ${v.fecha}<br>
 ⏰ ${v.hora}<br>
 👤 ${v.nombre}<br>
 <a class="wa" href="https://wa.me/34${v.telefono}">WhatsApp</a>
 </div>
 `).join("");
}

async function enviar(e){
 e.preventDefault();

 let payload={
  tipo:tipo.value,
  desde:desde.value,
  hasta:hasta.value,
  fecha:fecha.value,
  hora:hora.value,
  nombre:nombre.value,
  telefono:telefono.value
 };

 await fetch(url,{method:"POST",body:JSON.stringify(payload)});
 form.reset();
 cargar();
}

horas();
cargar();
setInterval(()=>cargar(),60000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b3201f">
<title>Viaje a China</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;background:#1c1412;color:#2a1a14}
button{font-family:system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid #c8962b;outline-offset:3px}
[hidden]{display:none!important}
.pista{position:fixed;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,.25);z-index:19;pointer-events:none}
.progreso{position:fixed;top:0;left:0;height:5px;width:0;background:linear-gradient(90deg,#ffd36b,#b3201f);z-index:20;pointer-events:none;transition:width .2s ease}
.car{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;background:#fbf4e6;position:relative;overflow:hidden;isolation:isolate}
.art{flex:0 0 32vh;flex:0 0 32dvh;position:relative;overflow:hidden}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.content{position:relative;flex:1;min-height:0}
.txt{height:100%;overflow-y:auto;padding:16px 22px calc(76px + env(safe-area-inset-bottom,0px));position:relative;z-index:2;-webkit-overflow-scrolling:touch}
.tag{display:inline-block;font:600 .75rem system-ui,sans-serif;padding:4px 11px;border-radius:20px;background:#e8d9bd;color:#5b4636;margin-bottom:8px}
.now .tag{background:#b3201f;color:white}
.past .tag{background:#dfe9d8;color:#3c5a35}
.past .art{filter:saturate(.85);opacity:.92}
.day{font:600 .9rem system-ui,sans-serif;color:#7a6558;margin-bottom:5px}
.city{font-size:1.65rem;line-height:1.15;margin:0;color:#b3201f}
.zh{font-size:1rem;color:#8a6a1f;letter-spacing:.1em;margin-top:5px}
.ttl{font-size:1.1rem;margin:12px 0 7px}
.desc{font-size:.97rem;line-height:1.5;margin:0}
.more,.back{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(179,32,31,.22);border-radius:22px;color:#a0221e;background:rgba(179,32,31,.06);padding:9px 13px;font-size:.82rem}
.more{margin-top:15px}
.gesture{font:.73rem system-ui,sans-serif;color:#8b7867;margin:8px 0 0}
.details,.map-panel{position:absolute;inset:0;z-index:4;background:#fbf4e6;overflow-y:auto;padding:16px 22px calc(76px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;animation:panelIn .25s ease}
.map-panel{overflow-y:auto;padding:16px 18px calc(76px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;animation:panelIn .25s ease}
.map-panel h3{color:#b3201f;font-size:1.25rem;margin:14px 0 6px}
.map-panel .map-art{width:100%;display:block;border-radius:12px;overflow:hidden;background:#efe3cb;border:1px solid #e5d4b5}
.map-panel .map-art svg{display:block;width:100%;height:auto;max-height:48vh}
.map-cap{font:700 1rem Georgia,serif;color:#7d1110;margin:18px 2px 8px}
.map-panel h3{color:#b3201f;font-size:1.3rem;margin:15px 0 8px}
.detail-block{margin:17px 0}
.detail-block h4{color:#8a6a1f;font:600 .86rem system-ui,sans-serif;margin:0 0 6px}
.detail-block p{font-size:.98rem;line-height:1.6;margin:0}
@keyframes panelIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.card.entering .txt{animation:textIn .45s ease both}
@keyframes textIn{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:none}}
.adorno{position:absolute;left:0;right:0;bottom:0;height:74px;opacity:.16;pointer-events:none;z-index:1}
.adorno svg{width:100%;height:100%;display:block}
.bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:8;background:rgba(28,20,18,.72);color:white;font:600 .8rem system-ui,sans-serif;padding:6px 14px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#8e1413,#b3201f 55%,#c8962b);color:white;padding:70px 24px 85px}
.hero h1{font-size:2.4rem;margin:0 0 7px}
.hero h2{font-size:2rem;margin:0 0 10px}
.hero .big{font-size:1.5rem;margin:20px 0 8px}
.hero p{font-size:1.05rem;line-height:1.5;margin:5px 0;opacity:.94}
.hero .zh{font-size:1.6rem;color:#ffe3a0}
.hint{margin-top:25px;font:.9rem system-ui,sans-serif;opacity:.8}
.hero .nota{font-size:.85rem;opacity:.85;margin:16px auto 0;max-width:300px;line-height:1.4}
.hero .adorno{opacity:.25}
.hero .adorno svg{color:#ffe3a0}
#btnInicio,#btnMusica{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;width:38px;height:38px;border:0;border-radius:50%;padding:0;background:rgba(28,20,18,.55);color:rgba(255,255,255,.85);font:600 1rem system-ui,sans-serif;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#btnInicio{left:14px}
#btnMusica{right:14px;font-size:1.35rem;font-weight:400;padding-bottom:2px}
#btnInicio:hover,#btnMusica:hover{background:rgba(28,20,18,.75);color:white}
.aviso-musica{position:fixed;right:54px;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:13;max-width:175px;padding:10px 14px;border:1px solid rgba(255,227,160,.65);border-radius:22px;background:rgba(93,16,15,.92);color:#ffe3a0;font:600 .78rem system-ui,sans-serif;line-height:1.25;text-align:center;box-shadow:0 5px 16px rgba(0,0,0,.25);animation:flotarMusica 2.4s ease-in-out infinite}
@keyframes flotarMusica{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(max-height:600px){.art{flex-basis:26vh;flex-basis:26dvh}.txt,.details{padding-top:12px}.city{font-size:1.4rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="pista" aria-hidden="true"></div>
<div class="progreso" id="progreso" aria-hidden="true"></div>
<div class="bar" id="bar"></div>
<main class="car" id="car" aria-label="Diario del viaje a China"></main>
<audio id="musica" src="musica/china.mp3" loop preload="metadata"></audio>
<button type="button" id="btnInicio" aria-label="Volver al inicio" title="Volver al inicio">↑</button>
<button type="button" id="btnMusica" aria-label="Música de fondo" aria-pressed="false" title="Reproducir música">♪</button>
<div class="aviso-musica" id="avisoMusica">¿Ponemos banda sonora? →</div>
<div id="audioEstado" class="sr-only" role="status"></div>
<noscript>Activa JavaScript para ver el diario del viaje.</noscript>

{fecha:"2026-10-18",ciudad:"Pekín",zh:"北京",arte:"muralla",

{fecha:"2026-10-19",ciudad:"Pekín → Zhangjiajie",zh:"北京 · 张家界",arte:"templo",

function textoMapa(d){
  if(d.arte==="avion") return d.fecha==="2026-10-16" ? "Vuelo internacional desde Madrid hasta Pekín." : "Regreso a casa desde Chongqing, con escala en Roma.";
  if(d.ciudad.includes("→")) return "Trayecto entre las ciudades de esta etapa. La línea representa el desplazamiento de forma esquemática.";
  return "Mapa ilustrado de la zona y de los lugares destacados en el plan de hoy. Es una vista orientativa, no un mapa de navegación.";
}

 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

 };

 const names=d.ciudad.split('→').map(x=>x.trim());
 // International flight: recognizable simplified continents with Spain and China in their real relative positions.
 if(d.arte==='avion'){

   return frame(`${world}<path d="M20 252H340" stroke="#cbb99a" stroke-width="1"/><text x="180" y="268" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#806c5c">Ruta aérea · distancias aproximadas</text>${c}`);
 }

   };
   const a=pts[names[0]]||[70,190], b=pts[names[1]]||[285,105];
   const isFlight=d.fecha==='2026-10-19'||d.fecha==='2026-11-02';
   const route=line(a[0],a[1],b[0],b[1],isFlight);
   const land=`<path d="M34 70L73 48 110 57 135 77 163 70 188 83 218 72 249 86 278 70 323 88 339 118 318 142 330 166 300 189 286 216 253 233 223 226 203 248 173 233 152 209 122 216 105 192 76 186 59 157 36 143Z" fill="#d2dfc5" stroke="#b5c9ac" stroke-width="1.2"/><path d="M48 116Q98 94 143 120T233 121T318 130M62 171Q112 146 158 168T260 174T315 164M112 64Q127 109 115 154T145 221M205 82Q185 126 208 164T224 222M274 91Q251 128 275 170T254 215" stroke="#f8f0df" stroke-width="3" fill="none"/><path d="M90 82Q115 113 105 146T128 199" stroke="#8fc9d0" stroke-width="7" fill="none" opacity=".9"/>`;
   const icon=isFlight?`<g transform="translate(${(a[0]+b[0])/2} ${(a[1]+b[1])/2-8}) rotate(-25)" fill="#b3201f"><path d="M-12 0L-2 -3L-5 -13L-1 -14L5 -4L14 -1Q17 0 14 2L5 4L-1 14L-5 13L-2 3Z"/></g>`:`<g transform="translate(${(a[0]+b[0])/2} ${(a[1]+b[1])/2-4})" fill="#b3201f"><rect x="-10" y="-7" width="20" height="14" rx="3"/><rect x="-6" y="-4" width="5" height="4" fill="#f8edda"/><rect x="2" y="-4" width="5" height="4" fill="#f8edda"/><circle cx="-5" cy="8" r="2.5"/><circle cx="5" cy="8" r="2.5"/></g>`;
   return frame(`${land}${route}${icon}${pin(a[0],a[1],names[0],a[0]>b[0]?'end':'start')}${pin(b[0],b[1],names[1],b[0]<a[0]?'end':'start')}<text x="180" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#806c5c">${isFlight?'Vuelo · posición relativa':'Trayecto terrestre · posición relativa'}</text>`);

 else if(city==='Chongqing') landmarks=[['Jiefangbei',164,135],['Hongyadong',205,111],['Liziba',81,97],['Río Yangtsé',267,210]];
 else if(city==='Furong') landmarks=[['Cascada',166,121],['Casco antiguo',209,147],['Puente',126,177],['Río',245,201]];
 else landmarks=[[city,180,150]];
 let roads='';
 for(let y=48;y<260;y+=31) roads+=`<path d="M10 ${y}Q130 ${y-15} 350 ${y+9}" stroke="#fff9ec" stroke-width="4" fill="none"/>`;
 for(let x=28;x<350;x+=43) roads+=`<path d="M${x} 42Q${x+20} 140 ${x-7} 265" stroke="#fff9ec" stroke-width="3.5" fill="none"/>`;
 // Water is placed only where it helps orient the eye, not as a navigationally precise river trace.
 let water='';
 if(['Fenghuang','Furong','Yangshuo','Chongqing'].includes(city)) water=`<path d="M-5 184Q65 157 112 179T220 174T365 190" stroke="#8fc9d0" stroke-width="13" fill="none" opacity=".95"/>`;
 const marks=landmarks.map(([name,x,y])=>pin(x,y,name,'start')).join('');
 return frame(`<path d="M20 40Q80 32 130 48T245 40T350 53V260H20Z" fill="#d2dfc5" opacity=".55"/>${roads}${water}${marks}<text x="180" y="282" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#806c5c">${esc(city)} · puntos aproximados</text>`);
}

 // Días 5 y 6 del viaje: ilustraciones propias en formato PNG.
 if(f==="2026-10-20") return `<img class="foto-ampliable" src="fotos/5.png" alt="Ilustración de Zhangjiajie: arroyo y cueva del dragón" loading="lazy" style="display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:12px;margin-top:14px">`;
 if(f==="2026-10-21") return `<img class="foto-ampliable" src="fotos/6.png" alt="Ilustración de Zhangjiajie: montañas de Avatar, ascensor Bailong y teleférico" loading="lazy" style="display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:12px;margin-top:14px">`;
 if(["2026-10-22","2026-10-23","2026-10-24","2026-10-25","2026-10-28","2026-10-30","2026-11-01"].includes(f)) return "";
 if(f==="2026-10-29") return `<img class="foto-ampliable" src="fotos/14.jpeg" alt="Ilustración de Yangshuo: Amanecer sobre el " loading="lazy" style="display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:12px;margin-top:14px">`;
 if(f==="2026-10-21") return `<img class="foto-ampliable" src="fotos/6.png" alt="Ilustración de Zhangjiajie: montañas de Avatar, ascensor Bailong y teleférico" loading="lazy" style="display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:12px;margin-top:14px">`;
 const B=(t,sp,k)=>`<h4 class="map-cap">${t}</h4><div class="map-art">${mapaGeo(sp,n+"_"+k)}</div>`;
 const V=(t,sp,k)=>`<h4 class="map-cap">${t}</h4><div class="map-art">${mapaVuelo(sp,n+"_"+k)}</div>`;
 let h="",air=0;
 if(f==="2026-10-16"){h=V("Vuelo de Madrid a Pekín",mgFly16(),0);air=1}
 else if(f==="2026-11-02"){h=V("Vuelos de vuelta: Chongqing, Roma y Madrid",mgFly02(),0);air=1}
 else if(f==="2026-10-17")h=B("Ruta del día en el centro de Pekín",mgBJ(),0);
 else if(f==="2026-10-19")h=B("Palacio de Verano, Templo del Cielo y aeropuerto",mgBJ19(),0)+B("Vuelo de Pekín a Zhangjiajie",mgFly19(),1);
 else if(f==="2026-10-27")h=B("En tren de Fenghuang a Yangshuo",mgT27(),0);
 else if(f==="2026-10-31")h=B("En tren de Yangshuo a Chongqing",mgT31(),0);
 else return `<div class="map-art">${mapaSVG(d,n)}</div>`;
 return h;

const car=document.getElementById("car");
const progreso=document.getElementById("progreso");
const avisoMusica=document.getElementById("avisoMusica");
const reducido=window.matchMedia("(prefers-reduced-motion: reduce)");

function fechaZona(zona){
  const partes=new Intl.DateTimeFormat("en",{timeZone:zona,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const v=t=>partes.find(p=>p.type===t).value;
  return `${v("year")}-${v("month")}-${v("day")}`;
}
const parametro=new URLSearchParams(location.search).get("fecha");
function fechaValida(s){
  if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  const n=new Date(s+"T00:00:00Z");
  return !isNaN(n)&&n.toISOString().slice(0,10)===s;
}
const fechaPrueba=fechaValida(parametro)?parametro:null;
function hoy(){
  if(fechaPrueba)return fechaPrueba;
  const f=fechaZona("Asia/Shanghai");
  // El día 16 se desbloquea al despegar de Madrid (00:35 del 16, hora española = 22:35 UTC del 15)
  if(f==="2026-10-16"&&Date.now()<Date.UTC(2026,9,15,22,35))return "2026-10-15";
  return f;
}
function distancia(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000)}
function fechaTexto(s){return new Intl.DateTimeFormat("es-ES",{timeZone:"UTC",day:"numeric",month:"long"}).format(new Date(s+"T00:00:00Z"))}
function diaSemana(s){
  const t=new Intl.DateTimeFormat("es-ES",{timeZone:"UTC",weekday:"short"}).format(new Date(s+"T00:00:00Z"));
  return t.charAt(0).toUpperCase()+t.slice(1);
}

function desbloqueo(f){
  return f===D[0].fecha?Date.UTC(2026,9,15,22,35):Date.parse(f+"T00:00:00+08:00");
}
function cuando(f){
  const t=new Date(desbloqueo(f));
  const dia=new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",weekday:"long",day:"numeric",month:"long"}).format(t);
  const hora=new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit"}).format(t);
  return `${dia} a las ${hora}`;
}

let fechaMostrada="";
let observador=null;

function actualizarProgreso(){
  const total=car.scrollHeight-car.clientHeight;
  const porcentaje=total>0?car.scrollTop/total*100:0;
  progreso.style.width=Math.max(0,Math.min(100,porcentaje))+"%";
  if(car.scrollTop>80)avisoMusica.hidden=true;
}

function generarWeb(irAHoy){
  const fecha=hoy();
  fechaMostrada=fecha;
  const actual=D.find(d=>d.fecha===fecha);
  const primera=D[0].fecha;
  const ultima=D[D.length-1].fecha;
  let estado="";

  if(fecha<primera){
    const faltan=distancia(fecha,primera);
    estado=`<div class="big">Faltan ${faltan} ${faltan===1?"día":"días"}</div><p>para empezar nuestra aventura</p>`;
  }else if(fecha>ultima){
    estado=`<div class="big">¡Ya hemos vuelto!</div><p>Gracias por acompañarnos</p>`;
  }else{
    estado=`<div class="big">Hoy: ${actual.ciudad}</div><p>${actual.titulo}</p>`;
  }

  let html=`<section class="card hero"><h1>Viaje a China</h1><div class="zh">中国</div>${estado}<p>${fechaTexto(primera)} – ${fechaTexto(ultima)}</p><p class="nota">${fecha<primera?`El primer día se desbloquea el ${cuando(primera)} (hora de España), al despegar. Después, uno nuevo cada medianoche en China.`:"Cada día nuevo se desbloquea a medianoche en China."}</p><div class="hint">Desliza hacia arriba ↑</div>${adorno}</section>`;

  D.forEach((d,n)=>{
    if(d.fecha>fecha)return;
    const act=d.fecha===fecha;
    html+=`<section class="card day-card ${act?"now":"past"}" data-fecha="${d.fecha}" aria-label="${fechaTexto(d.fecha)}: ${d.ciudad}">
      <div class="art">${ilustracion(d,n)}<img src="fotos/dia-${d.fecha.slice(5)}.jpg" alt="${d.ciudad}" loading="lazy" onerror="this.remove()"></div>
      <div class="content">${adorno}
        <div class="txt" id="resumen-${n}">
          <span class="tag">${act?"📍 Hoy":"✓ Día pasado"} · Día ${n+1} de ${D.length}</span>
          <div class="day">${diaSemana(d.fecha)} ${fechaTexto(d.fecha)}</div>
          <h2 class="city">${d.ciudad}</h2>
          <div class="zh">${d.zh}</div>
          <h3 class="ttl">${d.titulo}</h3>
          <p class="desc">${d.resumen}</p>
          <button type="button" class="more" aria-expanded="false" aria-controls="detalle-${n}">＋ Más detalles</button>
          <p class="gesture">${["2026-10-22","2026-10-23","2026-10-28","2026-10-29","2026-10-30","2026-11-01"].includes(d.fecha)?"Desliza a la derecha para detalles":["2026-10-18","2026-10-20","2026-10-21","2026-10-24","2026-10-25","2026-10-26"].includes(d.fecha)?"Desliza a la derecha para detalles · a la izquierda para la foto":"Desliza a la derecha para detalles · a la izquierda para el mapa"}</p>
        </div>
        <div class="details" id="detalle-${n}" hidden role="region" aria-label="Información ampliada del ${fechaTexto(d.fecha)}">
          <button type="button" class="back">Resumen →</button>
          <div class="day" style="margin-top:14px">${fechaTexto(d.fecha)}</div>
          <h3>${d.titulo}</h3>
          ${d.detalles.map(([t,p])=>`<section class="detail-block"><h4>${t}</h4><p>${p}</p></section>`).join("")}
          <p class="gesture">Desliza hacia la izquierda para volver ←</p>
        </div>
        <div class="map-panel" id="mapa-${n}" hidden role="region" aria-label="Mapa del ${fechaTexto(d.fecha)}">
          <button type="button" class="back map-back">← Resumen</button>
          <div class="day" style="margin-top:14px">${fechaTexto(d.fecha)} · MAPA DEL DÍA</div>
          <h3>${d.ciudad}</h3>
          ${mapasDia(d,n)}
        </div>
      </div>
    </section>`;
  });

  const siguiente=D.find(d=>d.fecha>fecha);
  if(siguiente){
    const faltan=distancia(fecha,siguiente.fecha);
    html+=`<section class="card hero"><h2>Próxima etapa</h2><div class="zh">${siguiente.zh}</div><div class="big">${siguiente.ciudad}</div><p>${siguiente.titulo}</p><p>Se desbloquea el ${cuando(siguiente.fecha)} (hora de España)</p><div class="hint">${faltan===1?"Mañana, un nuevo día del viaje":`Faltan ${faltan} días`}</div>${adorno}</section>`;
  }

  if(observador)observador.disconnect();
  car.innerHTML=html;

  if("IntersectionObserver" in window){
    observador=new IntersectionObserver(es=>{es.forEach(e=>e.target.classList.toggle("entering",e.isIntersecting))},{root:car,threshold:.6});
    car.querySelectorAll(".day-card").forEach(c=>observador.observe(c));
  }
  if(irAHoy){
    const t=car.querySelector(".now");
    car.scrollTop=t?t.offsetTop:0;
  }
  avisoMusica.hidden=false;
  actualizarProgreso();
}

function cambiarPanel(card,tipo,enfocar){
  const resumen=card.querySelector(".txt");
  const details=card.querySelector(".details");
  const mapa=card.querySelector(".map-panel");
  const abrir=tipo!=="resumen";
  resumen.hidden=abrir; details.hidden=tipo!=="detalle"; mapa.hidden=tipo!=="mapa";
  const boton=resumen.querySelector(".more"); boton.setAttribute("aria-expanded",String(tipo==="detalle"));
  const panel=tipo==="detalle"?details:mapa;
  if(abrir){panel.scrollTop=0;if(enfocar)panel.querySelector(".back").focus();}else if(enfocar)boton.focus();
}
function cambiarDetalle(card,abrir,enfocar){cambiarPanel(card,abrir?"detalle":"resumen",enfocar)}

car.addEventListener("click",e=>{
  const abrir=e.target.closest(".more");
  const cerrar=e.target.closest(".back");
  const foto=e.target.closest(".foto-ampliable");
  if(abrir)cambiarPanel(abrir.closest(".day-card"),"detalle",true);
  if(cerrar)cambiarPanel(cerrar.closest(".day-card"),"resumen",true);
  if(foto){
    const visor=document.getElementById("visorFotoCompleta");
    const imagen=visor.querySelector("img");
    imagen.src=foto.currentSrc||foto.src;
    imagen.alt=foto.alt||"Fotografía del viaje";
    visor.hidden=false;
    document.body.style.overflow="hidden";
  }
});

// Visor a pantalla completa para ampliar las ilustraciones al tocarlas.
if(!document.getElementById("visorFotoCompleta")){
  const visor=document.createElement("div");
  visor.id="visorFotoCompleta";
  visor.hidden=true;
  visor.setAttribute("role","dialog");
  visor.setAttribute("aria-modal","true");
  visor.setAttribute("aria-label","Imagen ampliada");
  visor.innerHTML='<button type="button" class="visor-foto-cerrar" aria-label="Cerrar imagen">×</button><img alt="Imagen ampliada">';
  Object.assign(visor.style,{position:"fixed",inset:"0",zIndex:"99999",background:"rgba(10,10,15,.96)",display:"flex",alignItems:"center",justifyContent:"center",padding:"12px",boxSizing:"border-box"});
  visor.querySelector("img").style.cssText="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;cursor:zoom-out";
  const cerrarVisor=()=>{visor.hidden=true;visor.style.display="none";visor.querySelector("img").removeAttribute("src");document.body.style.overflow="";};
  const boton=visor.querySelector("button");
  boton.style.cssText="position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:white;font-size:32px;line-height:1;cursor:pointer";
  boton.addEventListener("click",cerrarVisor);
  visor.addEventListener("click",e=>{if(e.target===visor||e.target.tagName==="IMG")cerrarVisor();});
  document.body.appendChild(visor);
  const observadorVisor=new MutationObserver(()=>{if(visor.hidden)visor.style.display="none";else visor.style.display="flex";});
  observadorVisor.observe(visor,{attributes:true,attributeFilter:["hidden"]});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!visor.hidden)cerrarVisor();});
}

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  const panel=car.querySelector(".details:not([hidden]), .map-panel:not([hidden])");
  if(panel)cambiarPanel(panel.closest(".day-card"),"resumen",true);
});

let toque=null;
car.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){toque=null;return}
  const card=e.target.closest(".day-card");
  if(!card||e.target.closest("button,a")){toque=null;return}
  toque={card:card,x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});

car.addEventListener("touchend",e=>{
  if(!toque||!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-toque.x;
  const dy=e.changedTouches[0].clientY-toque.y;
  const card=toque.card;
  toque=null;
  if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.6)return;
  const details=card.querySelector(".details"), mapa=card.querySelector(".map-panel");
  const detalleAbierto=!details.hidden, mapaAbierto=!mapa.hidden;
  if(dx>0&&mapaAbierto)cambiarPanel(card,"resumen",false);
  else if(dx<0&&detalleAbierto)cambiarPanel(card,"resumen",false);
  else if(dx>0&&!detalleAbierto&&!mapaAbierto)cambiarPanel(card,"detalle",false);
  else if(dx<0&&!detalleAbierto&&!mapaAbierto&&! ["2026-10-22","2026-10-23","2026-10-28","2026-10-29","2026-10-30","2026-11-01"].includes(card.dataset.fecha))cambiarPanel(card,"mapa",false);
},{passive:true});

car.addEventListener("touchcancel",()=>{toque=null},{passive:true});
car.addEventListener("scroll",actualizarProgreso,{passive:true});
window.addEventListener("resize",actualizarProgreso);

document.getElementById("btnInicio").addEventListener("click",()=>{
  car.querySelectorAll(".details:not([hidden]), .map-panel:not([hidden])").forEach(p=>cambiarPanel(p.closest(".day-card"),"resumen",false));
  car.scrollTo({top:0,behavior:reducido.matches?"auto":"smooth"});
  avisoMusica.hidden=false;
});

function reloj(){
  const ahora=new Date();
  const hora=z=>new Intl.DateTimeFormat("es-ES",{timeZone:z,hour:"2-digit",minute:"2-digit"}).format(ahora);
  document.getElementById("bar").textContent="🇨🇳 "+hora("Asia/Shanghai")+" · 🇪🇸 "+hora("Europe/Madrid");
  if(hoy()!==fechaMostrada)generarWeb(true);
}

generarWeb(true);
reloj();
setInterval(reloj,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)reloj()});

const musica=document.getElementById("musica");
const btnMusica=document.getElementById("btnMusica");
const audioEstado=document.getElementById("audioEstado");
musica.volume=.35;

function actualizarAudio(){
  const activo=!musica.paused&&!musica.ended;
  btnMusica.textContent=activo?"⏸":"♪";
  btnMusica.setAttribute("aria-pressed",String(activo));
  btnMusica.title=activo?"Pausar música":"Reproducir música";
}
musica.addEventListener("play",actualizarAudio);
musica.addEventListener("pause",actualizarAudio);
musica.addEventListener("ended",actualizarAudio);

btnMusica.addEventListener("click",async()=>{
  avisoMusica.hidden=true;
  if(!musica.paused){musica.pause();return}
  try{
    await musica.play();
    audioEstado.textContent="Música activada";
  }catch(error){
    audioEstado.textContent="No se ha podido reproducir la música. Comprueba el archivo de audio.";
    btnMusica.title="No se pudo reproducir: vuelve a intentarlo";
    actualizarAudio();
  }
});
</script>

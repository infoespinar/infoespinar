<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salud | infoespinar.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght=300;400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Lato', sans-serif; background-color: #f4f6f9; color: #334155; padding: 15px 12px; }

        .titulo-seccion-principal { font-size: 26px; font-weight: 900; text-align: center; margin: 20px 0; text-transform: uppercase; }
        .txt-verde { color: #15803d; }
        .txt-marino { color: #1e3a8a; }

        .titulo-bloque { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #475569; margin: 25px 0 12px 4px; font-weight: 700; }

        .contenedor-mapa-fijo { width: 100%; height: 350px; margin-bottom: 25px; }
        .map-wrapper { width: 100%; height: 100%; overflow: hidden; border-radius: 14px; border: 1px solid #cbd5e1; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .map-wrapper iframe { position: absolute; top: -60px; left: 0; width: 100%; height: calc(100% + 60px); border: 0; }

        .contenedor-buscador { margin-bottom: 20px; width: 100%; }
        .input-buscador { width: 100%; padding: 14px 16px; font-size: 15px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; transition: border-color 0.2s; }
        .input-buscador:focus { border-color: #15803d; }

        .grid-comercios { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; padding-bottom: 25px; visibility: hidden; }
        .tarjeta-comercio { background: #ffffff; border: 1px solid #e2e8f0; border-top: 4px solid #15803d; border-radius: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; }
        .tarjeta-comercio.oficial-destacado { background: #f0fdf4; border-top: 6px solid #15803d; }
        .info-comercio { padding: 20px; flex-grow: 1; }
        .nombre-comercio { font-size: 19px; font-weight: 700; color: #15803d; margin-bottom: 5px; }
        .enlace-web { font-size: 13.5px; color: #475569; text-decoration: none; margin-bottom: 8px; display: block; }
        .direccion-comercio { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .burbuja-publico { background: #15803d; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
        .bloque-botones { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .fila-contacto { display: flex; gap: 10px; }
        .btn { text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 8px; text-align: center; color: #fff; }
        .btn-llamar { background: #000; flex: 1; }
        .btn-whatsapp { background: #10b981; flex: 1; }
        .btn-maps { background: #1a73e8; width: 100%; }
    </style>
</head>
<body>

    <h2 class="titulo-seccion-principal">
        <span class="txt-verde">Servicios</span> de <span class="txt-marino">Salud</span>
    </h2>

    <div class="contenedor-mapa-fijo">
        <div class="map-wrapper">
            <iframe src="https://www.google.com/maps/d/embed?mid=1l8Gp_pWX-_lUkx5XXRdN7pZHP6CXWqI&ehbc=2E312F&noprof=1"></iframe>
        </div>
    </div>

    <div class="contenedor-buscador">
        <input type="text" id="buscadorSalud" class="input-buscador" placeholder="🔍 Buscar centro médico, farmacia, dentista...">
    </div>

    <div class="grid-comercios" id="gridComercios">
        <div class="tarjeta-comercio oficial-destacado" data-oficial="true" data-search="centro de salud el espinar">
            <div class="info-comercio">
                <div class="nombre-comercio">Centro de Salud El Espinar</div>
                <span class="burbuja-publico">CENTRO PÚBLICO</span>
                <div class="direccion-comercio">📍 C. Cañada Mari García, 5</div>
                <div class="bloque-botones">
                    <a href="tel:+34921181602" class="btn btn-llamar">📞 Llamar</a>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
      const contenedor = document.getElementById("gridComercios");
      const buscador = document.getElementById("buscadorSalud");
      const tarjetas = Array.from(document.querySelectorAll(".tarjeta-comercio"));
      
      const oficiales = tarjetas.filter(t => t.dataset.oficial === "true");
      const privadas = tarjetas.filter(t => t.dataset.oficial !== "true");
      
      for (let i = privadas.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [privadas[i], privadas[j]] = [privadas[j], privadas[i]];
      }
      
      contenedor.innerHTML = '';
      oficiales.forEach(t => contenedor.appendChild(t));
      privadas.forEach(t => contenedor.appendChild(t));
      contenedor.style.visibility = "visible";

        const termino = this.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        document.querySelectorAll(".tarjeta-comercio").forEach(t => {

        });
        actualizarAltura();

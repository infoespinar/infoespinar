fc:"«Prohibida» porque nadie entraba ni salía sin permiso imperial. Una leyenda dice que tiene 9.999 habitaciones (el cielo tendría 10.000); en realidad son unas 8.700. El amarillo de los tejados era color exclusivo del emperador, y muchas puertas llevan 9×9 clavos dorados, porque el nueve era el número imperial. Se dice que casi no hay árboles en los patios principales para que nadie pudiera esconderse.",

const HI={
fc:"Cuando el emperador Yongle, tercero de los Ming, decidió trasladar la capital de Nankín a Pekín, ordenó construir un palacio a la medida de su poder. Las obras duraron de 1406 a 1420 y, según las crónicas, movilizaron a cientos de miles de artesanos y hasta un millón de trabajadores. La madera noble (nanmu) llegó de los bosques del suroeste, el mármol de las canteras de Fangshan y los ladrillos del pavimento, tan pulidos que se llamaban «ladrillos de oro», de Suzhou. Alrededor se excavó un foso de 52 metros de ancho y se alzaron murallas de 10 metros.\nLos Ming gobernaron desde aquí hasta 1644, cuando el último emperador, Chongzhen, se quitó la vida al caer la ciudad en manos de rebeldes. Los manchúes de los Qing se instalaron en el palacio y lo mantuvieron durante casi tres siglos. En 1912 el último emperador, el niño Puyi, abdicó, pero le dejaron vivir en la parte interior hasta 1924. En 1925 se abrió como Museo del Palacio.",
tian:"La puerta se levantó en 1420 con el nombre de Chengtianmen, «Puerta de la Sucesión Celestial», y se reconstruyó en 1651, cuando pasó a llamarse Tiananmen. Era la entrada ceremonial de la Ciudad Imperial: desde su balcón se leían los edictos del emperador. En 1919 fue el punto de partida del Movimiento del Cuatro de Mayo, un hito del nacionalismo y la modernización chinos.\nLa gran plaza es obra del siglo XX. Hasta 1949 era una explanada estrecha entre murallas; tras la fundación de la República Popular se despejó y en 1958-59 se amplió hasta su tamaño actual, con el Monumento a los Héroes del Pueblo y el Gran Palacio del Pueblo. El mausoleo de Mao se terminó en 1977. Por eso, más que un monumento antiguo, es un escenario de la historia moderna de China.",
lama:"Se construyó en 1694 como residencia de un hijo del emperador Kangxi, el príncipe Yong. Cuando el príncipe llegó al trono en 1722 como Yongzheng, la mitad del recinto se convirtió en palacio secundario, con tejas amarillas, reservadas al emperador. Su hijo Qianlong lo transformó en 1744 en templo budista tibetano de la escuela Gelug, un gesto político para cuidar la relación con Tíbet y Mongolia.\nGuarda un Buda Maitreya de 18 metros tallado en un solo tronco de sándalo, y la tradición cuenta que fue un regalo del VII Dalai Lama. Pekín conserva el templo casi intacto, y se dice que se salvó de los peores destrozos de la Revolución Cultural por la intervención de Zhou Enlai.",
mut:"La primera muralla en esta zona la levantó la dinastía Qi del Norte en el siglo VI. Los Ming reconstruyeron este tramo desde 1368 bajo el general Xu Da y lo reforzaron sobre todo a finales del siglo XVI con el general Qi Jiguang, que introdujo torres de vigilancia huecas para guardar soldados y armas. Su objetivo era frenar las incursiones mongolas al norte de la capital.\nMutianyu se restauró en los años ochenta y se abrió al turismo en 1986. Por eso conserva torres y almenas en buen estado y menos gente que otros tramos. El tobogán, lo más divertido de la visita, es un añadido moderno: sobre muros antiguos, pero con diversión del siglo XXI.",
sp:"En 1750 el emperador Qianlong mandó crear aquí el Jardín de las Ondas Claras como regalo de cumpleaños para su madre. Para ello excavó el lago Kunming, inspirado en el Lago del Oeste de Hangzhou, y con la tierra levantó la colina de la Longevidad. En 1860, durante la Segunda Guerra del Opio, tropas anglofrancesas saquearon e incendiaron la zona, y el cercano Palacio de Verano Antiguo quedó arruinado para siempre.\nLa emperatriz viuda Cixi lo reconstruyó entre 1886 y 1895 y lo rebautizó Yiheyuan, «Jardín de la Armonía Saludable». Fue su residencia de verano y también un lugar de encierro para el emperador Guangxu tras el golpe de 1898. En 1900 sufrió nuevos daños en la Rebelión de los Bóxers. Se abrió al público tras la caída del imperio y es Patrimonio de la Humanidad desde 1998.",
th:"Lo mandó construir Yongle en 1420, junto a la Ciudad Prohibida, como templo para rendir culto al Cielo y a la Tierra. En 1530 se separaron los cultos y desde 1534 quedó como Templo del Cielo. Los Qing lo ampliaron, sobre todo Qianlong.\nEl diseño es un mapa del cosmos: el Altar Circular representa el cielo y el recinto cuadrado, la tierra. El Salón de la Oración, de unos 38 metros de alto, tiene 28 columnas: cuatro para las estaciones, doce para los meses y doce para las horas chinas del día. Se quemó por un rayo en 1889 y se reconstruyó al año siguiente. En el solsticio de invierno, el emperador ayunaba y hacía aquí el sacrificio más solemne del año.",
wul:"Durante siglos fue un rincón apartado de Hunan, habitado por minorías tujia, miao y bai. Todo cambió en 1979, cuando el pintor Wu Guanzhong lo visitó y publicó sus bocetos y un texto alabando el paisaje. En 1982 se creó el primer parque forestal nacional de China, y en 1992 el área de Wulingyuan, de unos 260 km², recibió el título de Patrimonio de la Humanidad.\nLos más de 3.000 pilares de cuarcita nacieron hace unos 380 millones de años, cuando la zona era un fondo marino. Luego el terreno se elevó, y el agua, el hielo y la vegetación fueron abriendo grietas verticales y modelando las torres. Hoy Wulingyuan es uno de los paisajes más reconocibles de China.",
tm:"La montaña se llamaba Songliang hasta el año 263, cuando se cuenta que la ladera se abrió y dejó el arco de la Puerta del Cielo. El emperador Sun Xiu, del reino de Wu, lo interpretó como un presagio y la rebautizó Tianmen. Durante siglos fue un lugar de culto y peregrinación.\nEl turismo moderno llegó con el teleférico, inaugurado a mediados de los 2000 y de unos 7 km, que sube desde la ciudad hasta la cima. La carretera de Tongtian, con 99 curvas, representa el camino al cielo en la tradición china y los 999 escalones de la cueva simbolizan el número más alto de un solo dígito, un número de buena suerte.",
fh:"Fenghuang fue durante siglos un punto estratégico entre los territorios han y miao. Los Ming y los Qing construyeron en la comarca la Muralla Sur y guarniciones para controlar la región, y la ciudad creció como base militar y comercial junto al Tuojiang. Sus calles de piedra, sus murallas y las casas sobre pilotes son de ese periodo.\nSu fama literaria viene de Shen Congwen, nacido aquí en 1902, que describió la región en su novela Ciudad fronteriza (1934). El neozelandés Rewi Alley la llamó una de las ciudades pequeñas más hermosas de China. Según la leyenda, el nombre «fénix» se debe a un ave que se detuvo en el lugar, incapaz de irse por su belleza.",
fur:"Wangcun, el nombre original, es un pueblo tujia con unos 2.000 años de historia, levantado sobre una cascada de unos 60 metros en el río You. Fue un núcleo comercial de la etnia tujia, con casas de madera sobre pilotes pegadas al acantilado.\nSu fama moderna se debe a la película Hibiscus Town (Furong zhen, 1986), de Xie Jin, rodada en el lugar. El éxito fue tal que el pueblo adoptó oficialmente el nombre de la película. Hoy conserva el centro histórico con calles empedradas y el Palacio Tuwang, que recuerda a los jefes tujia.",
sj:"Es el primer espectáculo de la serie «Impression», creada por Zhang Yimou con otros directores y estrenada en 2004. Zhang Yimou es el cineasta de Sorgo rojo y el director de la ceremonia de apertura de los Juegos de Pekín 2008. Aquí utilizó el paisaje real: el río Li como escenario, doce picos iluminados como telón de fondo y cientos de lugareños, pescadores y campesinos, como actores.\nCuenta la leyenda de Liu Sanjie, una cantante de la etnia zhuang, que según la tradición ganó con sus versos y su ingenio a unos ricos letrados. La película musical de 1960 la hizo famosa en toda China. Los cantos zhuang son una de las formas de poesía popular más queridas de Guangxi.",
hp:"El hotpot de Chongqing nació, según la tradición, entre los estibadores del puerto del río Jialing, que cocinaban en un caldo hirviente las vísceras y los despojos que otros no querían. El plato subió de categoría con el tiempo y hoy es símbolo de la ciudad.\nEl caldo se hace con sebo de vaca, chiles y pimienta de Sichuan. Los chiles llegaron a China desde América en los siglos XVI y XVII y tardaron en entrar en la cocina de Sichuan, pero acabaron convertidos en su sello. Comerlo es una comida social: se pide, se cuece y se comparte en la mesa durante horas."};
